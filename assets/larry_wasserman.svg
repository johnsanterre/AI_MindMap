<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="4" y="4" width="792" height="392" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5C3D1E"/>
    </marker>
  </defs>
  <text x="400" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Larry Wasserman — One Map of All Statistics</text>
  <text x="400" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">&#8220;Schools of statistical thought are pedagogical conveniences, not laws of nature&#8221;</text>

  <!-- Satellite boxes -->
  <rect x="55" y="90" width="185" height="52" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="147" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">Frequentist Methods</text>
  <text x="147" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">tests, confidence, minimax</text>

  <rect x="560" y="90" width="185" height="52" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="652" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">Bayesian Methods</text>
  <text x="652" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">priors, posteriors</text>

  <rect x="40" y="230" width="200" height="52" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="140" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">Nonparametric Statistics</text>
  <text x="140" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">kernels, wavelets (2006)</text>

  <rect x="560" y="230" width="185" height="52" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="652" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">Machine Learning</text>
  <text x="652" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">joint appt: Stat + MLD</text>

  <rect x="290" y="310" width="220" height="52" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="400" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">Topological Data Analysis</text>
  <text x="400" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">inference for persistent homology</text>

  <!-- Arrows inward -->
  <line x1="240" y1="135" x2="300" y2="180" stroke="#C4A87A" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="560" y1="135" x2="500" y2="180" stroke="#C4A87A" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="240" y1="245" x2="300" y2="225" stroke="#C4A87A" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="560" y1="245" x2="500" y2="225" stroke="#C4A87A" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="400" y1="310" x2="400" y2="252" stroke="#C4A87A" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Central hub -->
  <rect x="285" y="180" width="230" height="68" fill="#5C3D1E"/>
  <text x="400" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#FDFAF4">Statistical Inference</text>
  <text x="400" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FDFAF4">All of Statistics (2004)</text>
  <text x="400" y="241" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FDFAF4">one technically honest map</text>

  <text x="147" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5C3D1E">CMU Statistics, 1988&#8211;</text>
  <text x="652" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5C3D1E">Normal Deviate blog (2012+)</text>
</svg>

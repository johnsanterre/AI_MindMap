<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Beta Distribution: Belief About a Probability</text>
  <!-- Axes -->
  <line x1="100" y1="330" x2="700" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="330" x2="100" y2="80" stroke="#333" stroke-width="2"/>
  <text x="400" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">p &#8212; the unknown rate, always between 0 and 1</text>
  <text x="56" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333" transform="rotate(-90,56,205)">Density</text>
  <text x="100" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">0</text>
  <text x="700" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">1</text>
  <!-- Flat prior Beta(1,1) -->
  <line x1="100" y1="262" x2="700" y2="262" stroke="#C4A87A" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="170" y="250" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">Beta(1,1) &#8212; no data yet: any rate equally plausible</text>
  <!-- After some data Beta(3,2)-ish, mild peak around 0.6 -->
  <path d="M100,330 C220,300 320,190 460,180 C560,178 650,290 700,330" fill="none" stroke="#2D5A8E" stroke-width="3"/>
  <text x="238" y="180" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">after 3 heads, 2 tails</text>
  <!-- After lots of data Beta(24,16)-ish, sharp peak around 0.6 -->
  <path d="M100,330 C300,330 380,326 430,200 C455,120 470,105 480,102 C490,105 505,120 530,200 C580,326 640,330 700,330" fill="none" stroke="#7C2530" stroke-width="3"/>
  <text x="492" y="92" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">after 24 heads, 16 tails</text>
  <!-- Arrow of sharpening -->
  <text x="620" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">more evidence &#8594;</text>
  <text x="620" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">sharper belief</text>
  <!-- Footer -->
  <text x="400" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7C2530">A distribution over a probability itself &#8212; the conjugate prior for coin flips: just add successes to &#945;, failures to &#946;.</text>
</svg>

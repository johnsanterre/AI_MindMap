<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Tokenization</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">text &#8594; subword pieces &#8594; integers the model can look up</text>

  <defs>
    <marker id="tkArr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#5C3D1E"/></marker>
  </defs>

  <!-- Raw text -->
  <rect x="230" y="88" width="340" height="42" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="400" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2D5A8E">"unbelievable"</text>
  <text x="600" y="115" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">raw text</text>

  <!-- Arrow -->
  <line x1="400" y1="132" x2="400" y2="168" stroke="#5C3D1E" stroke-width="2" marker-end="url(#tkArr)"/>
  <text x="420" y="155" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-style="italic">split by learned vocabulary (BPE)</text>

  <!-- Token pieces -->
  <rect x="255" y="178" width="80" height="42" fill="#C4A87A" opacity="0.35" stroke="#5C3D1E" stroke-width="2"/>
  <text x="295" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C3D1E" font-weight="bold">un</text>
  <rect x="345" y="178" width="110" height="42" fill="#C4A87A" opacity="0.35" stroke="#5C3D1E" stroke-width="2"/>
  <text x="400" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C3D1E" font-weight="bold">believ</text>
  <rect x="465" y="178" width="80" height="42" fill="#C4A87A" opacity="0.35" stroke="#5C3D1E" stroke-width="2"/>
  <text x="505" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C3D1E" font-weight="bold">able</text>
  <text x="600" y="205" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">subword tokens</text>

  <!-- Arrow -->
  <line x1="400" y1="222" x2="400" y2="258" stroke="#5C3D1E" stroke-width="2" marker-end="url(#tkArr)"/>
  <text x="420" y="245" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-style="italic">look up in vocabulary table</text>

  <!-- IDs -->
  <rect x="255" y="268" width="80" height="42" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="295" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#7C2530" font-weight="bold">517</text>
  <rect x="345" y="268" width="110" height="42" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="400" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#7C2530" font-weight="bold">28843</text>
  <rect x="465" y="268" width="80" height="42" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="505" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#7C2530" font-weight="bold">712</text>
  <text x="600" y="288" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">token IDs &#8594; rows of the</text>
  <text x="600" y="304" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">embedding matrix</text>

  <!-- Left side: the trade-off -->
  <text x="130" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">The trade-off</text>
  <text x="130" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">characters: tiny vocab,</text>
  <text x="130" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">very long sequences</text>
  <text x="130" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">whole words: huge vocab,</text>
  <text x="130" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">rare words missing</text>
  <text x="130" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-weight="bold">subwords: the middle</text>
  <text x="130" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-weight="bold">ground (30K&#8211;100K)</text>

  <!-- Bottom line -->
  <line x1="60" y1="335" x2="740" y2="335" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="400" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Like a typewriter with letter blocks: rare words snap together from common pieces, so nothing is ever out-of-vocabulary.</text>
</svg>

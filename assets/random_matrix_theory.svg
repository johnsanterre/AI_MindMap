<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Random Matrix Theory: A Ruler for the Face of Noise</text>
  <text x="400" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">Pure noise does not look flat &#8212; RMT says exactly how structured it looks, so signal can stand out</text>

  <!-- Left: noise matrix -->
  <text x="165" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Pure-noise data (n &#215; p)</text>
  <rect x="80" y="120" width="170" height="130" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <text x="165" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">0.3  &#8722;1.2   0.8   0.1</text>
  <text x="165" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">&#8722;0.5   0.7   1.1  &#8722;0.3</text>
  <text x="165" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">1.2   0.2  &#8722;0.9   0.6</text>
  <text x="165" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">0.1  &#8722;0.8   0.4   1.3</text>
  <text x="165" y="236" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">&#8226;&#8226;&#8226;</text>
  <text x="165" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">independent coin-flip entries,</text>
  <text x="165" y="293" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">yet its correlations look structured</text>

  <!-- arrow -->
  <line x1="262" y1="185" x2="308" y2="185" stroke="#5C3D1E" stroke-width="2"/>
  <path d="M 314 185 L 304 180 L 304 190 Z" fill="#5C3D1E"/>
  <text x="288" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">eigenvalues</text>

  <!-- Right: MP law -->
  <text x="540" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Mar&#269;enko&#8211;Pastur law: the shape of chance</text>
  <line x1="340" y1="300" x2="750" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="340" y1="300" x2="340" y2="120" stroke="#333" stroke-width="1.5"/>
  <text x="545" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">eigenvalue &#955;</text>
  <text x="330" y="130" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#333">density</text>

  <!-- MP bulk -->
  <path d="M 380,300 C 390,300 398,285 415,240 C 435,185 465,145 495,132 C 525,120 550,130 572,155 C 594,180 606,225 618,262 C 626,285 632,298 640,300 Z"
        fill="#2D5A8E" fill-opacity="0.15" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="500" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">the noise bulk</text>
  <text x="500" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2D5A8E">everything in here is</text>
  <text x="500" y="219" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2D5A8E">indistinguishable from chance</text>

  <!-- edge marker -->
  <line x1="640" y1="300" x2="640" y2="255" stroke="#5C3D1E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">bulk edge</text>

  <!-- signal spike -->
  <line x1="705" y1="300" x2="705" y2="160" stroke="#7C2530" stroke-width="4"/>
  <circle cx="705" cy="155" r="6" fill="#7C2530"/>
  <text x="705" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">signal</text>

  <text x="400" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-style="italic">Keep only eigenvalues that escape the bulk &#8212; a principled cutoff for PCA when p is large relative to n.</text>
</svg>

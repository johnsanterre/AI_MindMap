<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect x="0" y="0" width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">Model-Based RL: Learn the World, Plan Inside It</text>

  <!-- Real world box -->
  <rect x="50" y="70" width="200" height="90" rx="10" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="150" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#2D5A8E">Real Environment</text>
  <text x="150" y="130" text-anchor="middle" font-size="12" fill="#5C3D1E">expensive, slow, risky</text>

  <!-- Agent box -->
  <rect x="50" y="250" width="200" height="90" rx="10" fill="#FDFAF4" stroke="#7C2530" stroke-width="2.5"/>
  <text x="150" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#7C2530">Agent</text>
  <text x="150" y="310" text-anchor="middle" font-size="12" fill="#5C3D1E">acts, observes, learns</text>

  <!-- interaction arrows -->
  <line x1="120" y1="250" x2="120" y2="160" stroke="#7C2530" stroke-width="2"/>
  <polygon points="120,160 115,170 125,170" fill="#7C2530"/>
  <text x="106" y="208" text-anchor="end" font-size="12" fill="#7C2530">action</text>
  <line x1="180" y1="160" x2="180" y2="250" stroke="#2D5A8E" stroke-width="2"/>
  <polygon points="180,250 175,240 185,240" fill="#2D5A8E"/>
  <text x="194" y="208" font-size="12" fill="#2D5A8E">state, reward</text>

  <!-- learned model box -->
  <rect x="420" y="70" width="330" height="140" rx="10" fill="#FDFAF4" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="585" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#5C3D1E">Learned World Model</text>
  <text x="585" y="120" text-anchor="middle" font-size="13" fill="#5C3D1E">p(s' | s, a)  and  r(s, a)</text>

  <!-- imagined rollouts (small tree) -->
  <circle cx="500" cy="150" r="8" fill="#C4A87A" stroke="#5C3D1E" stroke-width="1.5"/>
  <line x1="506" y1="156" x2="545" y2="175" stroke="#C4A87A" stroke-width="2"/>
  <line x1="506" y1="144" x2="545" y2="135" stroke="#C4A87A" stroke-width="2"/>
  <circle cx="553" cy="135" r="8" fill="#C4A87A" stroke="#5C3D1E" stroke-width="1.5"/>
  <circle cx="553" cy="178" r="8" fill="#C4A87A" stroke="#5C3D1E" stroke-width="1.5"/>
  <line x1="561" y1="132" x2="600" y2="125" stroke="#C4A87A" stroke-width="2"/>
  <line x1="561" y1="181" x2="600" y2="188" stroke="#C4A87A" stroke-width="2"/>
  <circle cx="608" cy="124" r="8" fill="#7C2530"/>
  <circle cx="608" cy="189" r="8" fill="#2D5A8E"/>
  <text x="680" y="160" text-anchor="middle" font-size="12" font-style="italic" fill="#5C3D1E">imagined rollouts</text>

  <!-- learn model arrow -->
  <line x1="250" y1="115" x2="420" y2="115" stroke="#5C3D1E" stroke-width="2.5"/>
  <polygon points="420,115 408,109 408,121" fill="#5C3D1E"/>
  <text x="335" y="103" text-anchor="middle" font-size="13" fill="#5C3D1E">fit from experience</text>

  <!-- plan arrow down to agent -->
  <rect x="420" y="250" width="330" height="90" rx="10" fill="#FDFAF4" stroke="#C4A87A" stroke-width="2.5"/>
  <text x="585" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#5C3D1E">Planner</text>
  <text x="585" y="310" text-anchor="middle" font-size="12" fill="#5C3D1E">search / rollouts inside the model</text>

  <line x1="585" y1="210" x2="585" y2="250" stroke="#5C3D1E" stroke-width="2"/>
  <polygon points="585,250 580,240 590,240" fill="#5C3D1E"/>
  <text x="600" y="234" font-size="12" fill="#5C3D1E">simulate cheaply</text>

  <line x1="420" y1="295" x2="250" y2="295" stroke="#7C2530" stroke-width="2.5"/>
  <polygon points="250,295 262,289 262,301" fill="#7C2530"/>
  <text x="335" y="283" text-anchor="middle" font-size="13" fill="#7C2530">improved policy</text>

  <text x="400" y="375" text-anchor="middle" font-size="13" font-style="italic" fill="#5C3D1E">Few real interactions, many imagined ones — sample efficiency by rehearsal</text>
</svg>

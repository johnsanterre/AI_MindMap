<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="4" y="4" width="792" height="392" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">FTC and AI: Section 5 as the Lever</text>

  <!-- Hub: Section 5 -->
  <rect x="290" y="62" width="220" height="76" fill="#7C2530"/>
  <text x="400" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#FDFAF4">FTC Section 5 authority</text>
  <text x="400" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#FDFAF4">"unfair or deceptive acts or practices"</text>
  <text x="400" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FDFAF4">flexible &#8212; no new AI law required</text>

  <!-- Arrows to four harms -->
  <line x1="330" y1="138" x2="135" y2="188" stroke="#333" stroke-width="1.5"/>
  <line x1="378" y1="138" x2="320" y2="188" stroke="#333" stroke-width="1.5"/>
  <line x1="422" y1="138" x2="480" y2="188" stroke="#333" stroke-width="1.5"/>
  <line x1="470" y1="138" x2="665" y2="188" stroke="#333" stroke-width="1.5"/>

  <!-- Harm 1 -->
  <rect x="45" y="192" width="170" height="84" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="130" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Deceptive claims</text>
  <text x="130" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">overstated accuracy or</text>
  <text x="130" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">safety; undisclosed</text>
  <text x="130" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">AI testimonials</text>

  <!-- Harm 2 -->
  <rect x="235" y="192" width="170" height="84" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="320" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Dark patterns</text>
  <text x="320" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">AI-powered nudging and</text>
  <text x="320" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">manipulation of</text>
  <text x="320" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">consumer choice</text>

  <!-- Harm 3 -->
  <rect x="425" y="192" width="170" height="84" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="510" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Bias / discrimination</text>
  <text x="510" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">disparate impact in</text>
  <text x="510" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">lending, hiring,</text>
  <text x="510" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">and housing</text>

  <!-- Harm 4 -->
  <rect x="615" y="192" width="170" height="84" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="700" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Data privacy</text>
  <text x="700" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">consumer data used to</text>
  <text x="700" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">train models without</text>
  <text x="700" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">consent; surveillance</text>

  <!-- Bottom strip: actions / era -->
  <line x1="40" y1="300" x2="760" y2="300" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="400" y="324" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">FTC actions on AI</text>
  <text x="400" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">endorsement-disclosure guidance &#183; capability-claim investigations &#183; AI price-fixing scrutiny &#183; commercial-surveillance rulemaking</text>
  <text x="400" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">Lina Khan era (Chair 2021&#8211;2025): AI, tech concentration, and the surveillance business model at the center</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="arN" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2D5A8E"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#7C2530"/></marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Causal Modeling: Correlation Is Not Causation</text>

  <!-- Confounder DAG -->
  <ellipse cx="230" cy="120" rx="90" ry="32" fill="#FDFAF4" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="230" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5C3D1E">Hot weather (Z)</text>

  <ellipse cx="110" cy="260" rx="85" ry="32" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="110" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2D5A8E">Ice cream sales</text>

  <ellipse cx="360" cy="260" rx="80" ry="32" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="360" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2D5A8E">Drownings</text>

  <!-- true causal arrows from confounder -->
  <line x1="185" y1="147" x2="135" y2="225" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#arN)"/>
  <line x1="278" y1="146" x2="330" y2="225" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#arN)"/>

  <!-- spurious correlation -->
  <line x1="198" y1="270" x2="278" y2="270" stroke="#7C2530" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="238" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7C2530">correlated, not causal</text>

  <text x="238" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">The confounder Z drives both; banning</text>
  <text x="238" y="363" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">ice cream would save no one.</text>

  <!-- Right panel: seeing vs doing -->
  <line x1="480" y1="70" x2="480" y2="375" stroke="#D4C5A9" stroke-width="2"/>

  <text x="635" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#5C3D1E">Two different questions</text>

  <rect x="510" y="130" width="250" height="80" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="635" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">Seeing:  P(Y | T)</text>
  <text x="635" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">"What happens together?"</text>
  <text x="635" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">prediction from observation</text>

  <rect x="510" y="235" width="250" height="80" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="635" y="263" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">Doing:  P(Y | do(T))</text>
  <text x="635" y="287" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">"What if we intervened?"</text>
  <text x="635" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">the causal effect (Pearl)</text>

  <text x="635" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">Causal models close the gap by</text>
  <text x="635" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">controlling for confounders.</text>
</svg>

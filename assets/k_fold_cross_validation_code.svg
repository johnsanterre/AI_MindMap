<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="4" y="4" width="792" height="392" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">K-Fold Cross-Validation (k = 5)</text>

  <text x="105" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Each row = one fit</text>
  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Dataset split into 5 equal folds; the validation fold rotates</text>

  <!-- Fold 1 -->
  <text x="90" y="97" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">Fit 1</text>
  <rect x="110" y="80" width="100" height="26" fill="#7C2530"/>
  <rect x="210" y="80" width="100" height="26" fill="#C4A87A"/>
  <rect x="310" y="80" width="100" height="26" fill="#C4A87A"/>
  <rect x="410" y="80" width="100" height="26" fill="#C4A87A"/>
  <rect x="510" y="80" width="100" height="26" fill="#C4A87A"/>
  <text x="650" y="98" font-family="Georgia, serif" font-size="13" fill="#333">score&#8321;</text>

  <!-- Fold 2 -->
  <text x="90" y="131" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">Fit 2</text>
  <rect x="110" y="114" width="100" height="26" fill="#C4A87A"/>
  <rect x="210" y="114" width="100" height="26" fill="#7C2530"/>
  <rect x="310" y="114" width="100" height="26" fill="#C4A87A"/>
  <rect x="410" y="114" width="100" height="26" fill="#C4A87A"/>
  <rect x="510" y="114" width="100" height="26" fill="#C4A87A"/>
  <text x="650" y="132" font-family="Georgia, serif" font-size="13" fill="#333">score&#8322;</text>

  <!-- Fold 3 -->
  <text x="90" y="165" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">Fit 3</text>
  <rect x="110" y="148" width="100" height="26" fill="#C4A87A"/>
  <rect x="210" y="148" width="100" height="26" fill="#C4A87A"/>
  <rect x="310" y="148" width="100" height="26" fill="#7C2530"/>
  <rect x="410" y="148" width="100" height="26" fill="#C4A87A"/>
  <rect x="510" y="148" width="100" height="26" fill="#C4A87A"/>
  <text x="650" y="166" font-family="Georgia, serif" font-size="13" fill="#333">score&#8323;</text>

  <!-- Fold 4 -->
  <text x="90" y="199" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">Fit 4</text>
  <rect x="110" y="182" width="100" height="26" fill="#C4A87A"/>
  <rect x="210" y="182" width="100" height="26" fill="#C4A87A"/>
  <rect x="310" y="182" width="100" height="26" fill="#C4A87A"/>
  <rect x="410" y="182" width="100" height="26" fill="#7C2530"/>
  <rect x="510" y="182" width="100" height="26" fill="#C4A87A"/>
  <text x="650" y="200" font-family="Georgia, serif" font-size="13" fill="#333">score&#8324;</text>

  <!-- Fold 5 -->
  <text x="90" y="233" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">Fit 5</text>
  <rect x="110" y="216" width="100" height="26" fill="#C4A87A"/>
  <rect x="210" y="216" width="100" height="26" fill="#C4A87A"/>
  <rect x="310" y="216" width="100" height="26" fill="#C4A87A"/>
  <rect x="410" y="216" width="100" height="26" fill="#C4A87A"/>
  <rect x="510" y="216" width="100" height="26" fill="#7C2530"/>
  <text x="650" y="234" font-family="Georgia, serif" font-size="13" fill="#333">score&#8325;</text>

  <!-- Legend -->
  <rect x="110" y="262" width="18" height="18" fill="#C4A87A"/>
  <text x="136" y="276" font-family="Georgia, serif" font-size="13" fill="#333">train (4/5 of data)</text>
  <rect x="290" y="262" width="18" height="18" fill="#7C2530"/>
  <text x="316" y="276" font-family="Georgia, serif" font-size="13" fill="#333">validation (held-out fold)</text>

  <!-- Aggregate arrow -->
  <line x1="690" y1="90" x2="690" y2="228" stroke="#2D5A8E" stroke-width="1.5"/>
  <line x1="690" y1="228" x2="690" y2="252" stroke="#2D5A8E" stroke-width="1.5"/>
  <path d="M 690 252 l -4 -8 h 8 z" fill="#2D5A8E"/>
  <text x="690" y="276" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">mean &#177; std</text>

  <!-- Bottom notes -->
  <line x1="40" y1="300" x2="760" y2="300" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="400" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Every point is used for validation exactly once and for training k&#8722;1 times; report mean accuracy &#177; std across folds.</text>
  <text x="400" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">sklearn: KFold(n_splits=5, shuffle=True) &#8594; cross_val_score(model, X, y, cv=kf)</text>
  <text x="400" y="376" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">For classification prefer StratifiedKFold: each fold keeps the class proportions of the full dataset.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Actor–Critic: One Acts, One Evaluates</text>
  <defs>
    <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2D5A8E"/></marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#7C2530"/></marker>
    <marker id="abr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#5C3D1E"/></marker>
  </defs>
  <!-- Actor -->
  <rect x="90" y="110" width="180" height="100" rx="8" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="180" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#2D5A8E">Actor</text>
  <text x="180" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">policy &#960;(a | s)</text>
  <text x="180" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">chooses the action</text>
  <!-- Critic -->
  <rect x="530" y="110" width="180" height="100" rx="8" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="620" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#7C2530">Critic</text>
  <text x="620" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">value V(s)</text>
  <text x="620" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">scores each move now</text>
  <!-- Environment -->
  <rect x="300" y="290" width="200" height="66" rx="8" fill="#C4A87A" fill-opacity="0.25" stroke="#5C3D1E" stroke-width="2"/>
  <text x="400" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5C3D1E">Environment</text>
  <text x="400" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">returns next state s&#8242;, reward r</text>
  <!-- Actor -> Environment -->
  <path d="M180,210 Q190,290 298,314" fill="none" stroke="#2D5A8E" stroke-width="2" marker-end="url(#an)"/>
  <text x="200" y="270" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">action a</text>
  <!-- Environment -> Critic -->
  <path d="M502,314 Q610,290 620,212" fill="none" stroke="#7C2530" stroke-width="2" marker-end="url(#ard)"/>
  <text x="545" y="270" font-family="Georgia, serif" font-size="13" fill="#7C2530">state, reward</text>
  <!-- Critic -> Actor feedback -->
  <path d="M528,130 Q400,70 272,130" fill="none" stroke="#7C2530" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ard)"/>
  <text x="400" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">TD error: "better or worse than I expected?"</text>
  <!-- Key insight -->
  <text x="400" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">The critic's step-by-step feedback replaces waiting for the episode's final reward &#8212; both learn together.</text>
</svg>

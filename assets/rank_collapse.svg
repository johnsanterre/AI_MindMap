<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Rank Collapse: Twenty Singers Drifting to One Note</text>

  <!-- LEFT: full rank -->
  <text x="200" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Healthy matrix: rows point every way</text>
  <!-- fan of arrows from a hub -->
  <g stroke="#2D5A8E" stroke-width="2.5">
    <line x1="200" y1="190" x2="200" y2="120"/>
    <line x1="200" y1="190" x2="260" y2="135"/>
    <line x1="200" y1="190" x2="278" y2="185"/>
    <line x1="200" y1="190" x2="255" y2="240"/>
    <line x1="200" y1="190" x2="140" y2="238"/>
    <line x1="200" y1="190" x2="124" y2="170"/>
    <line x1="200" y1="190" x2="150" y2="128"/>
  </g>
  <circle cx="200" cy="190" r="4" fill="#2D5A8E"/>
  <!-- singular values healthy -->
  <line x1="110" y1="330" x2="300" y2="330" stroke="#333" stroke-width="1.5"/>
  <rect x="125" y="272" width="20" height="58" fill="#2D5A8E"/>
  <rect x="155" y="282" width="20" height="48" fill="#2D5A8E" opacity="0.85"/>
  <rect x="185" y="292" width="20" height="38" fill="#2D5A8E" opacity="0.7"/>
  <rect x="215" y="300" width="20" height="30" fill="#2D5A8E" opacity="0.55"/>
  <rect x="245" y="308" width="20" height="22" fill="#2D5A8E" opacity="0.45"/>
  <text x="200" y="349" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">singular values: many strong &#8594; rank &#8776; n</text>

  <!-- ARROW between panels -->
  <line x1="340" y1="200" x2="440" y2="200" stroke="#5C3D1E" stroke-width="2.5"/>
  <path d="M 448 200 L 436 194 L 436 206 Z" fill="#5C3D1E"/>
  <text x="394" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">training drifts</text>

  <!-- RIGHT: collapsed -->
  <text x="610" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Collapsed: rows nearly parallel</text>
  <g stroke="#7C2530" stroke-width="2.5">
    <line x1="560" y1="230" x2="668" y2="148"/>
    <line x1="565" y1="238" x2="673" y2="156"/>
    <line x1="572" y1="245" x2="678" y2="165"/>
    <line x1="580" y1="251" x2="684" y2="173"/>
    <line x1="589" y1="256" x2="691" y2="182"/>
  </g>
  <circle cx="560" cy="230" r="4" fill="#7C2530"/>
  <text x="570" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">same parameter count, one voice</text>
  <!-- singular values collapsed -->
  <line x1="520" y1="330" x2="710" y2="330" stroke="#333" stroke-width="1.5"/>
  <rect x="535" y="270" width="20" height="60" fill="#7C2530"/>
  <rect x="565" y="323" width="20" height="7" fill="#7C2530" opacity="0.5"/>
  <rect x="595" y="326" width="20" height="4" fill="#7C2530" opacity="0.4"/>
  <rect x="625" y="327" width="20" height="3" fill="#7C2530" opacity="0.3"/>
  <rect x="655" y="328" width="20" height="2" fill="#7C2530" opacity="0.25"/>
  <text x="615" y="349" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">&#963;&#8321; dwarfs the rest &#8594; effective rank &#8776; 1</text>

  <text x="400" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-style="italic">The network keeps its size, but its representational capacity quietly hollows out to a single direction.</text>
</svg>

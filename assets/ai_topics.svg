<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="4" y="4" width="792" height="392" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5C3D1E"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2D5A8E"/>
    </marker>
  </defs>
  <text x="400" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Applied Mathematics — The Bridge Discipline</text>

  <!-- Pure math (left) -->
  <rect x="45" y="120" width="180" height="130" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="135" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">Pure</text>
  <text x="135" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">Mathematics</text>
  <text x="135" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">abstract concepts</text>
  <text x="135" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">studied for their</text>
  <text x="135" y="236" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">own sake</text>

  <!-- Bridge (center) -->
  <rect x="300" y="130" width="200" height="110" fill="#5C3D1E"/>
  <text x="400" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#FDFAF4">Applied</text>
  <text x="400" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#FDFAF4">Mathematics</text>
  <text x="400" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FDFAF4">mathematical technique</text>
  <text x="400" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FDFAF4">meets specialized knowledge</text>

  <!-- Fields (right) -->
  <rect x="575" y="100" width="180" height="170" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="665" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">Fields of Practice</text>
  <text x="665" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">physics &#183; engineering</text>
  <text x="665" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">medicine &#183; biology</text>
  <text x="665" y="197" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">finance &#183; business</text>
  <text x="665" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">computer science</text>
  <text x="665" y="239" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">industry</text>

  <!-- Bidirectional arrows -->
  <line x1="225" y1="160" x2="293" y2="160" stroke="#5C3D1E" stroke-width="2" marker-end="url(#ar)"/>
  <text x="260" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#5C3D1E">theory &amp; tools</text>
  <line x1="300" y1="210" x2="232" y2="210" stroke="#2D5A8E" stroke-width="2" marker-end="url(#arb)"/>
  <text x="262" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#2D5A8E">new questions</text>

  <line x1="500" y1="160" x2="568" y2="160" stroke="#5C3D1E" stroke-width="2" marker-end="url(#ar)"/>
  <text x="535" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#5C3D1E">techniques</text>
  <line x1="575" y1="210" x2="507" y2="210" stroke="#2D5A8E" stroke-width="2" marker-end="url(#arb)"/>
  <text x="540" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#2D5A8E">practical problems</text>

  <!-- Cycle caption -->
  <text x="400" y="316" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Practical problems drive new mathematical theory &#8212; which then becomes</text>
  <text x="400" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">an object of pure study, and returns as tools for the next application.</text>
  <text x="400" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5C3D1E">An interplay of problem-solving and abstraction, running in both directions</text>
</svg>

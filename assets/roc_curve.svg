<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">ROC Curve &amp; AUC</text>
  <text x="400" y="64" text-anchor="middle" font-size="12" fill="#333" font-style="italic">every threshold is one point; the curve shows them all at once</text>

  <!-- AUC shading -->
  <path d="M110,340 Q150,190 210,140 Q290,95 470,85 L470,340 Z" fill="#C4A87A" fill-opacity="0.35"/>
  <!-- Axes -->
  <line x1="110" y1="340" x2="470" y2="340" stroke="#333" stroke-width="1.5"/>
  <line x1="110" y1="340" x2="110" y2="85" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="372" text-anchor="middle" font-size="13" fill="#333">False Positive Rate</text>
  <text x="86" y="212" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90,86,212)">True Positive Rate</text>
  <text x="110" y="356" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="470" y="356" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="100" y="90" text-anchor="end" font-size="11" fill="#333">1</text>
  <!-- Random diagonal -->
  <line x1="110" y1="340" x2="470" y2="85" stroke="#C4A87A" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="392" y="152" font-size="11" fill="#5C3D1E" transform="rotate(-35,392,152)">random guess (AUC 0.5)</text>
  <!-- ROC curve -->
  <path d="M110,340 Q150,190 210,140 Q290,95 470,85" fill="none" stroke="#2D5A8E" stroke-width="3"/>
  <text x="188" y="118" font-size="12" fill="#2D5A8E" font-weight="bold">classifier (AUC &#8776; 0.92)</text>
  <text x="330" y="290" text-anchor="middle" font-size="12" fill="#5C3D1E" font-style="italic">AUC = shaded area</text>
  <!-- Threshold points -->
  <circle cx="160" cy="220" r="6" fill="#7C2530"/>
  <text x="172" y="230" font-size="11" fill="#7C2530">strict threshold: few FPs, misses some</text>
  <circle cx="290" cy="98" r="6" fill="#7C2530"/>
  <text x="298" y="122" font-size="11" fill="#7C2530">lenient: catches all, more FPs</text>

  <!-- Right side: threshold slider idea -->
  <rect x="530" y="100" width="235" height="230" fill="none" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="647" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C3D1E">One score, many cutoffs</text>
  <line x1="555" y1="170" x2="740" y2="170" stroke="#333" stroke-width="1.5"/>
  <text x="555" y="190" font-size="11" fill="#333">0.0</text>
  <text x="732" y="190" font-size="11" fill="#333">1.0</text>
  <line x1="610" y1="155" x2="610" y2="185" stroke="#7C2530" stroke-width="2.5"/>
  <line x1="690" y1="155" x2="690" y2="185" stroke="#7C2530" stroke-width="2.5"/>
  <text x="610" y="148" text-anchor="middle" font-size="11" fill="#7C2530">lenient</text>
  <text x="690" y="148" text-anchor="middle" font-size="11" fill="#7C2530">strict</text>
  <text x="647" y="225" text-anchor="middle" font-size="12" fill="#333">Slide the cutoff on the</text>
  <text x="647" y="243" text-anchor="middle" font-size="12" fill="#333">model's score: each choice</text>
  <text x="647" y="261" text-anchor="middle" font-size="12" fill="#333">trades TPR against FPR.</text>
  <text x="647" y="295" text-anchor="middle" font-size="12" fill="#2D5A8E" font-style="italic">AUC summarizes quality</text>
  <text x="647" y="313" text-anchor="middle" font-size="12" fill="#2D5A8E" font-style="italic">across all thresholds.</text>
</svg>

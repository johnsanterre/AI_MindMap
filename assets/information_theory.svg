<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Information Theory: Surprise, Measured in Bits</text>

  <!-- Left panel: information = -log2 p curve -->
  <text x="215" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Information of one event:  &#8722;log&#8322; p</text>
  <!-- axes -->
  <line x1="80" y1="310" x2="370" y2="310" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="310" x2="80" y2="100" stroke="#333" stroke-width="1.5"/>
  <text x="225" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">probability p of the event</text>
  <text x="60" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" transform="rotate(-90 60 205)">bits of surprise</text>
  <!-- curve: -log2 p, high at left (rare), 0 at p=1 (right) -->
  <path d="M92,105 Q110,190 150,235 Q210,285 360,308" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <!-- rare event marker -->
  <circle cx="103" cy="152" r="5" fill="#7C2530"/>
  <text x="115" y="140" font-family="Georgia, serif" font-size="12" fill="#7C2530">rare event = big news</text>
  <text x="115" y="156" font-family="Georgia, serif" font-size="12" fill="#7C2530">(friend late once a year)</text>
  <!-- coin flip marker: p = 0.5 -> 1 bit -->
  <circle cx="225" cy="273" r="5" fill="#2D5A8E"/>
  <text x="237" y="262" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">fair coin: p = &#189; &#8594; 1 bit</text>
  <!-- certain event -->
  <circle cx="360" cy="308" r="5" fill="#C4A87A" stroke="#5C3D1E" stroke-width="1"/>
  <text x="352" y="292" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">certain event = no news</text>
  <text x="83" y="326" font-family="Georgia, serif" font-size="11" fill="#333">0</text>
  <text x="364" y="326" font-family="Georgia, serif" font-size="11" fill="#333">1</text>

  <!-- Divider -->
  <line x1="420" y1="70" x2="420" y2="350" stroke="#D4C5A9" stroke-width="1.5"/>

  <!-- Right panel: entropy = average surprise -->
  <text x="605" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Entropy H(X) = average surprise</text>
  <!-- three bars -->
  <line x1="455" y1="290" x2="760" y2="290" stroke="#333" stroke-width="1.5"/>
  <rect x="475" y="286" width="60" height="4" fill="#C4A87A"/>
  <rect x="575" y="218" width="60" height="72" fill="#C4A87A"/>
  <rect x="675" y="140" width="60" height="150" fill="#7C2530"/>
  <text x="505" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333"> </text>
  <text x="505" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">two-headed coin</text>
  <text x="505" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">H = 0</text>
  <text x="605" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">biased coin</text>
  <text x="605" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">H = 0.47</text>
  <text x="705" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">fair coin</text>
  <text x="705" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">H = 1 (max)</text>
  <text x="605" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">H(X) = &#8722;&#931; p log&#8322; p</text>
  <text x="705" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">most unpredictable</text>

  <text x="400" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">The rarer the event, the more bits it delivers &#8212; entropy is how many bits you expect on average.</text>
</svg>

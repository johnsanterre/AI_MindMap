<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Concave Functions: The Hill with No Hidden Peaks</text>

  <!-- axes -->
  <line x1="80" y1="320" x2="480" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="80" y2="90" stroke="#333" stroke-width="1.5"/>

  <!-- concave hill -->
  <path d="M110,300 C170,150 230,110 280,108 C330,110 390,150 450,300" fill="none" stroke="#2D5A8E" stroke-width="3.5"/>

  <!-- chord endpoints on curve -->
  <circle cx="140" cy="245" r="6" fill="#2D5A8E"/>
  <circle cx="420" cy="245" r="6" fill="#2D5A8E"/>
  <text x="140" y="342" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#333">x</text>
  <line x1="140" y1="251" x2="140" y2="320" stroke="#C4A87A" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="420" y1="251" x2="420" y2="320" stroke="#C4A87A" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="420" y="342" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#333">y</text>

  <!-- chord below curve -->
  <line x1="140" y1="245" x2="420" y2="245" stroke="#7C2530" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="280" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#7C2530">every chord lies below the curve</text>

  <!-- peak marker -->
  <circle cx="280" cy="108" r="7" fill="none" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="280" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">the only summit</text>

  <!-- gap arrow -->
  <line x1="280" y1="238" x2="280" y2="122" stroke="#333" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="292" y="185" font-family="Georgia, serif" font-size="12" fill="#333">curve &#8805; chord</text>

  <!-- Right panel -->
  <line x1="520" y1="70" x2="520" y2="375" stroke="#D4C5A9" stroke-width="2"/>
  <text x="655" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#5C3D1E">Why it matters</text>

  <text x="540" y="145" font-family="Georgia, serif" font-size="13" fill="#333">Concavity is the shape of</text>
  <text x="540" y="163" font-family="Georgia, serif" font-size="13" fill="#333"><tspan font-weight="bold" fill="#2D5A8E">maximization</tspan>: log-likelihoods,</text>
  <text x="540" y="181" font-family="Georgia, serif" font-size="13" fill="#333">entropy, reward functions.</text>

  <text x="540" y="220" font-family="Georgia, serif" font-size="13" fill="#333">If you can no longer climb,</text>
  <text x="540" y="238" font-family="Georgia, serif" font-size="13" fill="#333">you are at the top:</text>
  <text x="540" y="262" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">local max = global max.</text>

  <rect x="535" y="290" width="240" height="70" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <text x="655" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">f(&#955;x + (1&#8722;&#955;)y)</text>
  <text x="655" y="342" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">&#8805;  &#955;f(x) + (1&#8722;&#955;)f(y)</text>
</svg>

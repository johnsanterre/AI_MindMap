<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Statistical Learning Theory</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">how model complexity and data size govern what you can guarantee</text>

  <defs>
    <marker id="sltArr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#5C3D1E"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="90" y1="300" x2="480" y2="300" stroke="#5C3D1E" stroke-width="2" marker-end="url(#sltArr)"/>
  <line x1="90" y1="300" x2="90" y2="100" stroke="#5C3D1E" stroke-width="2" marker-end="url(#sltArr)"/>
  <text x="290" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">complexity of hypothesis class H</text>
  <text x="72" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" transform="rotate(-90,72,200)">error</text>

  <!-- Training error: monotone decreasing -->
  <path d="M110,150 C 200,230 300,275 460,290" fill="none" stroke="#2D5A8E" stroke-width="3"/>
  <!-- True risk: U-shaped -->
  <path d="M110,165 C 200,230 260,235 330,205 C 390,180 430,150 460,125" fill="none" stroke="#7C2530" stroke-width="3"/>

  <!-- Gap annotation -->
  <line x1="430" y1="140" x2="430" y2="285" stroke="#C4A87A" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="440" y="215" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-weight="bold">gap</text>

  <!-- Curve labels -->
  <text x="330" y="265" font-family="Georgia, serif" font-size="13" fill="#2D5A8E" font-weight="bold">training error R&#770;(h)</text>
  <text x="300" y="145" font-family="Georgia, serif" font-size="13" fill="#7C2530" font-weight="bold">true risk R(h)</text>

  <!-- Sweet spot / overfit zones -->
  <line x1="285" y1="105" x2="285" y2="300" stroke="#D4C5A9" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="285" y="97" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-style="italic">sweet spot</text>
  <text x="400" y="97" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530" font-style="italic">overfitting</text>

  <!-- Right panel: the bound -->
  <line x1="510" y1="90" x2="510" y2="330" stroke="#D4C5A9" stroke-width="2"/>
  <text x="645" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">The guarantee</text>
  <text x="645" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">R(h) &#8804; R&#770;(h) + O(&#8730;(d/n))</text>
  <text x="645" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">d = capacity of H (VC dim)</text>
  <text x="645" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">n = training examples</text>

  <text x="645" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E" font-weight="bold">more data (n &#8593;)</text>
  <text x="645" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">gap shrinks &#8212; training error</text>
  <text x="645" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">becomes trustworthy</text>

  <text x="645" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530" font-weight="bold">richer class (d &#8593;)</text>
  <text x="645" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">gap widens &#8212; a perfect fit</text>
  <text x="645" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">may be pure coincidence</text>

  <!-- Bottom line -->
  <text x="400" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Memorizing last year's exam aces the practice set and bombs the real test &#8212; unless H is small relative to n.</text>
</svg>

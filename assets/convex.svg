<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Convex Functions: The Bowl That Cannot Trap You</text>

  <!-- axes -->
  <line x1="80" y1="330" x2="480" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="330" x2="80" y2="90" stroke="#333" stroke-width="1.5"/>

  <!-- convex bowl -->
  <path d="M110,110 C170,270 230,308 280,310 C330,308 390,270 450,110" fill="none" stroke="#2D5A8E" stroke-width="3.5"/>

  <!-- chord endpoints -->
  <circle cx="145" cy="185" r="6" fill="#2D5A8E"/>
  <circle cx="415" cy="185" r="6" fill="#2D5A8E"/>
  <text x="130" y="172" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#333">x</text>
  <text x="422" y="172" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#333">y</text>

  <!-- chord above curve -->
  <line x1="145" y1="185" x2="415" y2="185" stroke="#7C2530" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="280" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#7C2530">every chord lies above the curve</text>

  <!-- marble at the bottom -->
  <circle cx="280" cy="303" r="8" fill="#5C3D1E"/>
  <text x="280" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">the marble always ends here</text>

  <!-- descent arrows -->
  <defs><marker id="cvA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C4A87A"/></marker></defs>
  <path d="M135,150 C170,240 205,280 245,297" fill="none" stroke="#C4A87A" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#cvA)"/>
  <path d="M428,155 C395,245 355,283 315,298" fill="none" stroke="#C4A87A" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#cvA)"/>

  <!-- Right panel -->
  <line x1="520" y1="70" x2="520" y2="375" stroke="#D4C5A9" stroke-width="2"/>
  <text x="655" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#5C3D1E">Why it matters</text>

  <text x="540" y="145" font-family="Georgia, serif" font-size="13" fill="#333">Drop a marble anywhere on the</text>
  <text x="540" y="163" font-family="Georgia, serif" font-size="13" fill="#333">rim: it rolls to the same bottom.</text>
  <text x="540" y="181" font-family="Georgia, serif" font-size="13" fill="#333">A mountain range gives no such</text>
  <text x="540" y="199" font-family="Georgia, serif" font-size="13" fill="#333">guarantee.</text>

  <text x="540" y="238" font-family="Georgia, serif" font-size="13" fill="#333">If no nearby move improves you,</text>
  <text x="540" y="256" font-family="Georgia, serif" font-size="13" fill="#333">nowhere far away can either:</text>
  <text x="540" y="280" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">local min = global min.</text>

  <rect x="535" y="300" width="240" height="66" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <text x="655" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">f(&#955;x + (1&#8722;&#955;)y)</text>
  <text x="655" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">&#8804;  &#955;f(x) + (1&#8722;&#955;)f(y)</text>
</svg>

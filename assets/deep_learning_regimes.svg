<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Deep Learning Regimes</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">The same architecture can learn in fundamentally different ways</text>

  <!-- Left panel: lazy / kernel regime -->
  <rect x="55" y="90" width="320" height="235" rx="8" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="215" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">Lazy / kernel regime</text>
  <!-- rigid street grid -->
  <g stroke="#2D5A8E" stroke-width="1.5" opacity="0.55">
    <line x1="95" y1="140" x2="335" y2="140"/><line x1="95" y1="175" x2="335" y2="175"/><line x1="95" y1="210" x2="335" y2="210"/><line x1="95" y1="245" x2="335" y2="245"/>
    <line x1="115" y1="130" x2="115" y2="255"/><line x1="170" y1="130" x2="170" y2="255"/><line x1="225" y1="130" x2="225" y2="255"/><line x1="280" y1="130" x2="280" y2="255"/><line x1="320" y1="130" x2="320" y2="255"/>
  </g>
  <circle cx="115" cy="245" r="5" fill="#5C3D1E"/>
  <circle cx="320" cy="140" r="5" fill="#7C2530"/>
  <path d="M115,245 L225,245 L225,140 L320,140" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="215" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Streets are rigid: features barely move,</text>
  <text x="215" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">weights stay near initialization.</text>
  <text x="215" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#2D5A8E">theory: neural tangent kernel</text>

  <!-- Right panel: feature-learning regime -->
  <rect x="425" y="90" width="320" height="235" rx="8" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="585" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">Feature-learning regime</text>
  <!-- rearranging streets: curved paths -->
  <g stroke="#C4A87A" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M465,145 C520,130 560,165 610,150 C650,140 680,155 700,145"/>
    <path d="M465,185 C510,205 570,175 620,195 C660,208 690,190 705,195"/>
    <path d="M465,230 C520,215 555,250 615,235 C655,225 685,242 705,235"/>
    <path d="M490,132 C480,170 505,200 490,255"/>
    <path d="M600,130 C615,170 585,205 605,255"/>
  </g>
  <circle cx="470" cy="248" r="5" fill="#5C3D1E"/>
  <circle cx="700" cy="142" r="5" fill="#7C2530"/>
  <path d="M470,248 C530,235 580,180 700,142" fill="none" stroke="#7C2530" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="585" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Streets rearrange as you walk: the network</text>
  <text x="585" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">builds new representations, shortcuts appear.</text>
  <text x="585" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#7C2530">rich regime: features move far from init</text>

  <!-- Bottom lever note -->
  <text x="400" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">Which regime you are in depends on width, depth, initialization scale, and learning rate.</text>
</svg>

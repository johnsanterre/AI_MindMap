<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Feature Learning: from Pixels to Concepts</text>

  <!-- old way -->
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7C2530" font-style="italic">Old way: experts hand-design features, frozen before training. Deep learning discovers them instead.</text>

  <!-- pipeline -->
  <!-- raw input -->
  <rect x="60" y="130" width="120" height="150" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <text x="120" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Raw input</text>
  <rect x="80" y="150" width="80" height="80" fill="#C4A87A" opacity="0.5"/>
  <line x1="80" y1="170" x2="160" y2="170" stroke="#FDFAF4" stroke-width="1"/>
  <line x1="80" y1="190" x2="160" y2="190" stroke="#FDFAF4" stroke-width="1"/>
  <line x1="80" y1="210" x2="160" y2="210" stroke="#FDFAF4" stroke-width="1"/>
  <line x1="100" y1="150" x2="100" y2="230" stroke="#FDFAF4" stroke-width="1"/>
  <line x1="120" y1="150" x2="120" y2="230" stroke="#FDFAF4" stroke-width="1"/>
  <line x1="140" y1="150" x2="140" y2="230" stroke="#FDFAF4" stroke-width="1"/>
  <text x="120" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">pixels</text>

  <!-- arrow -->
  <line x1="184" y1="205" x2="222" y2="205" stroke="#5C3D1E" stroke-width="2"/>
  <path d="M228,205 L216,199 L216,211 Z" fill="#5C3D1E"/>

  <!-- layer 1: edges -->
  <rect x="235" y="140" width="110" height="130" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="290" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Layer 1</text>
  <line x1="255" y1="165" x2="295" y2="185" stroke="#2D5A8E" stroke-width="3"/>
  <line x1="305" y1="160" x2="305" y2="200" stroke="#2D5A8E" stroke-width="3"/>
  <line x1="260" y1="215" x2="300" y2="215" stroke="#2D5A8E" stroke-width="3"/>
  <text x="290" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">edges</text>

  <line x1="349" y1="205" x2="387" y2="205" stroke="#5C3D1E" stroke-width="2"/>
  <path d="M393,205 L381,199 L381,211 Z" fill="#5C3D1E"/>

  <!-- layer 2: parts -->
  <rect x="400" y="140" width="110" height="130" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="455" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Layer 2</text>
  <circle cx="435" cy="185" r="14" fill="none" stroke="#2D5A8E" stroke-width="3"/>
  <path d="M460,215 Q475,190 490,215" fill="none" stroke="#2D5A8E" stroke-width="3"/>
  <rect x="465" y="160" width="24" height="18" fill="none" stroke="#2D5A8E" stroke-width="3"/>
  <text x="455" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">parts (eye, curve)</text>

  <line x1="514" y1="205" x2="552" y2="205" stroke="#5C3D1E" stroke-width="2"/>
  <path d="M558,205 L546,199 L546,211 Z" fill="#5C3D1E"/>

  <!-- layer 3: concept -->
  <rect x="565" y="140" width="170" height="130" fill="#7C2530" opacity="0.08"/>
  <rect x="565" y="140" width="170" height="130" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="650" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Top layer</text>
  <circle cx="650" cy="190" r="28" fill="none" stroke="#7C2530" stroke-width="3"/>
  <circle cx="640" cy="183" r="3.5" fill="#7C2530"/>
  <circle cx="660" cy="183" r="3.5" fill="#7C2530"/>
  <path d="M638,200 Q650,210 662,200" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="650" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">whole objects: a face</text>

  <!-- bottom message -->
  <line x1="60" y1="300" x2="740" y2="300" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="400" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">One loss, backpropagated end-to-end, teaches every layer <tspan font-style="italic">what to look for</tspan> &#8212;</text>
  <text x="400" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">no human ever specifies the features.</text>
  <text x="400" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">Learned features are hierarchical, task-relevant, and transferable to new problems.</text>
</svg>

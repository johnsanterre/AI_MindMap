<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Perturbation Theory: Nudge a Problem You Can Already Solve</text>

  <!-- Series expansion -->
  <text x="400" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#333">x(&#949;)  =  x&#8320;  +  &#949;&#183;x&#8321;  +  &#949;&#178;&#183;x&#8322;  +  &#8230;</text>

  <!-- Term boxes -->
  <rect x="90" y="130" width="180" height="70" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="180" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">x&#8320;</text>
  <text x="180" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">the solvable baseline</text>
  <text x="180" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E" font-style="italic">the perfect recipe</text>

  <text x="295" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">+</text>

  <rect x="320" y="130" width="180" height="70" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="410" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">&#949;&#183;x&#8321;</text>
  <text x="410" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">first correction</text>
  <text x="410" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530" font-style="italic">the pinch of salt</text>

  <text x="525" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#333">+</text>

  <rect x="550" y="130" width="180" height="70" fill="none" stroke="#C4A87A" stroke-width="2.5"/>
  <text x="640" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5C3D1E">&#949;&#178;&#183;x&#8322;</text>
  <text x="640" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">second correction</text>
  <text x="640" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-style="italic">a taste-and-adjust</text>

  <!-- magnitude bars -->
  <text x="90" y="268" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#333">Why it works (&#949; = 0.1):</text>
  <rect x="90" y="280" width="300" height="16" fill="#2D5A8E"/>
  <text x="400" y="293" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">x&#8320; &#8212; order 1</text>
  <rect x="90" y="304" width="30" height="16" fill="#7C2530"/>
  <text x="130" y="317" font-family="Georgia, serif" font-size="12" fill="#7C2530">&#949;&#183;x&#8321; &#8212; order 0.1</text>
  <rect x="90" y="328" width="3" height="16" fill="#C4A87A"/>
  <text x="103" y="341" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">&#949;&#178;&#183;x&#8322; &#8212; order 0.01</text>

  <!-- Right note -->
  <text x="580" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Solve order by order:</text>
  <text x="580" y="306" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">first x&#8320;, then x&#8321;, then x&#8322; &#8230;</text>
  <text x="580" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">each term shrinks fast, so</text>
  <text x="580" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">truncating early is safe</text>

  <text x="400" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">Answer "by how much does the solution shift?" instead of solving the hard problem exactly.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="arrL2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2D5A8E"/>
    </marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">The L2 Norm: Straight-Line Length, and Why We Penalize It</text>

  <!-- Left: Pythagorean length -->
  <text x="205" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Length as the crow flies</text>
  <line x1="100" y1="300" x2="330" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="100" y1="300" x2="100" y2="110" stroke="#333" stroke-width="1.5"/>
  <text x="336" y="304" font-family="Georgia, serif" font-size="12" fill="#333">w&#8321;</text>
  <text x="88" y="106" font-family="Georgia, serif" font-size="12" fill="#333">w&#8322;</text>
  <!-- vector -->
  <line x1="100" y1="300" x2="290" y2="150" stroke="#2D5A8E" stroke-width="3" marker-end="url(#arrL2)"/>
  <line x1="290" y1="300" x2="290" y2="152" stroke="#C4A87A" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="100" y1="300" x2="290" y2="300" stroke="#C4A87A" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="195" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">w&#8321;</text>
  <text x="304" y="230" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">w&#8322;</text>
  <text x="163" y="205" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">&#8214;w&#8214;&#8322;</text>
  <text x="205" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">&#8214;w&#8214;&#8322; = &#8730;(w&#8321;&#178; + w&#8322;&#178;)</text>
  <text x="205" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-style="italic">one number for the model's overall size</text>

  <!-- Divider -->
  <line x1="400" y1="65" x2="400" y2="380" stroke="#D4C5A9" stroke-width="1.5"/>

  <!-- Right: ridge shrinkage geometry -->
  <text x="595" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Regularization: keep w near the origin</text>
  <line x1="440" y1="250" x2="760" y2="250" stroke="#333" stroke-width="1.2"/>
  <line x1="560" y1="120" x2="560" y2="345" stroke="#333" stroke-width="1.2"/>
  <!-- L2 ball -->
  <circle cx="560" cy="250" r="62" fill="#C4A87A" fill-opacity="0.3" stroke="#5C3D1E" stroke-width="2"/>
  <text x="522" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">L2 ball: &#8214;w&#8214;&#8322; &#8804; budget</text>
  <!-- loss contours around unregularized min -->
  <ellipse cx="695" cy="165" rx="32" ry="20" fill="none" stroke="#7C2530" stroke-width="1.5" stroke-dasharray="5,3"/>
  <ellipse cx="695" cy="165" rx="64" ry="40" fill="none" stroke="#7C2530" stroke-width="1.5" stroke-dasharray="5,3"/>
  <ellipse cx="695" cy="165" rx="98" ry="62" fill="none" stroke="#7C2530" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="695" cy="165" r="5" fill="#7C2530"/>
  <text x="705" y="150" font-family="Georgia, serif" font-size="12" fill="#7C2530">unregularized fit</text>
  <text x="705" y="166" font-family="Georgia, serif" font-size="11" fill="#7C2530">(huge weights, memorizes noise)</text>
  <!-- ridge solution: tangency -->
  <circle cx="606" cy="212" r="6" fill="#2D5A8E"/>
  <text x="614" y="232" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2D5A8E">ridge solution</text>
  <text x="614" y="248" font-family="Georgia, serif" font-size="11" fill="#2D5A8E">shrunk, still fits well</text>

  <text x="595" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5C3D1E">Weight decay adds &#955;&#8214;w&#8214;&#178; to the loss &#8212; big weights must earn their keep.</text>
</svg>

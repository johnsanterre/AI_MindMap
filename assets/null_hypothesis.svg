<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">The Null Hypothesis: Innocent Until Proven Otherwise</text>
  <text x="400" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">Assume nothing is happening (H&#8320;), then ask: how surprising are these data?</text>

  <!-- axis -->
  <line x1="80" y1="280" x2="720" y2="280" stroke="#333" stroke-width="1.5"/>

  <!-- rejection tails (drawn under the curve) -->
  <path d="M 80,280 Q 130,278 175,268 L 175,280 Z" fill="#7C2530" fill-opacity="0.45"/>
  <path d="M 625,268 Q 670,278 720,280 L 625,280 Z" fill="#7C2530" fill-opacity="0.45"/>

  <!-- bell curve -->
  <path d="M 80,280 C 180,276 260,255 320,190 C 355,150 370,115 400,115 C 430,115 445,150 480,190 C 540,255 620,276 720,280"
        fill="#2D5A8E" fill-opacity="0.10" stroke="#2D5A8E" stroke-width="2.5"/>

  <text x="400" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">world where H&#8320; is true</text>
  <text x="400" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">no effect, no difference</text>

  <!-- critical values -->
  <line x1="175" y1="268" x2="175" y2="292" stroke="#7C2530" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="625" y1="268" x2="625" y2="292" stroke="#7C2530" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="175" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">&#8722;z*</text>
  <text x="625" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">+z*</text>
  <text x="120" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#7C2530">reject H&#8320;</text>
  <text x="120" y="271" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">(&#945;/2)</text>
  <text x="682" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#7C2530">reject H&#8320;</text>
  <text x="682" y="271" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">(&#945;/2)</text>

  <!-- observed statistic -->
  <line x1="655" y1="130" x2="655" y2="280" stroke="#5C3D1E" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="655" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">observed data</text>
  <text x="655" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">rare in the null world</text>
  <text x="655" y="167" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">&#8594; small p-value</text>

  <!-- verdict boxes -->
  <rect x="80" y="330" width="300" height="46" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="230" y="349" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2D5A8E">p &#8805; &#945; : fail to reject &#8212; acquit</text>
  <text x="230" y="367" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">not proof of innocence, just not enough evidence</text>
  <rect x="420" y="330" width="300" height="46" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="570" y="349" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#7C2530">p &lt; &#945; : reject H&#8320; &#8212; convict</text>
  <text x="570" y="367" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">data this extreme would be rare if H&#8320; were true</text>
</svg>

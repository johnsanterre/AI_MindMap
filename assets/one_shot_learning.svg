<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">One-Shot Learning: Compare, Don't Memorize</text>
  <text x="400" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">One example per class &#8212; classify new items by similarity, not by learned class boundaries</text>

  <!-- Support set -->
  <rect x="50" y="95" width="180" height="240" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <text x="140" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Support set</text>
  <text x="140" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">(one example each)</text>
  <circle cx="100" cy="175" r="18" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="165" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">class A</text>
  <polygon points="100,215 118,247 82,247" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="165" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">class B</text>
  <rect x="84" y="272" width="32" height="32" fill="none" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="165" y="294" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">class C</text>

  <!-- Query -->
  <rect x="50" y="345" width="0" height="0" fill="none"/>
  <text x="315" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Query</text>
  <rect x="280" y="140" width="70" height="70" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <circle cx="315" cy="175" r="18" fill="#7C2530" fill-opacity="0.15" stroke="#7C2530" stroke-width="2.5"/>
  <text x="315" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">never seen before</text>

  <!-- arrows into embedding space -->
  <line x1="238" y1="200" x2="268" y2="185" stroke="#5C3D1E" stroke-width="2"/>
  <line x1="358" y1="175" x2="418" y2="175" stroke="#5C3D1E" stroke-width="2"/>
  <path d="M 424 175 L 414 170 L 414 180 Z" fill="#5C3D1E"/>
  <text x="391" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">embed</text>

  <!-- Embedding space -->
  <rect x="430" y="95" width="240" height="240" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <text x="550" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Embedding space</text>
  <circle cx="500" cy="170" r="10" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <polygon points="620,160 630,178 610,178" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <rect x="590" y="285" width="20" height="20" fill="none" stroke="#5C3D1E" stroke-width="2.5"/>
  <circle cx="527" cy="205" r="10" fill="#7C2530" fill-opacity="0.15" stroke="#7C2530" stroke-width="2.5"/>
  <text x="527" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">query</text>
  <!-- distance lines -->
  <line x1="521" y1="197" x2="506" y2="178" stroke="#7C2530" stroke-width="2"/>
  <line x1="536" y1="200" x2="610" y2="174" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="533" y1="213" x2="590" y2="288" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="490" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#7C2530">nearest</text>

  <!-- Verdict -->
  <rect x="690" y="150" width="70" height="0" fill="none"/>
  <text x="722" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">&#8594; class A</text>

  <text x="400" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-style="italic">The network learns a similarity metric from many tasks, then generalizes to new classes from a single example.</text>
</svg>

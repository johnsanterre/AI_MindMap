<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="4" y="4" width="792" height="392" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5C3D1E"/>
    </marker>
  </defs>
  <text x="400" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Mathematical Concepts — Building Blocks of ML</text>

  <!-- Four cluster boxes -->
  <rect x="40" y="70" width="240" height="110" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="160" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Solutions &amp; Complexity</text>
  <text x="160" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">closed-form solutions</text>
  <text x="160" y="133" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">tractable vs. intractable</text>
  <text x="160" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">scaling of runtime &amp; memory</text>
  <text x="160" y="167" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">quadratic forms in losses &amp; kernels</text>

  <rect x="520" y="70" width="240" height="110" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="640" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Geometry &amp; Structure</text>
  <text x="640" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">hyperplanes as decision surfaces</text>
  <text x="640" y="133" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">projections (PCA, attention)</text>
  <text x="640" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">change of basis, normalization</text>
  <text x="640" y="167" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">curse of dimensionality</text>

  <rect x="40" y="250" width="240" height="110" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="160" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Calculus &amp; Analysis</text>
  <text x="160" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">Hessian: curvature of the loss</text>
  <text x="160" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">Jacobian: first derivatives</text>
  <text x="160" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">chain rule &#8594; backpropagation</text>
  <text x="160" y="347" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">inner products on functions</text>

  <rect x="520" y="250" width="240" height="110" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="640" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Key Results</text>
  <text x="640" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">Euler&#8217;s identity: e&#8305;&#960; + 1 = 0</text>
  <text x="640" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">EM algorithm for latent variables</text>
  <text x="640" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">polynomial approximation</text>
  <text x="640" y="347" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">of function classes</text>

  <!-- Arrows into center -->
  <line x1="280" y1="150" x2="322" y2="185" stroke="#C4A87A" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="520" y1="150" x2="478" y2="185" stroke="#C4A87A" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="280" y1="280" x2="322" y2="245" stroke="#C4A87A" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="520" y1="280" x2="478" y2="245" stroke="#C4A87A" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Center -->
  <rect x="310" y="185" width="180" height="60" fill="#5C3D1E"/>
  <text x="400" y="211" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#FDFAF4">Machine Learning</text>
  <text x="400" y="231" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FDFAF4">theory &#8596; computation</text>

  <text x="400" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5C3D1E">The same few mathematical tools reappear across nearly every ML method</text>
</svg>

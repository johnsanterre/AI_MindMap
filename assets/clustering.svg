<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Clustering: Finding Groups Without Labels</text>

  <!-- Left: unlabeled points -->
  <text x="200" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#333">Unlabeled data</text>
  <g fill="#333">
    <circle cx="130" cy="140" r="6"/><circle cx="160" cy="125" r="6"/><circle cx="150" cy="160" r="6"/><circle cx="115" cy="165" r="6"/>
    <circle cx="255" cy="150" r="6"/><circle cx="285" cy="135" r="6"/><circle cx="275" cy="170" r="6"/><circle cx="300" cy="160" r="6"/>
    <circle cx="185" cy="255" r="6"/><circle cx="215" cy="240" r="6"/><circle cx="205" cy="275" r="6"/><circle cx="230" cy="265" r="6"/>
  </g>
  <text x="200" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">No teacher, no categories given &#8212;</text>
  <text x="200" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">the structure is already there.</text>

  <!-- Center arrow -->
  <defs><marker id="clA" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#5C3D1E"/></marker></defs>
  <line x1="345" y1="200" x2="435" y2="200" stroke="#5C3D1E" stroke-width="3" marker-end="url(#clA)"/>
  <text x="390" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5C3D1E">clustering</text>

  <!-- Right: same points, grouped -->
  <text x="605" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#333">Discovered groups</text>

  <ellipse cx="537" cy="147" rx="55" ry="42" fill="none" stroke="#2D5A8E" stroke-width="2" stroke-dasharray="6,4"/>
  <g fill="#2D5A8E">
    <circle cx="515" cy="140" r="6"/><circle cx="545" cy="125" r="6"/><circle cx="535" cy="160" r="6"/><circle cx="500" cy="165" r="6"/>
  </g>

  <ellipse cx="672" cy="153" rx="55" ry="40" fill="none" stroke="#7C2530" stroke-width="2" stroke-dasharray="6,4"/>
  <g fill="#7C2530">
    <circle cx="640" cy="150" r="6"/><circle cx="670" cy="135" r="6"/><circle cx="660" cy="170" r="6"/><circle cx="685" cy="160" r="6"/>
  </g>

  <ellipse cx="602" cy="258" rx="55" ry="40" fill="none" stroke="#C4A87A" stroke-width="2" stroke-dasharray="6,4"/>
  <g fill="#C4A87A">
    <circle cx="570" cy="255" r="6"/><circle cx="600" cy="240" r="6"/><circle cx="590" cy="275" r="6"/><circle cx="615" cy="265" r="6"/>
  </g>

  <text x="605" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Each algorithm defines "similar" differently:</text>
  <text x="605" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333"><tspan fill="#2D5A8E">K-Means</tspan>: distance &#183; <tspan fill="#7C2530">DBSCAN</tspan>: density &#183; <tspan fill="#5C3D1E">Hierarchical</tspan>: linkage</text>
</svg>

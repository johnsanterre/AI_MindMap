<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect x="0" y="0" width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">Gibbs Sampling: One Coordinate at a Time</text>

  <!-- target distribution contours -->
  <g fill="none" stroke="#C4A87A" stroke-width="2">
    <ellipse cx="400" cy="215" rx="230" ry="115" transform="rotate(-18 400 215)"/>
    <ellipse cx="400" cy="215" rx="165" ry="80" transform="rotate(-18 400 215)"/>
    <ellipse cx="400" cy="215" rx="100" ry="46" transform="rotate(-18 400 215)"/>
  </g>
  <text x="622" y="110" font-size="13" font-style="italic" fill="#C4A87A">target p(x, y)</text>

  <!-- staircase path -->
  <g stroke="#7C2530" stroke-width="2.5" fill="none">
    <line x1="230" y1="300" x2="330" y2="300"/>
    <line x1="330" y1="300" x2="330" y2="245"/>
    <line x1="330" y1="245" x2="430" y2="245"/>
    <line x1="430" y1="245" x2="430" y2="195"/>
    <line x1="430" y1="195" x2="510" y2="195"/>
    <line x1="510" y1="195" x2="510" y2="160"/>
  </g>
  <!-- arrowheads -->
  <polygon points="330,300 320,295 320,305" fill="#7C2530"/>
  <polygon points="330,245 325,255 335,255" fill="#7C2530"/>
  <polygon points="430,245 420,240 420,250" fill="#7C2530"/>
  <polygon points="430,195 425,205 435,205" fill="#7C2530"/>
  <polygon points="510,195 500,190 500,200" fill="#7C2530"/>
  <polygon points="510,160 505,170 515,170" fill="#7C2530"/>

  <!-- sample points -->
  <circle cx="230" cy="300" r="7" fill="#2D5A8E"/>
  <circle cx="330" cy="300" r="6" fill="#2D5A8E"/>
  <circle cx="330" cy="245" r="6" fill="#2D5A8E"/>
  <circle cx="430" cy="245" r="6" fill="#2D5A8E"/>
  <circle cx="430" cy="195" r="6" fill="#2D5A8E"/>
  <circle cx="510" cy="195" r="6" fill="#2D5A8E"/>
  <circle cx="510" cy="160" r="7" fill="#2D5A8E"/>

  <!-- step labels -->
  <text x="280" y="322" text-anchor="middle" font-size="13" fill="#7C2530">sample x | y</text>
  <text x="322" y="272" text-anchor="end" font-size="13" fill="#2D5A8E">sample y | x</text>
  <text x="380" y="237" text-anchor="middle" font-size="13" fill="#7C2530">x | y</text>
  <text x="422" y="222" text-anchor="end" font-size="13" fill="#2D5A8E">y | x</text>

  <!-- start / converge labels -->
  <text x="230" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A8E">start</text>
  <text x="540" y="150" font-size="13" font-weight="bold" fill="#2D5A8E">toward high density</text>

  <!-- side panel: conditionals -->
  <rect x="55" y="70" width="240" height="100" rx="8" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2"/>
  <text x="175" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D5A8E">Full conditionals</text>
  <text x="175" y="122" text-anchor="middle" font-size="13" fill="#5C3D1E">x &#8592; p(x | y)   easy to sample</text>
  <text x="175" y="146" text-anchor="middle" font-size="13" fill="#5C3D1E">y &#8592; p(y | x)   easy to sample</text>

  <text x="400" y="375" text-anchor="middle" font-size="13" font-style="italic" fill="#5C3D1E">Axis-aligned moves, always accepted — the joint emerges from its conditionals</text>
</svg>

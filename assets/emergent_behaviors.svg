<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Emergent Behaviors: Capability Jumps at Scale</text>

  <!-- Axes -->
  <line x1="100" y1="320" x2="720" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="100" y1="320" x2="100" y2="80" stroke="#333" stroke-width="1.5"/>
  <text x="410" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Model scale (parameters, log)</text>
  <text x="62" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333" transform="rotate(-90,62,200)">Task accuracy</text>

  <!-- chance level -->
  <line x1="100" y1="300" x2="720" y2="300" stroke="#C4A87A" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="712" y="292" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#C4A87A">chance level</text>

  <!-- smooth expectation curve -->
  <path d="M100,296 C250,290 450,270 710,240" fill="none" stroke="#C4A87A" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="590" y="232" font-family="Georgia, serif" font-size="12" fill="#C4A87A" font-style="italic">smooth trend we expected</text>

  <!-- emergent curve: flat, then jump -->
  <path d="M100,297 C220,296 330,295 420,292 C455,290 470,240 485,180 C500,125 560,105 710,95" fill="none" stroke="#7C2530" stroke-width="3.5"/>
  <text x="600" y="80" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">what actually happens</text>

  <!-- threshold marker -->
  <line x1="455" y1="320" x2="455" y2="120" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="463" cy="230" r="6" fill="#2D5A8E"/>
  <text x="455" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">emergence threshold</text>

  <!-- phase-transition analogy -->
  <text x="255" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">below threshold:</text>
  <text x="255" y="273" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">near-chance, task impossible</text>
  <text x="600" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">above: capability appears</text>
  <text x="600" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">"out of nowhere"</text>

  <text x="400" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">Like water at 100&#176;C: same physics, sudden new regime &#8212; a phase transition in scale</text>
</svg>

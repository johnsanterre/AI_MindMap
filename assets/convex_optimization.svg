<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="coN" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2D5A8E"/></marker>
    <marker id="coR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7C2530"/></marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Convex Optimization: One Valley Instead of a Thousand</text>

  <!-- Left: convex landscape -->
  <text x="215" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">Convex problem</text>
  <line x1="70" y1="300" x2="360" y2="300" stroke="#333" stroke-width="1.5"/>
  <path d="M85,140 C140,290 190,315 215,315 C240,315 290,290 345,140" fill="none" stroke="#2D5A8E" stroke-width="3.5"/>

  <!-- descending marbles -->
  <path d="M110,175 C140,255 165,290 190,303" fill="none" stroke="#C4A87A" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#coN)"/>
  <path d="M322,180 C295,258 268,292 242,304" fill="none" stroke="#C4A87A" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#coN)"/>
  <circle cx="215" cy="309" r="8" fill="#2D5A8E"/>
  <text x="215" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">every start reaches the one minimum</text>
  <text x="215" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">solution guaranteed</text>

  <!-- Right: non-convex landscape -->
  <text x="590" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">Non-convex problem</text>
  <line x1="440" y1="300" x2="740" y2="300" stroke="#333" stroke-width="1.5"/>
  <path d="M450,150 C475,255 500,270 520,265 C545,258 550,205 570,210 C595,217 600,290 625,285 C645,281 650,160 675,165 C700,172 715,255 735,240" fill="none" stroke="#7C2530" stroke-width="3.5"/>

  <!-- marble stuck in local valley -->
  <path d="M480,215 C495,245 505,258 513,262" fill="none" stroke="#C4A87A" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#coR)"/>
  <circle cx="521" cy="262" r="7" fill="#7C2530"/>
  <text x="505" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7C2530">trapped in a</text>
  <text x="505" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7C2530">local valley</text>
  <line x1="512" y1="152" x2="519" y2="248" stroke="#C4A87A" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- true global min elsewhere -->
  <circle cx="625" cy="288" r="7" fill="none" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="655" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">true lowest point, never found</text>
  <text x="590" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">no guarantee</text>

  <!-- center divider -->
  <line x1="400" y1="70" x2="400" y2="375" stroke="#D4C5A9" stroke-width="2"/>

</svg>

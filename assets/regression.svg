<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect x="0" y="0" width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">Regression: Summarizing y Given x</text>

  <!-- axes -->
  <line x1="90" y1="340" x2="700" y2="340" stroke="#5C3D1E" stroke-width="2"/>
  <line x1="90" y1="340" x2="90" y2="70" stroke="#5C3D1E" stroke-width="2"/>
  <text x="700" y="362" text-anchor="end" font-size="14" fill="#5C3D1E">feature x</text>
  <text x="75" y="80" text-anchor="end" font-size="14" fill="#5C3D1E">y</text>

  <!-- quantile band (10th-90th) -->
  <path d="M 110 322 L 660 210 L 660 118 L 110 288 Z" fill="#C4A87A" opacity="0.35" stroke="none"/>
  <text x="600" y="112" font-size="13" font-style="italic" fill="#C4A87A">90th quantile</text>
  <text x="600" y="232" font-size="13" font-style="italic" fill="#C4A87A">10th quantile</text>

  <!-- scatter points -->
  <g fill="#2D5A8E">
    <circle cx="130" cy="300" r="6"/>
    <circle cx="170" cy="292" r="6"/>
    <circle cx="205" cy="278" r="6"/>
    <circle cx="240" cy="286" r="6"/>
    <circle cx="275" cy="262" r="6"/>
    <circle cx="310" cy="252" r="6"/>
    <circle cx="345" cy="262" r="6"/>
    <circle cx="380" cy="236" r="6"/>
    <circle cx="415" cy="228" r="6"/>
    <circle cx="450" cy="238" r="6"/>
    <circle cx="485" cy="206" r="6"/>
    <circle cx="520" cy="196" r="6"/>
    <circle cx="555" cy="206" r="6"/>
    <circle cx="590" cy="178" r="6"/>
    <circle cx="625" cy="166" r="6"/>
  </g>

  <!-- outlier -->
  <circle cx="480" cy="95" r="7" fill="#7C2530"/>
  <text x="497" y="92" font-size="13" font-style="italic" fill="#7C2530">outlier</text>

  <!-- least-squares line dragged up slightly -->
  <line x1="110" y1="308" x2="670" y2="148" stroke="#7C2530" stroke-width="3"/>
  <text x="672" y="146" font-size="14" font-weight="bold" fill="#7C2530">least squares</text>

  <!-- robust line -->
  <line x1="110" y1="304" x2="670" y2="172" stroke="#2D5A8E" stroke-width="3" stroke-dasharray="8,5"/>
  <text x="672" y="180" font-size="14" font-weight="bold" fill="#2D5A8E">robust fit</text>

  <!-- conditional distribution slice -->
  <line x1="310" y1="340" x2="310" y2="200" stroke="#5C3D1E" stroke-width="1" stroke-dasharray="3,4"/>
  <ellipse cx="310" cy="256" rx="14" ry="42" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <text x="150" y="200" font-size="13" font-style="italic" fill="#5C3D1E">P(y | x): the fit predicts</text>
  <text x="150" y="218" font-size="13" font-style="italic" fill="#5C3D1E">its mean (or a quantile)</text>
</svg>

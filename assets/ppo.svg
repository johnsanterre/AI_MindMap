<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">PPO: Improve the Policy, But Never Yank the Handlebars</text>

  <!-- axes -->
  <line x1="80" y1="290" x2="440" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="290" x2="80" y2="90" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">policy change  r = &#960;&#8342;&#8338;&#8347;(a|s) / &#960;&#8338;&#8343;&#8340;(a|s)</text>
  <text x="54" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" transform="rotate(-90,54,190)">objective</text>

  <!-- reference lines -->
  <line x1="220" y1="95" x2="220" y2="295" stroke="#C4A87A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="220" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">r = 1 (no change)</text>
  <line x1="150" y1="95" x2="150" y2="295" stroke="#7C2530" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="290" y1="95" x2="290" y2="295" stroke="#7C2530" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="150" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">1&#8722;&#949;</text>
  <text x="290" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">1+&#949;</text>

  <!-- unclipped objective -->
  <line x1="80" y1="255" x2="440" y2="115" stroke="#C4A87A" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="410" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">unclipped: keep rewarding</text>
  <text x="410" y="121" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">bigger and bigger changes</text>

  <!-- clipped objective -->
  <polyline points="80,255 150,228 290,173 440,173" fill="none" stroke="#2D5A8E" stroke-width="3.5"/>
  <text x="352" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">PPO clips: no extra credit</text>
  <text x="365" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">beyond the trust zone</text>

  <!-- trust region shading -->
  <rect x="150" y="95" width="140" height="195" fill="#2D5A8E" fill-opacity="0.06"/>
  <text x="220" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2D5A8E" font-style="italic">trusted step size</text>

  <!-- formula box -->
  <rect x="490" y="95" width="270" height="130" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="625" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Clipped objective</text>
  <text x="625" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">L = min( r&#183;&#194;,  clip(r, 1&#8722;&#949;, 1+&#949;)&#183;&#194; )</text>
  <line x1="505" y1="168" x2="745" y2="168" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="625" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">&#194; = advantage (was the action good?)</text>
  <text x="625" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">&#949; &#8776; 0.2 = allowed change per update</text>

  <!-- why box -->
  <rect x="490" y="245" width="270" height="90" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="625" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">Why clip?</text>
  <text x="625" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">a huge policy jump can collapse</text>
  <text x="625" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">performance &#8212; old data misleads</text>
  <text x="625" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">a radically new policy</text>

  <text x="260" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-style="italic">Small corrections, like balancing a bicycle &#8212; adjust, observe, adjust again.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">ELU: A Ramp That Never Goes Completely Flat</text>

  <!-- axes -->
  <line x1="90" y1="210" x2="580" y2="210" stroke="#333" stroke-width="1.5"/>
  <line x1="380" y1="70" x2="380" y2="330" stroke="#333" stroke-width="1.5"/>
  <text x="590" y="215" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#333">x</text>
  <text x="390" y="68" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#333">f(x)</text>

  <!-- asymptote y = -alpha -->
  <line x1="95" y1="280" x2="380" y2="280" stroke="#C4A87A" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="110" y="298" font-family="Georgia, serif" font-size="12" fill="#C4A87A">f = &#8722;&#945; (ELU's floor, never quite reached)</text>

  <!-- ReLU: navy, flat then linear -->
  <polyline points="135,210 380,210 500,90" fill="none" stroke="#2D5A8E" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- ELU negative branch: deep red, smooth curve to asymptote -->
  <path d="M140,277 C200,275 270,265 330,240 C355,228 370,218 380,210" fill="none" stroke="#7C2530" stroke-width="3.5"/>
  <!-- ELU positive = ReLU positive (slight offset for visibility) -->
  <line x1="380" y1="210" x2="500" y2="90" stroke="#7C2530" stroke-width="3.5" opacity="0.35"/>

  <!-- annotations on plot -->
  <text x="230" y="180" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">ReLU: exactly 0 here &#8212;</text>
  <text x="230" y="198" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">zero gradient, no learning</text>
  <text x="165" y="330" font-family="Georgia, serif" font-size="13" fill="#7C2530">ELU: gentle curve, gradient</text>
  <text x="165" y="348" font-family="Georgia, serif" font-size="13" fill="#7C2530">still flows for negative inputs</text>
  <text x="475" y="130" font-family="Georgia, serif" font-size="13" fill="#333">x &gt; 0: both are</text>
  <text x="475" y="148" font-family="Georgia, serif" font-size="13" fill="#333">the identity</text>

  <!-- Right panel -->
  <line x1="620" y1="70" x2="620" y2="375" stroke="#D4C5A9" stroke-width="2"/>
  <text x="705" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5C3D1E">The question</text>
  <text x="705" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">What should a neuron do</text>
  <text x="705" y="143" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">with a negative input?</text>

  <text x="705" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">ReLU: output 0</text>
  <text x="705" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">fast, but neurons can</text>
  <text x="705" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">"die" and stop learning</text>

  <text x="705" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">ELU: &#945;(e&#7511;&#8722;1)</text>
  <text x="705" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">smooth, saturates at &#8722;&#945;,</text>
  <text x="705" y="299" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">keeps every neuron alive</text>

  <text x="705" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5C3D1E">a nonzero response below zero</text>
  <text x="705" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5C3D1E">is what keeps learning going</text>
</svg>

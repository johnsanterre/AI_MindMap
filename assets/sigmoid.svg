<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">The Sigmoid Function</text>
  <text x="400" y="64" text-anchor="middle" font-size="12" fill="#333" font-style="italic">squeezes any real number into (0, 1) &#8212; a score becomes a probability</text>

  <!-- Axes -->
  <line x1="90" y1="310" x2="510" y2="310" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="340" x2="300" y2="90" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="358" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="120" y="330" text-anchor="middle" font-size="11" fill="#333">&#8722;6</text>
  <text x="480" y="330" text-anchor="middle" font-size="11" fill="#333">+6</text>
  <!-- Asymptotes -->
  <line x1="90" y1="110" x2="510" y2="110" stroke="#C4A87A" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="90" y1="310" x2="510" y2="310" stroke="#C4A87A" stroke-width="0" />
  <text x="518" y="114" font-size="11" fill="#5C3D1E">y = 1</text>
  <text x="518" y="314" font-size="11" fill="#5C3D1E">y = 0</text>
  <!-- Sigmoid curve -->
  <path d="M95,307 C160,305 220,298 260,270 C280,252 290,232 300,210 C310,188 320,168 340,150 C380,122 440,115 505,113" fill="none" stroke="#2D5A8E" stroke-width="3.5"/>
  <!-- Midpoint -->
  <circle cx="300" cy="210" r="6" fill="#7C2530"/>
  <text x="314" y="206" font-size="12" fill="#7C2530" font-weight="bold">&#963;(0) = 0.5</text>
  <!-- Region notes -->
  <text x="160" y="270" text-anchor="middle" font-size="11" fill="#5C3D1E" font-style="italic">large negative &#8594; near 0</text>
  <text x="428" y="152" text-anchor="middle" font-size="11" fill="#5C3D1E" font-style="italic">large positive &#8594; near 1</text>

  <!-- Formula panel -->
  <rect x="555" y="100" width="210" height="220" fill="none" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="660" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#2D5A8E">&#963;(x) = 1 / (1 + e&#8315;&#7511;)</text>
  <line x1="570" y1="148" x2="750" y2="148" stroke="#D4C5A9" stroke-width="1"/>
  <text x="660" y="174" text-anchor="middle" font-size="12" fill="#333">Output range: (0, 1)</text>
  <text x="660" y="198" text-anchor="middle" font-size="12" fill="#333">Smooth, monotonic S-curve</text>
  <text x="660" y="222" text-anchor="middle" font-size="12" fill="#333">&#963;&#8242;(x) = &#963;(x)(1&#8722;&#963;(x))</text>
  <text x="660" y="252" text-anchor="middle" font-size="12" fill="#7C2530">Flat at the extremes:</text>
  <text x="660" y="272" text-anchor="middle" font-size="12" fill="#7C2530">gradients vanish there</text>
  <text x="660" y="302" text-anchor="middle" font-size="11" fill="#5C3D1E" font-style="italic">logistic regression, LSTM gates</text>
</svg>

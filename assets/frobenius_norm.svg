<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Frobenius Norm: the Euclidean Length of a Matrix</text>
  <text x="400" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Treat the whole table as one long vector: square every entry, sum, take the root</text>

  <!-- Matrix A -->
  <path d="M110,110 L100,110 L100,270 L110,270" fill="none" stroke="#2D5A8E" stroke-width="3"/>
  <path d="M240,110 L250,110 L250,270 L240,270" fill="none" stroke="#2D5A8E" stroke-width="3"/>
  <text x="141" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2D5A8E">a&#8321;&#8321;</text>
  <text x="209" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2D5A8E">a&#8321;&#8322;</text>
  <text x="141" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2D5A8E">a&#8322;&#8321;</text>
  <text x="209" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2D5A8E">a&#8322;&#8322;</text>
  <text x="141" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2D5A8E">a&#8323;&#8321;</text>
  <text x="209" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2D5A8E">a&#8323;&#8322;</text>
  <text x="175" y="298" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">matrix A</text>

  <!-- unroll arrow -->
  <line x1="270" y1="190" x2="330" y2="190" stroke="#5C3D1E" stroke-width="2.5"/>
  <path d="M338,190 L324,183 L324,197 Z" fill="#5C3D1E"/>
  <text x="303" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">unroll</text>

  <!-- long vector -->
  <rect x="352" y="170" width="330" height="40" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <line x1="407" y1="170" x2="407" y2="210" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="462" y1="170" x2="462" y2="210" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="517" y1="170" x2="517" y2="210" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="572" y1="170" x2="572" y2="210" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="627" y1="170" x2="627" y2="210" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="379" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C3D1E">a&#8321;&#8321;</text>
  <text x="434" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C3D1E">a&#8321;&#8322;</text>
  <text x="489" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C3D1E">a&#8322;&#8321;</text>
  <text x="544" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C3D1E">a&#8322;&#8322;</text>
  <text x="599" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C3D1E">a&#8323;&#8321;</text>
  <text x="654" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C3D1E">a&#8323;&#8322;</text>
  <text x="517" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">one long vector &#8212; then measure its ordinary Euclidean length</text>

  <!-- arrow down to result -->
  <line x1="517" y1="252" x2="517" y2="286" stroke="#5C3D1E" stroke-width="2.5"/>
  <path d="M517,294 L510,280 L524,280 Z" fill="#5C3D1E"/>

  <!-- formula -->
  <rect x="255" y="302" width="420" height="52" fill="#7C2530" opacity="0.07"/>
  <rect x="255" y="302" width="420" height="52" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="465" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#7C2530">&#8214;A&#8214;F = &#8730;( &#931;&#7522;&#8342; a&#7522;&#8342;&#178; ) = &#8730;( tr(A&#7488;A) )</text>

  <text x="150" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">every entry counts</text>
  <text x="150" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">equally, like &#8214;v&#8214;&#8322;</text>
</svg>

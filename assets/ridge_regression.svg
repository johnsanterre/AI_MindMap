<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">Ridge Regression</text>
  <text x="400" y="64" text-anchor="middle" font-size="12" fill="#333" font-style="italic">minimize squared error + &#955;&#183;(sum of squared weights)</text>

  <!-- Left panel: constraint ball and loss contours -->
  <text x="210" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D5A8E">Why weights shrink</text>
  <ellipse cx="300" cy="185" rx="130" ry="85" fill="none" stroke="#7C2530" stroke-width="1.5" stroke-dasharray="6,4"/>
  <ellipse cx="300" cy="185" rx="85" ry="55" fill="none" stroke="#7C2530" stroke-width="1.5" stroke-dasharray="6,4"/>
  <ellipse cx="300" cy="185" rx="42" ry="27" fill="none" stroke="#7C2530" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="185" cy="245" r="80" fill="#C4A87A" fill-opacity="0.3" stroke="#2D5A8E" stroke-width="2.5"/>
  <circle cx="300" cy="185" r="5" fill="#7C2530"/>
  <text x="312" y="180" font-size="12" fill="#7C2530">OLS fit (huge weights)</text>
  <circle cx="240" cy="204" r="6" fill="#2D5A8E"/>
  <text x="120" y="345" font-size="12" fill="#2D5A8E">L2 budget: w&#8321;&#178;+w&#8322;&#178; &#8804; t</text>
  <text x="182" y="248" text-anchor="middle" font-size="12" fill="#2D5A8E">ridge</text>
  <text x="182" y="263" text-anchor="middle" font-size="12" fill="#2D5A8E">solution</text>

  <!-- Right panel: shrinkage paths -->
  <text x="600" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C3D1E">Coefficients vs. penalty &#955;</text>
  <line x1="470" y1="320" x2="760" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="470" y1="320" x2="470" y2="110" stroke="#333" stroke-width="1.5"/>
  <text x="615" y="345" text-anchor="middle" font-size="12" fill="#333">&#955; (more regularization &#8594;)</text>
  <text x="455" y="215" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,455,215)">|weight|</text>
  <path d="M478,130 C540,150 640,230 755,310" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <path d="M478,170 C545,195 650,265 755,315" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <path d="M478,210 C550,235 660,290 755,318" fill="none" stroke="#C4A87A" stroke-width="2.5"/>
  <text x="486" y="125" font-size="12" fill="#2D5A8E">w&#8321;</text>
  <text x="486" y="165" font-size="12" fill="#7C2530">w&#8322;</text>
  <text x="486" y="205" font-size="12" fill="#5C3D1E">w&#8323;</text>
  <text x="612" y="140" text-anchor="middle" font-size="11" fill="#333" font-style="italic">pulled toward zero,</text>
  <text x="612" y="156" text-anchor="middle" font-size="11" fill="#333" font-style="italic">never exactly zero</text>
</svg>

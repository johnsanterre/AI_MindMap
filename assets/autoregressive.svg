<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Autoregressive Generation</text>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2D5A8E"/></marker>
  </defs>
  <!-- Generated tokens -->
  <rect x="80" y="90" width="90" height="54" rx="6" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="125" y="123" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">The</text>
  <rect x="190" y="90" width="90" height="54" rx="6" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="235" y="123" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">cat</text>
  <rect x="300" y="90" width="90" height="54" rx="6" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="345" y="123" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">sat</text>
  <rect x="410" y="90" width="90" height="54" rx="6" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="455" y="123" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">on</text>
  <!-- Next token being predicted -->
  <rect x="560" y="90" width="90" height="54" rx="6" fill="#C4A87A" fill-opacity="0.3" stroke="#7C2530" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="605" y="123" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">?</text>
  <text x="605" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#7C2530">next token</text>
  <!-- Conditioning arrows -->
  <path d="M125,144 Q140,210 550,124" fill="none" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <path d="M235,144 Q250,190 550,130" fill="none" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <path d="M345,144 Q360,178 552,136" fill="none" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <path d="M455,144 Q490,164 554,140" fill="none" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <text x="330" y="212" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#2D5A8E">every earlier token is context &#8212; never the future</text>
  <!-- Factorization -->
  <rect x="90" y="245" width="620" height="72" rx="8" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <text x="400" y="273" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">The chain rule of probability makes the joint tractable</text>
  <text x="400" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">P(x&#8321;,&#8230;,x&#8345;) = P(x&#8321;) &#183; P(x&#8322;|x&#8321;) &#183; P(x&#8323;|x&#8321;,x&#8322;) &#8943; P(x&#8345;|all before)</text>
  <!-- Footer -->
  <text x="400" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">One hard question &#8212; "probability of this whole sentence?" &#8212; becomes many easy ones: "what comes next?"</text>
  <text x="400" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">The engine behind GPT, WaveNet, PixelCNN, ARIMA.</text>
</svg>

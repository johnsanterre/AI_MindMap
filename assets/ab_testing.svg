<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">A/B Testing</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#5C3D1E"/></marker>
  </defs>
  <!-- Population -->
  <rect x="300" y="68" width="200" height="52" rx="6" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Whole audience</text>
  <text x="400" y="109" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">randomly split</text>
  <line x1="345" y1="120" x2="215" y2="162" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="455" y1="120" x2="585" y2="162" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- Group A -->
  <rect x="80" y="168" width="260" height="92" rx="6" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="210" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">A — Control</text>
  <text x="210" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">sees the current version</text>
  <text x="210" y="243" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">outcome: 3.2% convert</text>
  <!-- Group B -->
  <rect x="460" y="168" width="260" height="92" rx="6" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="590" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">B — Treatment</text>
  <text x="590" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">sees the new version</text>
  <text x="590" y="243" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">outcome: 3.8% convert</text>
  <!-- Compare -->
  <line x1="210" y1="260" x2="360" y2="308" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="590" y1="260" x2="440" y2="308" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="255" y="310" width="290" height="48" rx="6" fill="#C4A87A" fill-opacity="0.25" stroke="#C4A87A" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">Compare outcomes statistically</text>
  <text x="400" y="349" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">difference real, or chance?</text>
  <!-- Key idea sidebar -->
  <text x="400" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7C2530">Randomization balances every confounder you never thought to control for.</text>
</svg>

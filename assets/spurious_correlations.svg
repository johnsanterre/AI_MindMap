<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Spurious Correlations</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">two effects of one hidden cause look like cause and effect</text>

  <defs>
    <marker id="scArr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#5C3D1E"/></marker>
  </defs>

  <!-- Confounder at top of triangle -->
  <ellipse cx="400" cy="125" rx="110" ry="38" fill="#C4A87A" opacity="0.35" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="400" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5C3D1E">Summer heat</text>
  <text x="400" y="139" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">the confounder</text>

  <!-- Two effect boxes -->
  <rect x="80" y="240" width="190" height="66" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="175" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Ice cream sales</text>
  <text x="175" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">rise in summer</text>

  <rect x="530" y="240" width="190" height="66" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="625" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Drownings</text>
  <text x="625" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">rise in summer</text>

  <!-- Causal arrows -->
  <line x1="322" y1="155" x2="200" y2="235" stroke="#5C3D1E" stroke-width="2.5" marker-end="url(#scArr)"/>
  <line x1="478" y1="155" x2="600" y2="235" stroke="#5C3D1E" stroke-width="2.5" marker-end="url(#scArr)"/>
  <text x="230" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-style="italic">causes</text>
  <text x="572" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-style="italic">causes</text>

  <!-- Spurious link -->
  <line x1="275" y1="273" x2="525" y2="273" stroke="#7C2530" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="378" y1="257" x2="422" y2="289" stroke="#7C2530" stroke-width="2.5"/>
  <line x1="378" y1="289" x2="422" y2="257" stroke="#7C2530" stroke-width="2.5"/>
  <text x="400" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530" font-weight="bold">r &#8776; 0.9, yet no causal link</text>

  <!-- Bottom lesson -->
  <line x1="60" y1="340" x2="740" y2="340" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="400" y="364" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">The correlation is real &#8212; the numbers do move together &#8212; but control for the confounder and it vanishes. Correlation is not causation.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">The Mean Is a Minimizer</text>

  <!-- Left: L2 parabola -->
  <text x="215" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Squared distance &#8594; the mean</text>
  <line x1="85" y1="300" x2="360" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="85" y1="300" x2="85" y2="100" stroke="#333" stroke-width="1.5"/>
  <text x="368" y="304" font-family="Georgia, serif" font-size="12" fill="#333">c</text>
  <text x="76" y="96" font-family="Georgia, serif" font-size="12" fill="#333">L&#8322;(c)</text>
  <!-- parabola, vertex at mean=5 mapped to x=222 -->
  <path d="M100,120 Q160,240 222,240 Q284,240 344,120" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <circle cx="222" cy="240" r="6" fill="#2D5A8E"/>
  <line x1="222" y1="240" x2="222" y2="300" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- data points -->
  <circle cx="110" cy="298" r="5" fill="#7C2530"/>
  <circle cx="166" cy="298" r="5" fill="#7C2530"/>
  <circle cx="222" cy="298" r="5" fill="#7C2530"/>
  <circle cx="278" cy="298" r="5" fill="#7C2530"/>
  <circle cx="334" cy="298" r="5" fill="#7C2530"/>
  <text x="110" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">1</text>
  <text x="166" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">3</text>
  <text x="222" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">5</text>
  <text x="278" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">7</text>
  <text x="334" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">9</text>
  <text x="222" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2D5A8E">mean = 5</text>
  <text x="215" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">L&#8322;(c) = &#931;(x&#7522; &#8722; c)&#178; &#8212; smooth bowl, unique bottom</text>

  <!-- Divider -->
  <line x1="400" y1="65" x2="400" y2="375" stroke="#D4C5A9" stroke-width="1.5"/>

  <!-- Right: L1 V-shape -->
  <text x="595" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Absolute distance &#8594; the median</text>
  <line x1="465" y1="300" x2="740" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="465" y1="300" x2="465" y2="100" stroke="#333" stroke-width="1.5"/>
  <text x="748" y="304" font-family="Georgia, serif" font-size="12" fill="#333">c</text>
  <text x="456" y="96" font-family="Georgia, serif" font-size="12" fill="#333">L&#8321;(c)</text>
  <!-- piecewise V, min at median x=602 -->
  <path d="M478,120 L546,205 L602,240 L658,205 L726,120" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <circle cx="602" cy="240" r="6" fill="#7C2530"/>
  <line x1="602" y1="240" x2="602" y2="300" stroke="#7C2530" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- data points -->
  <circle cx="490" cy="298" r="5" fill="#2D5A8E"/>
  <circle cx="546" cy="298" r="5" fill="#2D5A8E"/>
  <circle cx="602" cy="298" r="5" fill="#2D5A8E"/>
  <circle cx="658" cy="298" r="5" fill="#2D5A8E"/>
  <circle cx="714" cy="298" r="5" fill="#2D5A8E"/>
  <text x="602" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#7C2530">median = 5</text>
  <text x="595" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">L&#8321;(c) = &#931;|x&#7522; &#8722; c| &#8212; kinked, bottoms at the median</text>

  <text x="400" y="384" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5C3D1E">Data {1,3,5,7,9}: the &#8220;best single summary&#8221; depends on how you define close.</text>
</svg>

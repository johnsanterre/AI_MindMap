<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Cross-Entropy Loss</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">Confidently wrong costs far more than a hedged guess</text>

  <!-- Axes -->
  <line x1="110" y1="320" x2="700" y2="320" stroke="#5C3D1E" stroke-width="2"/>
  <line x1="110" y1="320" x2="110" y2="95" stroke="#5C3D1E" stroke-width="2"/>
  <text x="405" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">predicted probability of the true class</text>
  <text x="82" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" transform="rotate(-90,82,205)">loss = &#8722;log(p)</text>
  <text x="110" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">0</text>
  <text x="700" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">1</text>
  <text x="405" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">0.5</text>

  <!-- -log(p) curve: steep near p=0, flat near p=1 -->
  <path d="M132,100 C140,170 160,225 200,258 C260,292 380,308 520,314 C600,317 660,318 698,319" fill="none" stroke="#7C2530" stroke-width="3"/>

  <!-- Annotated points -->
  <circle cx="152" cy="190" r="6" fill="#7C2530"/>
  <text x="240" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">confidently wrong</text>
  <text x="240" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">p = 0.05 &#8594; enormous penalty</text>
  <line x1="180" y1="164" x2="158" y2="186" stroke="#7C2530" stroke-width="1.5"/>

  <circle cx="405" cy="303" r="6" fill="#C4A87A" stroke="#5C3D1E" stroke-width="1.5"/>
  <text x="405" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">hedging</text>
  <text x="405" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">p = 0.5 &#8594; modest loss</text>
  <line x1="405" y1="278" x2="405" y2="295" stroke="#5C3D1E" stroke-width="1.5"/>

  <circle cx="670" cy="318" r="6" fill="#2D5A8E"/>
  <text x="640" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">confident and right</text>
  <text x="640" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">p = 0.95 &#8594; loss near zero</text>
  <line x1="655" y1="294" x2="668" y2="311" stroke="#2D5A8E" stroke-width="1.5"/>

  <!-- Formula -->
  <text x="620" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">H(y, &#375;) = &#8722;&#931; y&#7522; log(&#375;&#7522;)</text>
  <text x="620" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">only the true class term survives</text>
</svg>

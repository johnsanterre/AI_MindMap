<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Heterogeneity of Treatment Effects</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">The average effect is real arithmetic &#8212; but it may belong to nobody in the trial</text>

  <!-- axis: treatment effect -->
  <line x1="120" y1="290" x2="700" y2="290" stroke="#333" stroke-width="1.5"/>
  <text x="410" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">treatment effect (change in risk)</text>
  <!-- zero line -->
  <line x1="340" y1="100" x2="340" y2="290" stroke="#5C3D1E" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="340" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">0 (no effect)</text>
  <text x="225" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">&#8592; harm</text>
  <text x="470" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">benefit &#8594;</text>

  <!-- subgroup bars -->
  <!-- elderly, harmed -->
  <rect x="245" y="125" width="95" height="34" fill="#7C2530" opacity="0.85"/>
  <text x="235" y="147" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#333">older, kidney disease (n=300)</text>
  <text x="292" y="147" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#FDFAF4">&#8722;9</text>

  <!-- middle, small -->
  <rect x="340" y="175" width="30" height="34" fill="#C4A87A"/>
  <text x="330" y="197" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#333">middle group (n=400)</text>
  <text x="382" y="197" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">+2</text>

  <!-- young, big benefit -->
  <rect x="340" y="225" width="270" height="34" fill="#2D5A8E" opacity="0.9"/>
  <text x="330" y="247" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#333">young, healthy (n=500)</text>
  <text x="475" y="247" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#FDFAF4">+18</text>

  <!-- ATE marker -->
  <line x1="415" y1="110" x2="415" y2="290" stroke="#7C2530" stroke-width="2.5"/>
  <path d="M415,110 L408,122 L422,122 Z" fill="#7C2530"/>
  <text x="430" y="122" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">ATE = +5 (the "average patient")</text>

  <text x="400" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">One summary number overstates benefit for some and hides harm for others.</text>
  <text x="400" y="376" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">HTE asks not "does it work?" but "for whom, and by how much?"</text>
</svg>

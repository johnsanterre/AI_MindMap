<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <marker id="fsmA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2D5A8E"/>
    </marker>
    <marker id="fsmR" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#7C2530"/>
    </marker>
    <marker id="fsmS" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#5C3D1E"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Finite State Machine</text>
  <text x="400" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">One state at a time; inputs move it along fixed rules. This one accepts "a b*"</text>

  <!-- start arrow -->
  <line x1="70" y1="190" x2="128" y2="190" stroke="#5C3D1E" stroke-width="2" marker-end="url(#fsmS)"/>
  <text x="72" y="178" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">start</text>

  <!-- q0 -->
  <circle cx="185" cy="190" r="48" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="185" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#2D5A8E">q&#8320;</text>
  <text x="185" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">start</text>

  <!-- q1 accept (double circle), self-loop on b -->
  <circle cx="470" cy="190" r="48" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <circle cx="470" cy="190" r="39" fill="none" stroke="#2D5A8E" stroke-width="1.5"/>
  <text x="470" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#2D5A8E">q&#8321;</text>
  <text x="470" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">accept</text>

  <!-- q0 -> q1 on a -->
  <line x1="233" y1="190" x2="416" y2="190" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#fsmA)"/>
  <text x="325" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#2D5A8E">a</text>

  <!-- q1 self loop on b -->
  <path d="M486,144 Q540,100 556,168" fill="none" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#fsmA)"/>
  <text x="548" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#2D5A8E">b</text>

  <!-- dead state -->
  <circle cx="330" cy="325" r="40" fill="#FDFAF4" stroke="#7C2530" stroke-width="2.5"/>
  <text x="330" y="321" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#7C2530">q&#8322;</text>
  <text x="330" y="342" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">dead</text>

  <!-- q0 -> dead on b -->
  <path d="M212,231 Q250,290 290,314" fill="none" stroke="#7C2530" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#fsmR)"/>
  <text x="232" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#7C2530">b</text>

  <!-- q1 -> dead on a -->
  <path d="M445,233 Q410,290 372,313" fill="none" stroke="#7C2530" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#fsmR)"/>
  <text x="428" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#7C2530">a</text>

  <!-- explainer panel -->
  <rect x="590" y="230" width="180" height="130" fill="#C4A87A" opacity="0.18"/>
  <rect x="590" y="230" width="180" height="130" fill="none" stroke="#5C3D1E" stroke-width="1.5"/>
  <text x="680" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">The whole idea</text>
  <text x="680" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Memory = current state</text>
  <text x="680" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">only &#8212; no history kept.</text>
  <text x="680" y="324" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Traffic lights, turnstiles,</text>
  <text x="680" y="344" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">vending machines: all FSMs.</text>

  <text x="185" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">double circle = accepting</text>
</svg>

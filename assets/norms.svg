<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Norms: Three Rules for "How Big Is This Vector?"</text>
  <text x="400" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">Each shape is the unit ball &#8212; every vector of "size 1" under that rule</text>

  <!-- L1 panel -->
  <text x="150" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">&#8214;x&#8214;&#8321;  (taxicab)</text>
  <line x1="60" y1="215" x2="240" y2="215" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="150" y1="125" x2="150" y2="305" stroke="#C4A87A" stroke-width="1.5"/>
  <polygon points="150,145 220,215 150,285 80,215" fill="#7C2530" fill-opacity="0.12" stroke="#7C2530" stroke-width="2.5"/>
  <text x="150" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">|x&#8321;| + |x&#8322;| = 1</text>
  <text x="150" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">count the blocks walked</text>

  <!-- L2 panel -->
  <text x="400" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">&#8214;x&#8214;&#8322;  (crow flies)</text>
  <line x1="310" y1="215" x2="490" y2="215" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="400" y1="125" x2="400" y2="305" stroke="#C4A87A" stroke-width="1.5"/>
  <circle cx="400" cy="215" r="70" fill="#2D5A8E" fill-opacity="0.12" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="400" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">&#8730;(x&#8321;&#178; + x&#8322;&#178;) = 1</text>
  <text x="400" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">measure with a ruler</text>

  <!-- Linf panel -->
  <text x="650" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5C3D1E">&#8214;x&#8214;&#8734;  (worst case)</text>
  <line x1="560" y1="215" x2="740" y2="215" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="650" y1="125" x2="650" y2="305" stroke="#C4A87A" stroke-width="1.5"/>
  <rect x="580" y="145" width="140" height="140" fill="#5C3D1E" fill-opacity="0.12" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="650" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">max(|x&#8321;|, |x&#8322;|) = 1</text>
  <text x="650" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">largest single coordinate</text>

  <text x="400" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">L&#8321; regularization favors the diamond's sharp corners &#8594; sparse solutions; L&#8322; spreads weight smoothly.</text>
</svg>

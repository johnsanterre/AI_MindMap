<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect x="0" y="0" width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">Computer Vision: From Pixels to Understanding</text>

  <!-- pixel grid -->
  <g stroke="#5C3D1E" stroke-width="1">
    <rect x="60" y="90" width="24" height="24" fill="#C4A87A"/>
    <rect x="84" y="90" width="24" height="24" fill="#FDFAF4"/>
    <rect x="108" y="90" width="24" height="24" fill="#7C2530"/>
    <rect x="60" y="114" width="24" height="24" fill="#2D5A8E"/>
    <rect x="84" y="114" width="24" height="24" fill="#C4A87A"/>
    <rect x="108" y="114" width="24" height="24" fill="#FDFAF4"/>
    <rect x="60" y="138" width="24" height="24" fill="#FDFAF4"/>
    <rect x="84" y="138" width="24" height="24" fill="#2D5A8E"/>
    <rect x="108" y="138" width="24" height="24" fill="#C4A87A"/>
  </g>
  <text x="96" y="182" text-anchor="middle" font-size="14" fill="#5C3D1E">raw pixels</text>

  <!-- arrow 1 -->
  <line x1="140" y1="126" x2="200" y2="126" stroke="#5C3D1E" stroke-width="2"/>
  <polygon points="200,126 190,121 190,131" fill="#5C3D1E"/>

  <!-- edges / features -->
  <g stroke="#2D5A8E" stroke-width="3" fill="none">
    <path d="M215 95 L275 95"/>
    <path d="M215 115 L255 145"/>
    <path d="M235 160 L285 130"/>
    <path d="M270 100 L270 160"/>
  </g>
  <text x="252" y="182" text-anchor="middle" font-size="14" fill="#2D5A8E">edges &amp; textures</text>

  <!-- arrow 2 -->
  <line x1="300" y1="126" x2="360" y2="126" stroke="#5C3D1E" stroke-width="2"/>
  <polygon points="360,126 350,121 350,131" fill="#5C3D1E"/>

  <!-- parts -->
  <circle cx="405" cy="110" r="18" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <rect x="385" y="132" width="40" height="28" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="405" y="182" text-anchor="middle" font-size="14" fill="#7C2530">parts &amp; shapes</text>

  <!-- arrow 3 -->
  <line x1="440" y1="126" x2="500" y2="126" stroke="#5C3D1E" stroke-width="2"/>
  <polygon points="500,126 490,121 490,131" fill="#5C3D1E"/>

  <!-- scene understanding -->
  <rect x="510" y="80" width="230" height="95" rx="8" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <rect x="530" y="100" width="70" height="55" fill="none" stroke="#7C2530" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="565" y="94" text-anchor="middle" font-size="12" fill="#7C2530">"cat"</text>
  <rect x="625" y="112" width="90" height="43" fill="none" stroke="#7C2530" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="670" y="106" text-anchor="middle" font-size="12" fill="#7C2530">"sofa"</text>
  <text x="625" y="192" text-anchor="middle" font-size="14" fill="#2D5A8E">scene understanding</text>

  <!-- task row -->
  <text x="400" y="235" text-anchor="middle" font-size="15" font-weight="bold" fill="#5C3D1E">The Core Tasks</text>

  <rect x="55" y="255" width="160" height="90" rx="8" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2"/>
  <text x="135" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D5A8E">Classification</text>
  <text x="135" y="302" text-anchor="middle" font-size="12" fill="#5C3D1E">what is in</text>
  <text x="135" y="320" text-anchor="middle" font-size="12" fill="#5C3D1E">the image?</text>

  <rect x="235" y="255" width="160" height="90" rx="8" fill="#FDFAF4" stroke="#7C2530" stroke-width="2"/>
  <text x="315" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#7C2530">Detection</text>
  <text x="315" y="302" text-anchor="middle" font-size="12" fill="#5C3D1E">where is it?</text>
  <text x="315" y="320" text-anchor="middle" font-size="12" fill="#5C3D1E">(boxes)</text>

  <rect x="415" y="255" width="160" height="90" rx="8" fill="#FDFAF4" stroke="#C4A87A" stroke-width="2.5"/>
  <text x="495" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C3D1E">Segmentation</text>
  <text x="495" y="302" text-anchor="middle" font-size="12" fill="#5C3D1E">which pixels</text>
  <text x="495" y="320" text-anchor="middle" font-size="12" fill="#5C3D1E">belong to it?</text>

  <rect x="595" y="255" width="160" height="90" rx="8" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2"/>
  <text x="675" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D5A8E">Generation</text>
  <text x="675" y="302" text-anchor="middle" font-size="12" fill="#5C3D1E">synthesize</text>
  <text x="675" y="320" text-anchor="middle" font-size="12" fill="#5C3D1E">new images</text>

  <text x="400" y="375" text-anchor="middle" font-size="13" font-style="italic" fill="#5C3D1E">A hierarchy of abstraction: each stage discards pixels and keeps meaning</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Lower-Dimensional Representation</text>

  <!-- Left panel: high-dimensional data hugging a curve -->
  <rect x="50" y="80" width="280" height="230" rx="6" fill="none" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="190" y="103" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">measured in many dimensions</text>

  <!-- hidden manifold curve -->
  <path d="M 80 280 C 140 180, 220 260, 300 130" fill="none" stroke="#C4A87A" stroke-width="2" stroke-dasharray="6,5"/>
  <!-- data points scattered close to the curve -->
  <circle cx="88" cy="272" r="5" fill="#2D5A8E"/>
  <circle cx="112" cy="248" r="5" fill="#2D5A8E"/>
  <circle cx="134" cy="228" r="5" fill="#2D5A8E"/>
  <circle cx="158" cy="222" r="5" fill="#2D5A8E"/>
  <circle cx="184" cy="228" r="5" fill="#2D5A8E"/>
  <circle cx="209" cy="236" r="5" fill="#2D5A8E"/>
  <circle cx="234" cy="228" r="5" fill="#2D5A8E"/>
  <circle cx="258" cy="204" r="5" fill="#2D5A8E"/>
  <circle cx="278" cy="176" r="5" fill="#2D5A8E"/>
  <circle cx="294" cy="148" r="5" fill="#2D5A8E"/>
  <text x="190" y="337" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">the points only look high-dimensional:</text>
  <text x="190" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">they hug a simple hidden surface</text>

  <!-- arrow -->
  <line x1="345" y1="195" x2="435" y2="195" stroke="#7C2530" stroke-width="3"/>
  <polygon points="435,187 453,195 435,203" fill="#7C2530"/>
  <text x="399" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#7C2530">unroll</text>

  <!-- Right panel: unrolled 1-D coordinate -->
  <rect x="470" y="80" width="280" height="230" rx="6" fill="none" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="610" y="103" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">its true, intrinsic coordinates</text>

  <line x1="495" y1="210" x2="725" y2="210" stroke="#5C3D1E" stroke-width="2"/>
  <circle cx="505" cy="210" r="5" fill="#7C2530"/>
  <circle cx="528" cy="210" r="5" fill="#7C2530"/>
  <circle cx="551" cy="210" r="5" fill="#7C2530"/>
  <circle cx="574" cy="210" r="5" fill="#7C2530"/>
  <circle cx="597" cy="210" r="5" fill="#7C2530"/>
  <circle cx="620" cy="210" r="5" fill="#7C2530"/>
  <circle cx="643" cy="210" r="5" fill="#7C2530"/>
  <circle cx="666" cy="210" r="5" fill="#7C2530"/>
  <circle cx="691" cy="210" r="5" fill="#7C2530"/>
  <circle cx="715" cy="210" r="5" fill="#7C2530"/>
  <text x="610" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">same neighbors, same ordering &#8212;</text>
  <text x="610" y="263" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">redundancy discarded, structure kept</text>

  <text x="400" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5C3D1E">The manifold hypothesis: real-world data concentrates near a much simpler surface than its raw measurements suggest.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">The P-Value: How Surprising Is This, If Nothing Is Going On?</text>

  <!-- Null distribution -->
  <text x="270" y="80" text-anchor="middle" font-size="14" fill="#2D5A8E" font-weight="bold">World where H&#8320; is true (fair coin)</text>
  <path d="M80,300 C150,298 210,280 270,200 C310,140 350,110 400,110 C450,110 490,140 530,200 C590,280 650,298 720,300"
        fill="none" stroke="#2D5A8E" stroke-width="3"/>
  <!-- shaded tail: area at or beyond observation -->
  <path d="M560,300 C585,290 610,260 630,225 C660,175 690,300 720,300 Z" fill="#7C2530" opacity="0.30"/>
  <path d="M560,300 C600,290 640,250 680,300 L720,300 Z" fill="#7C2530" opacity="0.25"/>
  <!-- observed statistic -->
  <line x1="560" y1="105" x2="560" y2="308" stroke="#7C2530" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="560" y="98" text-anchor="middle" font-size="13" fill="#7C2530" font-weight="bold">observed result</text>
  <text x="560" y="82" text-anchor="middle" font-size="12" fill="#7C2530">(63 heads / 100 flips)</text>
  <text x="655" y="250" text-anchor="middle" font-size="14" fill="#7C2530" font-weight="bold">p-value</text>
  <text x="655" y="268" text-anchor="middle" font-size="11" fill="#7C2530">tail area</text>
  <!-- axis -->
  <line x1="80" y1="300" x2="720" y2="300" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="320" text-anchor="middle" font-size="12" fill="#333">test statistic (e.g. number of heads)</text>

  <!-- interpretation strip -->
  <rect x="70" y="334" width="660" height="42" rx="5" fill="none" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="400" y="351" text-anchor="middle" font-size="13" fill="#333">p = P(data this extreme or more | H&#8320; true)  &#8212;  a measure of surprise, not of truth</text>
  <text x="400" y="369" text-anchor="middle" font-size="13" fill="#7C2530">small p (&#60; &#945;, e.g. 0.05): either a rare fluke happened, or H&#8320; is wrong &#8594; reject H&#8320;</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Bernoulli Distribution: One Trial, Two Outcomes</text>
  <!-- Axes -->
  <line x1="140" y1="330" x2="560" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="330" x2="140" y2="90" stroke="#333" stroke-width="2"/>
  <text x="86" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333" transform="rotate(-90,86,210)">P(X = x)</text>
  <!-- Bar for 0 -->
  <rect x="200" y="160" width="110" height="170" fill="#2D5A8E" fill-opacity="0.35" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="255" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#2D5A8E">1 &#8722; p</text>
  <text x="255" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">X = 0  (failure)</text>
  <!-- Bar for 1 -->
  <rect x="390" y="216" width="110" height="114" fill="#7C2530" fill-opacity="0.35" stroke="#7C2530" stroke-width="2.5"/>
  <text x="445" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#7C2530">p</text>
  <text x="445" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">X = 1  (success)</text>
  <!-- Dashed guides -->
  <line x1="140" y1="160" x2="200" y2="160" stroke="#5C3D1E" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="140" y1="216" x2="390" y2="216" stroke="#5C3D1E" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Facts panel -->
  <rect x="590" y="100" width="180" height="200" rx="8" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <text x="680" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">One parameter</text>
  <text x="680" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">P(X=1) = p</text>
  <text x="680" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">P(X=0) = 1 &#8722; p</text>
  <line x1="605" y1="200" x2="755" y2="200" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="680" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Mean = p</text>
  <text x="680" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Var = p(1 &#8722; p)</text>
  <text x="680" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7C2530">here: p = 0.4</text>
  <!-- Key idea -->
  <text x="400" y="382" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">Coding yes/no as 1/0 lets the whole machinery of statistics operate on a coin flip.</text>
</svg>

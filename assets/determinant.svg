<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">The Determinant</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">One number: how much does the transformation scale area?</text>

  <!-- Unit square -->
  <polygon points="90,300 190,300 190,200 90,200" fill="#2D5A8E" fill-opacity="0.12" stroke="#2D5A8E" stroke-width="2"/>
  <text x="140" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">area 1</text>
  <text x="140" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">unit square</text>

  <!-- Arrow with A -->
  <line x1="225" y1="250" x2="305" y2="250" stroke="#5C3D1E" stroke-width="2.5"/>
  <polygon points="305,250 292,243 292,257" fill="#5C3D1E"/>
  <text x="265" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5C3D1E">apply A</text>

  <!-- Parallelogram -->
  <polygon points="330,300 480,300 540,190 390,190" fill="#7C2530" fill-opacity="0.12" stroke="#7C2530" stroke-width="2.5"/>
  <line x1="330" y1="300" x2="480" y2="300" stroke="#7C2530" stroke-width="3"/>
  <line x1="330" y1="300" x2="390" y2="190" stroke="#C4A87A" stroke-width="3"/>
  <text x="405" y="318" font-family="Georgia, serif" font-size="12" fill="#7C2530">A&#183;e&#8321;</text>
  <text x="340" y="238" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">A&#183;e&#8322;</text>
  <text x="437" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">area = |det(A)|</text>

  <!-- Right column: what the value means -->
  <text x="665" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Reading det(A)</text>
  <text x="665" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">det = 3 &#8594; areas triple</text>
  <text x="665" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">det = 0.5 &#8594; areas halve</text>
  <text x="665" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">det &#60; 0 &#8594; orientation flips</text>
  <text x="665" y="236" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">det = 0 &#8594; space flattens;</text>
  <text x="665" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">no inverse exists</text>
  <line x1="580" y1="272" x2="750" y2="272" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="665" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">det(AB) = det(A)&#183;det(B)</text>
  <text x="665" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">det = product of eigenvalues</text>
  <text x="665" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">2&#215;2: ad &#8722; bc</text>
</svg>

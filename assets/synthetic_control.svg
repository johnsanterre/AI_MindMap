<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Synthetic Control</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">build a "ghost" version of the treated unit to see what would have happened</text>

  <defs>
    <marker id="synArr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#5C3D1E"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="90" y1="310" x2="700" y2="310" stroke="#5C3D1E" stroke-width="2" marker-end="url(#synArr)"/>
  <line x1="90" y1="310" x2="90" y2="100" stroke="#5C3D1E" stroke-width="2" marker-end="url(#synArr)"/>
  <text x="395" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">time</text>
  <text x="70" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" transform="rotate(-90,70,205)">cigarette sales</text>

  <!-- Treatment line -->
  <line x1="400" y1="105" x2="400" y2="310" stroke="#5C3D1E" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="400" y="97" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-weight="bold">Prop 99 (1988)</text>
  <text x="245" y="303" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">pre-treatment: the two track closely</text>
  <text x="545" y="303" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">post-treatment: gap opens</text>

  <!-- Effect gap shading (between curves post-treatment) -->
  <polygon points="400,180 470,178 540,177 610,176 670,175 670,255 610,240 540,222 470,200 400,180" fill="#7C2530" opacity="0.12"/>

  <!-- Synthetic control: continues trend (dashed navy) -->
  <polyline points="110,220 180,208 250,198 320,190 400,182 470,180 540,179 610,178 670,177" fill="none" stroke="#2D5A8E" stroke-width="3" stroke-dasharray="9,5"/>
  <!-- Real California: matches pre, drops after (solid red) -->
  <polyline points="110,223 180,211 250,200 320,192 400,180 470,200 540,222 610,240 670,255" fill="none" stroke="#7C2530" stroke-width="3"/>

  <!-- Curve labels -->
  <text x="678" y="172" font-family="Georgia, serif" font-size="12" fill="#2D5A8E" font-weight="bold">synthetic CA</text>
  <text x="678" y="188" font-family="Georgia, serif" font-size="11" fill="#2D5A8E">(counterfactual)</text>
  <text x="678" y="258" font-family="Georgia, serif" font-size="12" fill="#7C2530" font-weight="bold">real CA</text>

  <!-- Gap bracket -->
  <text x="560" y="212" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530" font-weight="bold">causal effect = gap</text>

  <!-- Donor pool inset -->
  <text x="215" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">How the ghost is built</text>
  <text x="215" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">weighted blend of untreated "donor" states,</text>
  <text x="215" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">weights chosen to match CA before 1988</text>

  <!-- Bottom line -->
  <line x1="60" y1="350" x2="740" y2="350" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="400" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">The counterfactual can never be observed &#8212; so it is constructed. Good pre-treatment fit is what makes the post-treatment gap credible.</text>
</svg>

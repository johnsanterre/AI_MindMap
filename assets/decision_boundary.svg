<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">The Decision Boundary</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">A classifier carves the input space into regions &#8212; the boundary is the border</text>

  <!-- Main map -->
  <rect x="70" y="90" width="400" height="260" rx="6" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <!-- Boundary curve splitting the map -->
  <path d="M245,90 C285,150 230,220 275,280 C295,315 285,335 275,350" fill="none" stroke="#5C3D1E" stroke-width="3" stroke-dasharray="9,6"/>
  <!-- Blue territory points (left) -->
  <g fill="#2D5A8E">
    <circle cx="115" cy="135" r="6"/><circle cx="160" cy="165" r="6"/><circle cx="120" cy="215" r="6"/>
    <circle cx="175" cy="250" r="6"/><circle cx="140" cy="300" r="6"/><circle cx="200" cy="130" r="6"/>
    <circle cx="205" cy="305" r="6"/><circle cx="185" cy="200" r="6"/>
  </g>
  <!-- Red territory points (right) -->
  <g fill="#7C2530">
    <circle cx="330" cy="130" r="6"/><circle cx="390" cy="160" r="6"/><circle cx="340" cy="210" r="6"/>
    <circle cx="410" cy="240" r="6"/><circle cx="350" cy="300" r="6"/><circle cx="430" cy="120" r="6"/>
    <circle cx="420" cy="310" r="6"/><circle cx="310" cy="255" r="6"/>
  </g>
  <text x="150" y="112" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">approve</text>
  <text x="355" y="112" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">deny</text>
  <text x="270" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">income &#8594;</text>
  <text x="52" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" transform="rotate(-90,52,220)">debt &#8594;</text>

  <!-- New point -->
  <circle cx="225" cy="170" r="7" fill="none" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="222" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">new point?</text>

  <!-- Right: the idea in words -->
  <text x="625" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">The whole idea</text>
  <text x="625" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">1. Training carves space</text>
  <text x="625" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">into one region per class.</text>
  <text x="625" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">2. The boundary is the</text>
  <text x="625" y="226" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">frontier between regions.</text>
  <text x="625" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">3. Classifying a new point =</text>
  <text x="625" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">asking which side it lands on.</text>
  <text x="625" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7C2530">A good border keeps each class's</text>
  <text x="625" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7C2530">"cities" on its own side.</text>
</svg>

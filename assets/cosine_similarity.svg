<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="cosN" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2D5A8E"/></marker>
    <marker id="cosR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#7C2530"/></marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Cosine Similarity: Direction, Not Length</text>

  <!-- axes -->
  <line x1="120" y1="330" x2="440" y2="330" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="120" y1="330" x2="120" y2="90" stroke="#C4A87A" stroke-width="1.5"/>

  <!-- Vector A: long, navy -->
  <line x1="120" y1="330" x2="390" y2="130" stroke="#2D5A8E" stroke-width="3.5" marker-end="url(#cosN)"/>
  <text x="400" y="125" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">A  (long article)</text>

  <!-- Vector B: short, same-ish direction, red -->
  <line x1="120" y1="330" x2="255" y2="248" stroke="#7C2530" stroke-width="3.5" marker-end="url(#cosR)"/>
  <text x="262" y="238" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">B  (short tweet)</text>

  <!-- angle arc -->
  <path d="M231,262 A130,130 0 0 0 224,253" fill="none" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="245" y="268" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#5C3D1E">&#952; small</text>

  <text x="280" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">different lengths, nearly the same direction: high similarity</text>

  <!-- Right panel -->
  <line x1="480" y1="70" x2="480" y2="375" stroke="#D4C5A9" stroke-width="2"/>

  <rect x="505" y="90" width="260" height="60" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <text x="635" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#333">cos(&#952;) = A&#183;B / (&#8214;A&#8214; &#8214;B&#8214;)</text>

  <!-- scale -->
  <text x="635" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">The score, from &#8722;1 to 1</text>
  <line x1="520" y1="220" x2="750" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="520" y1="213" x2="520" y2="227" stroke="#333" stroke-width="2"/>
  <line x1="635" y1="213" x2="635" y2="227" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="213" x2="750" y2="227" stroke="#333" stroke-width="2"/>
  <text x="520" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">&#8722;1</text>
  <text x="635" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">0</text>
  <text x="750" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">+1</text>
  <text x="520" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">opposite</text>
  <text x="635" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">unrelated</text>
  <text x="750" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">aligned</text>

  <text x="635" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">Compares <tspan font-style="italic">character</tspan>, not volume &#8212;</text>
  <text x="635" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">magnitude is ignored entirely.</text>
  <text x="635" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5C3D1E">search &#183; recommendations &#183; embeddings</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <marker id="hmmT" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2D5A8E"/>
    </marker>
    <marker id="hmmE" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#7C2530"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Hidden Markov Model</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">A hidden process unrolled in time, seen only through the noisy signals it emits</text>

  <!-- hidden fog band -->
  <rect x="70" y="100" width="660" height="110" fill="#2D5A8E" opacity="0.07"/>
  <text x="740" y="130" text-anchor="end" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#2D5A8E">hidden (never observed)</text>

  <!-- hidden chain -->
  <circle cx="180" cy="155" r="40" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="180" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">S&#8321;</text>
  <text x="180" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">healthy</text>

  <circle cx="400" cy="155" r="40" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="400" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">S&#8322;</text>
  <text x="400" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">infected</text>

  <circle cx="620" cy="155" r="40" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="620" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">S&#8323;</text>
  <text x="620" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">recovering</text>

  <!-- transitions -->
  <line x1="222" y1="155" x2="354" y2="155" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#hmmT)"/>
  <text x="288" y="142" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">P(S&#8322; | S&#8321;)</text>
  <line x1="442" y1="155" x2="574" y2="155" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#hmmT)"/>
  <text x="508" y="142" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">P(S&#8323; | S&#8322;)</text>

  <!-- emissions -->
  <line x1="180" y1="197" x2="180" y2="252" stroke="#7C2530" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#hmmE)"/>
  <line x1="400" y1="197" x2="400" y2="252" stroke="#7C2530" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#hmmE)"/>
  <line x1="620" y1="197" x2="620" y2="252" stroke="#7C2530" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#hmmE)"/>
  <text x="300" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">emission P(O | S)</text>

  <!-- observations -->
  <rect x="130" y="260" width="100" height="44" fill="#7C2530" opacity="0.1"/>
  <rect x="130" y="260" width="100" height="44" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="180" y="287" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7C2530">no fever</text>
  <rect x="350" y="260" width="100" height="44" fill="#7C2530" opacity="0.1"/>
  <rect x="350" y="260" width="100" height="44" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="400" y="287" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7C2530">fever</text>
  <rect x="570" y="260" width="100" height="44" fill="#7C2530" opacity="0.1"/>
  <rect x="570" y="260" width="100" height="44" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="620" y="287" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7C2530">cough</text>
  <text x="740" y="287" text-anchor="end" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#7C2530">observed</text>

  <!-- time axis -->
  <text x="180" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">day 1</text>
  <text x="400" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">day 2</text>
  <text x="620" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">day 3</text>

  <text x="400" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">Markov assumption: each hidden state depends only on the previous one &#8212; infer the chain from the symptoms</text>
</svg>

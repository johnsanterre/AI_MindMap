<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect x="0" y="0" width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="38" font-size="20" font-weight="bold" fill="#5C3D1E" text-anchor="middle">GloVe: Global Co-occurrence Counts to Word Vectors</text>

  <!-- Co-occurrence matrix -->
  <text x="150" y="72" font-size="14" fill="#5C3D1E" text-anchor="middle">Co-occurrence matrix X</text>
  <rect x="60" y="85" width="180" height="180" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <line x1="60" y1="130" x2="240" y2="130" stroke="#D4C5A9" stroke-width="1.5"/>
  <line x1="60" y1="175" x2="240" y2="175" stroke="#D4C5A9" stroke-width="1.5"/>
  <line x1="60" y1="220" x2="240" y2="220" stroke="#D4C5A9" stroke-width="1.5"/>
  <line x1="105" y1="85" x2="105" y2="265" stroke="#D4C5A9" stroke-width="1.5"/>
  <line x1="150" y1="85" x2="150" y2="265" stroke="#D4C5A9" stroke-width="1.5"/>
  <line x1="195" y1="85" x2="195" y2="265" stroke="#D4C5A9" stroke-width="1.5"/>
  <!-- filled cells indicating counts -->
  <rect x="105" y="85" width="45" height="45" fill="#7C2530" opacity="0.85"/>
  <rect x="60" y="130" width="45" height="45" fill="#2D5A8E" opacity="0.7"/>
  <rect x="195" y="130" width="45" height="45" fill="#C4A87A"/>
  <rect x="150" y="175" width="45" height="45" fill="#7C2530" opacity="0.5"/>
  <rect x="60" y="220" width="45" height="45" fill="#C4A87A" opacity="0.8"/>
  <rect x="195" y="220" width="45" height="45" fill="#2D5A8E" opacity="0.45"/>
  <text x="150" y="285" font-size="12" fill="#5C3D1E" text-anchor="middle" font-style="italic">how often word i appears near word j</text>
  <text x="150" y="303" font-size="12" fill="#5C3D1E" text-anchor="middle" font-style="italic">(counted once, over the whole corpus)</text>

  <!-- arrow -->
  <line x1="255" y1="175" x2="330" y2="175" stroke="#5C3D1E" stroke-width="2"/>
  <polygon points="330,175 318,169 318,181" fill="#5C3D1E"/>
  <text x="293" y="160" font-size="12" fill="#5C3D1E" text-anchor="middle">factorize</text>
  <text x="293" y="198" font-size="12" fill="#5C3D1E" text-anchor="middle" font-style="italic">w&#183;w&#771; &#8776; log X</text>

  <!-- Vector space -->
  <text x="475" y="72" font-size="14" fill="#5C3D1E" text-anchor="middle">Word vector space</text>
  <rect x="345" y="85" width="260" height="218" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <!-- king/queen/man/woman parallelogram -->
  <circle cx="400" cy="130" r="6" fill="#7C2530"/>
  <text x="400" y="118" font-size="13" fill="#7C2530" text-anchor="middle">king</text>
  <circle cx="490" cy="115" r="6" fill="#7C2530"/>
  <text x="490" y="103" font-size="13" fill="#7C2530" text-anchor="middle">queen</text>
  <circle cx="415" cy="215" r="6" fill="#2D5A8E"/>
  <text x="415" y="238" font-size="13" fill="#2D5A8E" text-anchor="middle">man</text>
  <circle cx="505" cy="200" r="6" fill="#2D5A8E"/>
  <text x="505" y="223" font-size="13" fill="#2D5A8E" text-anchor="middle">woman</text>
  <line x1="400" y1="130" x2="490" y2="115" stroke="#C4A87A" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="415" y1="215" x2="505" y2="200" stroke="#C4A87A" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- ice / steam cluster -->
  <circle cx="560" cy="150" r="6" fill="#5C3D1E"/>
  <text x="560" y="138" font-size="13" fill="#5C3D1E" text-anchor="middle">ice</text>
  <circle cx="575" cy="270" r="6" fill="#5C3D1E"/>
  <text x="575" y="292" font-size="13" fill="#5C3D1E" text-anchor="middle">steam</text>
  <circle cx="530" cy="165" r="5" fill="#2D5A8E"/>
  <text x="522" y="185" font-size="12" fill="#2D5A8E" text-anchor="middle">solid</text>
  <circle cx="608" cy="255" r="5" fill="#2D5A8E"/>
  <text x="600" y="248" font-size="12" fill="#2D5A8E" text-anchor="middle">gas</text>
  <text x="475" y="322" font-size="12" fill="#5C3D1E" text-anchor="middle" font-style="italic">vector differences encode log ratios of co-occurrence</text>

  <!-- ratio box -->
  <rect x="630" y="95" width="140" height="128" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="700" y="118" font-size="13" font-weight="bold" fill="#7C2530" text-anchor="middle">Meaning = ratios</text>
  <text x="700" y="145" font-size="12" fill="#5C3D1E" text-anchor="middle">P(solid|ice)</text>
  <line x1="655" y1="152" x2="745" y2="152" stroke="#5C3D1E" stroke-width="1.5"/>
  <text x="700" y="170" font-size="12" fill="#5C3D1E" text-anchor="middle">P(solid|steam)</text>
  <text x="700" y="198" font-size="13" fill="#7C2530" text-anchor="middle" font-weight="bold">&#8811; 1</text>
  <text x="700" y="215" font-size="11" fill="#5C3D1E" text-anchor="middle" font-style="italic">separates the words</text>

  <text x="400" y="368" font-size="13" fill="#5C3D1E" text-anchor="middle" font-style="italic">Count globally once &#8594; fit vectors so dot products reconstruct the log counts</text>
</svg>

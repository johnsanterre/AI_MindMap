<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="4" y="4" width="792" height="392" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5C3D1E"/>
    </marker>
  </defs>
  <text x="400" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Cosma Shalizi — From Physics to Statistics</text>

  <!-- Origins row -->
  <rect x="130" y="65" width="230" height="60" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="245" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">Statistical Mechanics</text>
  <text x="245" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">complex systems, &#949;-machines (Santa Fe)</text>

  <rect x="440" y="65" width="230" height="60" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="555" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">Dynamical Systems</text>
  <text x="555" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">ergodic theory, &#945;/&#946;-mixing processes</text>

  <!-- Arrows origins -> methods -->
  <line x1="205" y1="125" x2="140" y2="175" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="300" y1="125" x2="380" y2="175" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="510" y1="125" x2="425" y2="175" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="610" y1="125" x2="665" y2="175" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Methods row -->
  <rect x="45" y="180" width="200" height="60" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="145" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">Nonparametric</text>
  <text x="145" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">Time Series</text>

  <rect x="300" y="180" width="200" height="60" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="400" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">Statistical</text>
  <text x="400" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">Learning Theory</text>

  <rect x="555" y="180" width="200" height="60" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="655" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">Causal Inference</text>
  <text x="655" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">graphical models, g-factor critique</text>

  <!-- Arrows methods -> output -->
  <line x1="145" y1="240" x2="300" y2="295" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="400" y1="240" x2="400" y2="292" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="655" y1="240" x2="500" y2="295" stroke="#5C3D1E" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Output -->
  <rect x="200" y="298" width="400" height="62" fill="#5C3D1E"/>
  <text x="400" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#FDFAF4">Advanced Data Analysis (~900 pp, free online)</text>
  <text x="400" y="344" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FDFAF4">+ Three-Toed Sloth blog — clarity as a moral obligation</text>

  <text x="400" y="384" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5C3D1E">A physicist&#8217;s habit of asking what the assumptions are actually doing (CMU Statistics)</text>
</svg>

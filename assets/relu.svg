<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">ReLU Activation</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">f(x) = max(0, x) &#8212; off below zero, linear above</text>

  <defs>
    <marker id="axArr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#5C3D1E"/></marker>
  </defs>

  <!-- Axes: origin at (400,250), plot from x=140..660, y=100..350 -->
  <line x1="140" y1="250" x2="670" y2="250" stroke="#5C3D1E" stroke-width="2" marker-end="url(#axArr)"/>
  <line x1="400" y1="360" x2="400" y2="95" stroke="#5C3D1E" stroke-width="2" marker-end="url(#axArr)"/>
  <text x="682" y="255" font-family="Georgia, serif" font-size="14" fill="#5C3D1E" font-style="italic">x</text>
  <text x="412" y="100" font-family="Georgia, serif" font-size="14" fill="#5C3D1E" font-style="italic">f(x)</text>
  <text x="392" y="270" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#333">0</text>

  <!-- Dead zone shading -->
  <rect x="160" y="110" width="240" height="140" fill="#C4A87A" opacity="0.18"/>

  <!-- ReLU curve -->
  <polyline points="160,250 400,250 620,120" fill="none" stroke="#7C2530" stroke-width="4"/>
  <circle cx="400" cy="250" r="5" fill="#7C2530"/>

  <!-- Sigmoid for contrast -->
  <path d="M160,248 C 280,244 340,225 400,200 C 460,175 520,156 620,152" fill="none" stroke="#2D5A8E" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Region annotations -->
  <text x="270" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-weight="bold">x &lt; 0: output 0</text>
  <text x="270" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">neuron silent, gradient 0</text>
  <text x="270" y="179" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">("dead" for this input)</text>

  <text x="547" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530" font-weight="bold">x &gt; 0: output x</text>
  <text x="547" y="203" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">slope exactly 1 &#8212;</text>
  <text x="547" y="219" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">gradient never vanishes</text>

  <!-- Sigmoid label -->
  <text x="547" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E" font-style="italic">sigmoid (for contrast):</text>
  <text x="547" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E" font-style="italic">saturates &#8594; tiny gradients</text>

  <!-- Bottom strip: why it wins -->
  <line x1="60" y1="308" x2="740" y2="308" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="400" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-weight="bold">Why ReLU dominates deep nets</text>
  <text x="400" y="354" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">cheap to compute &#183; healthy gradients through many layers &#183; zeros give sparse activations &#8212; like real neurons with a firing threshold</text>
</svg>

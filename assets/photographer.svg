<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="4" y="4" width="792" height="392" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Photography Meets Computer Vision</text>

  <!-- Camera icon (simple geometric) -->
  <rect x="60" y="120" width="120" height="80" rx="8" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <circle cx="120" cy="160" r="24" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <circle cx="120" cy="160" r="12" fill="none" stroke="#5C3D1E" stroke-width="1.5"/>
  <rect x="88" y="108" width="36" height="12" fill="#5C3D1E"/>
  <text x="120" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C3D1E">Modern camera</text>

  <!-- Arrows to three ML stages -->
  <line x1="184" y1="140" x2="270" y2="100" stroke="#333" stroke-width="1.5"/>
  <path d="M 270 100 l -9 0 l 4 8 z" fill="#333"/>
  <line x1="184" y1="160" x2="270" y2="185" stroke="#333" stroke-width="1.5"/>
  <path d="M 270 185 l -9 -3 l 2 8 z" fill="#333"/>
  <line x1="184" y1="180" x2="270" y2="270" stroke="#333" stroke-width="1.5"/>
  <path d="M 270 270 l -8 -4 l 0 9 z" fill="#333"/>

  <!-- Stage 1: detection -->
  <rect x="276" y="66" width="220" height="66" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="386" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Object detection</text>
  <text x="386" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">autofocus &#183; face tracking (MTCNN)</text>

  <!-- Stage 2: segmentation -->
  <rect x="276" y="152" width="220" height="66" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="386" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Semantic segmentation</text>
  <text x="386" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">portrait mode: person vs. background</text>

  <!-- Stage 3: multi-frame fusion -->
  <rect x="276" y="238" width="220" height="66" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <text x="386" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Multi-frame CNN fusion</text>
  <text x="386" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Night Sight &#183; HDR &#183; super-resolution</text>

  <!-- Arrows to result -->
  <line x1="496" y1="99" x2="590" y2="165" stroke="#333" stroke-width="1.5"/>
  <line x1="496" y1="185" x2="590" y2="185" stroke="#333" stroke-width="1.5"/>
  <line x1="496" y1="271" x2="590" y2="205" stroke="#333" stroke-width="1.5"/>
  <path d="M 596 185 l -9 -4 v 8 z" fill="#333"/>

  <!-- Result -->
  <rect x="598" y="146" width="150" height="78" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="673" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">The photograph</text>
  <text x="673" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">no single exposure</text>
  <text x="673" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">could capture it</text>

  <!-- Bottom: film-to-foundation-models timeline -->
  <line x1="40" y1="326" x2="760" y2="326" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="400" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Two parallel progressions</text>
  <text x="400" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">film chemistry &#8594; digital sensors &#8594; neural computational photography&#160;&#160;&#8776;&#160;&#160;hand-crafted features &#8594; end-to-end learned representations</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="14" y="14" width="772" height="372" fill="none" stroke="#D4C5A9" stroke-width="2"/>

  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#7C2530">The People</text>

  <!-- constellation lines (faint) -->
  <g fill="none" stroke="#C4A87A" stroke-width="1" opacity="0.65">
    <!-- Statisticians (left) -->
    <path d="M 130 160 L 185 130 L 245 155 L 210 210"/>
    <path d="M 185 130 L 210 210"/>
    <!-- Deep Learning (center) -->
    <path d="M 355 120 L 415 105 L 470 140 L 440 200 L 380 185 L 355 120"/>
    <!-- Theorists (right) -->
    <path d="M 580 170 L 640 135 L 700 165"/>
    <path d="M 640 135 L 650 215"/>
  </g>

  <!-- stars -->
  <g>
    <!-- Statisticians -->
    <circle cx="130" cy="160" r="6" fill="#2D5A8E"/>
    <circle cx="185" cy="130" r="8" fill="#7C2530"/>
    <circle cx="245" cy="155" r="5" fill="#2D5A8E"/>
    <circle cx="210" cy="210" r="6" fill="#2D5A8E"/>
    <!-- Deep Learning -->
    <circle cx="355" cy="120" r="6" fill="#2D5A8E"/>
    <circle cx="415" cy="105" r="8" fill="#7C2530"/>
    <circle cx="470" cy="140" r="6" fill="#2D5A8E"/>
    <circle cx="440" cy="200" r="5" fill="#7C2530"/>
    <circle cx="380" cy="185" r="5" fill="#2D5A8E"/>
    <!-- Theorists -->
    <circle cx="580" cy="170" r="6" fill="#2D5A8E"/>
    <circle cx="640" cy="135" r="8" fill="#7C2530"/>
    <circle cx="700" cy="165" r="5" fill="#2D5A8E"/>
    <circle cx="650" cy="215" r="5" fill="#2D5A8E"/>
  </g>

  <!-- tiny background stars for atmosphere -->
  <g fill="#C4A87A" opacity="0.6">
    <circle cx="300" cy="250" r="2"/>
    <circle cx="520" cy="110" r="2"/>
    <circle cx="540" cy="250" r="2"/>
    <circle cx="160" cy="255" r="2"/>
    <circle cx="720" cy="110" r="2"/>
    <circle cx="90" cy="110" r="2"/>
  </g>

  <!-- group labels in small caps -->
  <g font-family="Georgia, serif" font-size="15" fill="#5C3D1E" text-anchor="middle" letter-spacing="2" style="font-variant: small-caps;">
    <text x="190" y="252">Statisticians</text>
    <text x="413" y="242">Deep Learning</text>
    <text x="642" y="258">Theorists</text>
  </g>
</svg>

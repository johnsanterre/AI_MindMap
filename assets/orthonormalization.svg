<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">Orthonormalization: From a Jumble to a Ruler Kit</text>
  <defs>
    <marker id="an" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2D5A8E"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7C2530"/></marker>
    <marker id="at" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C4A87A"/></marker>
  </defs>

  <!-- Panel 1: jumbled vectors -->
  <text x="150" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1. Start: a jumble</text>
  <circle cx="130" cy="270" r="3" fill="#333"/>
  <line x1="130" y1="270" x2="230" y2="190" stroke="#C4A87A" stroke-width="3" marker-end="url(#at)"/>
  <line x1="130" y1="270" x2="245" y2="240" stroke="#C4A87A" stroke-width="3" marker-end="url(#at)"/>
  <line x1="130" y1="270" x2="195" y2="320" stroke="#C4A87A" stroke-width="3" marker-end="url(#at)"/>
  <text x="238" y="184" font-size="13" fill="#5C3D1E">v&#8321;</text>
  <text x="253" y="242" font-size="13" fill="#5C3D1E">v&#8322;</text>
  <text x="200" y="332" font-size="13" fill="#5C3D1E">v&#8323;</text>
  <text x="150" y="360" text-anchor="middle" font-size="12" fill="#333">odd lengths, odd angles</text>

  <!-- Panel 2: subtract projection, normalize -->
  <text x="400" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2. Straighten &#38; trim</text>
  <circle cx="350" cy="270" r="3" fill="#333"/>
  <line x1="350" y1="270" x2="450" y2="270" stroke="#2D5A8E" stroke-width="3.5" marker-end="url(#an)"/>
  <text x="456" y="276" font-size="13" fill="#2D5A8E" font-weight="bold">e&#8321;</text>
  <line x1="350" y1="270" x2="460" y2="180" stroke="#C4A87A" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#at)"/>
  <text x="466" y="176" font-size="13" fill="#5C3D1E">v&#8322;</text>
  <line x1="460" y1="180" x2="460" y2="266" stroke="#7C2530" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="468" y="228" font-size="12" fill="#7C2530">v&#8322; &#8722; proj</text>
  <line x1="350" y1="270" x2="350" y2="180" stroke="#7C2530" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="330" y="176" font-size="13" fill="#7C2530" font-weight="bold">e&#8322;</text>
  <rect x="350" y="256" width="14" height="14" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="400" y="360" text-anchor="middle" font-size="12" fill="#333">remove the shared part, scale to length 1</text>

  <!-- Panel 3: result -->
  <text x="650" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3. Result: orthonormal basis</text>
  <circle cx="620" cy="255" r="3" fill="#333"/>
  <line x1="620" y1="255" x2="710" y2="255" stroke="#2D5A8E" stroke-width="3.5" marker-end="url(#an)"/>
  <text x="716" y="261" font-size="13" fill="#2D5A8E" font-weight="bold">e&#8321;</text>
  <line x1="620" y1="255" x2="620" y2="165" stroke="#7C2530" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="600" y="162" font-size="13" fill="#7C2530" font-weight="bold">e&#8322;</text>
  <rect x="620" y="241" width="14" height="14" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="650" y="300" text-anchor="middle" font-size="12" fill="#333">e&#7522;&#183;e&#11388; = 0,  &#8214;e&#7522;&#8214; = 1</text>
  <text x="650" y="320" text-anchor="middle" font-size="12" fill="#333">same span as the originals</text>

  <text x="400" y="382" text-anchor="middle" font-size="12" fill="#5C3D1E" font-style="italic">Gram&#8211;Schmidt: each new axis is made perpendicular to all previous ones, then scaled to unit length (QR: A = QR).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="arrTR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7C2530"/>
    </marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">The Trace: Sum the Self-Interactions</text>

  <!-- Matrix with brackets -->
  <path d="M120,80 L106,80 L106,310 L120,310" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M330,80 L344,80 L344,310 L330,310" fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- diagonal highlight cells -->
  <rect x="118" y="88" width="70" height="66" fill="#2D5A8E" fill-opacity="0.15" stroke="#2D5A8E" stroke-width="2"/>
  <rect x="190" y="162" width="70" height="66" fill="#2D5A8E" fill-opacity="0.15" stroke="#2D5A8E" stroke-width="2"/>
  <rect x="262" y="236" width="70" height="66" fill="#2D5A8E" fill-opacity="0.15" stroke="#2D5A8E" stroke-width="2"/>

  <!-- entries -->
  <text x="153" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#2D5A8E">a&#8321;&#8321;</text>
  <text x="225" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#C4A87A">a&#8321;&#8322;</text>
  <text x="297" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#C4A87A">a&#8321;&#8323;</text>
  <text x="153" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#C4A87A">a&#8322;&#8321;</text>
  <text x="225" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#2D5A8E">a&#8322;&#8322;</text>
  <text x="297" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#C4A87A">a&#8322;&#8323;</text>
  <text x="153" y="276" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#C4A87A">a&#8323;&#8321;</text>
  <text x="225" y="276" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#C4A87A">a&#8323;&#8322;</text>
  <text x="297" y="276" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#2D5A8E">a&#8323;&#8323;</text>

  <!-- arrow to sum -->
  <line x1="360" y1="195" x2="430" y2="195" stroke="#7C2530" stroke-width="2.5" marker-end="url(#arrTR)"/>

  <!-- sum box -->
  <rect x="440" y="150" width="310" height="90" rx="6" fill="#7C2530" fill-opacity="0.06" stroke="#7C2530" stroke-width="2"/>
  <text x="595" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#7C2530">tr(A) = a&#8321;&#8321; + a&#8322;&#8322; + a&#8323;&#8323;</text>
  <text x="595" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">one scalar: the matrix&#8217;s total self-reference</text>

  <!-- legend -->
  <rect x="440" y="270" width="16" height="16" fill="#2D5A8E" fill-opacity="0.15" stroke="#2D5A8E" stroke-width="1.5"/>
  <text x="464" y="283" font-family="Georgia, serif" font-size="13" fill="#333">diagonal: how each variable relates to itself</text>
  <rect x="440" y="296" width="16" height="16" fill="none" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="464" y="309" font-family="Georgia, serif" font-size="13" fill="#333">off-diagonal: cross-effects &#8212; completely ignored</text>

  <text x="400" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">A census that skips everyone&#8217;s connections and asks only: how much does each variable count itself?</text>
</svg>

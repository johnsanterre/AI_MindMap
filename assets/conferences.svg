<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="4" y="4" width="792" height="392" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">The ML Conference Landscape (Tier 1)</text>

  <!-- Column: Core ML -->
  <rect x="40" y="60" width="130" height="26" fill="#7C2530"/>
  <text x="105" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#FDFAF4">Core ML</text>
  <rect x="40" y="92" width="130" height="86" fill="none" stroke="#7C2530" stroke-width="1.5"/>
  <text x="105" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">NeurIPS</text>
  <text x="105" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">ICML</text>
  <text x="105" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">ICLR</text>

  <!-- Column: Computer Vision -->
  <rect x="190" y="60" width="130" height="26" fill="#2D5A8E"/>
  <text x="255" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#FDFAF4">Computer Vision</text>
  <rect x="190" y="92" width="130" height="86" fill="none" stroke="#2D5A8E" stroke-width="1.5"/>
  <text x="255" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">CVPR</text>
  <text x="255" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">ICCV</text>
  <text x="255" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">ECCV</text>

  <!-- Column: AI / Reasoning -->
  <rect x="340" y="60" width="130" height="26" fill="#5C3D1E"/>
  <text x="405" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#FDFAF4">AI / Reasoning</text>
  <rect x="340" y="92" width="130" height="86" fill="none" stroke="#5C3D1E" stroke-width="1.5"/>
  <text x="405" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">AAAI</text>
  <text x="405" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">IJCAI</text>

  <!-- Column: Data Mining / Applied -->
  <rect x="490" y="60" width="130" height="26" fill="#2D5A8E"/>
  <text x="555" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#FDFAF4">Data Mining</text>
  <rect x="490" y="92" width="130" height="86" fill="none" stroke="#2D5A8E" stroke-width="1.5"/>
  <text x="555" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">KDD</text>
  <text x="555" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">WWW</text>
  <text x="555" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">SIGIR</text>

  <!-- Column: Stats / Probabilistic -->
  <rect x="640" y="60" width="130" height="26" fill="#7C2530"/>
  <text x="705" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#FDFAF4">Statistics</text>
  <rect x="640" y="92" width="130" height="86" fill="none" stroke="#7C2530" stroke-width="1.5"/>
  <text x="705" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">AISTATS</text>
  <text x="705" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">UAI</text>

  <!-- Journals row -->
  <rect x="40" y="204" width="360" height="60" fill="none" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="220" y="226" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Journals (peer-reviewed)</text>
  <text x="220" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">JMLR &#183; TPAMI &#183; JAIR</text>

  <!-- Workshops box -->
  <rect x="420" y="204" width="350" height="60" fill="none" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="595" y="226" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Co-located workshops</text>
  <text x="595" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">where emerging ideas surface before the main track</text>

  <!-- Publication norms strip -->
  <line x1="40" y1="288" x2="770" y2="288" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="400" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Publication norms</text>
  <text x="400" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">arXiv preprint &#8594; 8&#8211;10 page submission &#8594; double-blind review &#8594; ~25% accepted &#8594; camera-ready (also on arXiv)</text>
  <text x="400" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">Acceptance rates: NeurIPS ~25% &#183; ICML ~25% &#183; ICLR ~30% &#183; CVPR ~25%</text>
</svg>

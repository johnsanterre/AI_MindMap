<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect x="0" y="0" width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">Batch Normalization: Standardize, Then Rescale</text>

  <!-- stage 1: raw activations -->
  <rect x="50" y="80" width="180" height="200" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#7C2530">Raw activations</text>
  <text x="140" y="124" text-anchor="middle" font-size="13" font-style="italic" fill="#7C2530">shifting mean &amp; scale</text>
  <g fill="#7C2530">
    <circle cx="95" cy="160" r="7"/>
    <circle cx="130" cy="146" r="7"/>
    <circle cx="168" cy="172" r="7"/>
    <circle cx="108" cy="196" r="7"/>
    <circle cx="150" cy="210" r="7"/>
    <circle cx="185" cy="150" r="7"/>
  </g>
  <line x1="65" y1="245" x2="215" y2="245" stroke="#C4A87A" stroke-width="2"/>
  <text x="140" y="266" text-anchor="middle" font-size="12" fill="#5C3D1E">&#956;_B = 4.2   &#963;_B = 2.7</text>

  <!-- arrow 1 -->
  <line x1="235" y1="180" x2="295" y2="180" stroke="#5C3D1E" stroke-width="3"/>
  <polygon points="295,172 311,180 295,188" fill="#5C3D1E"/>
  <text x="272" y="160" text-anchor="middle" font-size="13" fill="#5C3D1E">subtract &#956;_B,</text>
  <text x="272" y="205" text-anchor="middle" font-size="13" fill="#5C3D1E">divide &#963;_B</text>

  <!-- stage 2: standardized -->
  <rect x="315" y="80" width="180" height="200" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="405" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#2D5A8E">Standardized</text>
  <text x="405" y="124" text-anchor="middle" font-size="13" font-style="italic" fill="#2D5A8E">mean 0, variance 1</text>
  <g fill="#2D5A8E">
    <circle cx="375" cy="170" r="7"/>
    <circle cx="405" cy="160" r="7"/>
    <circle cx="435" cy="176" r="7"/>
    <circle cx="385" cy="192" r="7"/>
    <circle cx="420" cy="198" r="7"/>
    <circle cx="405" cy="181" r="7"/>
  </g>
  <line x1="330" y1="181" x2="480" y2="181" stroke="#C4A87A" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="405" y="266" text-anchor="middle" font-size="12" fill="#5C3D1E">x&#770; = (x &#8722; &#956;_B) / &#963;_B</text>

  <!-- arrow 2 -->
  <line x1="500" y1="180" x2="560" y2="180" stroke="#5C3D1E" stroke-width="3"/>
  <polygon points="560,172 576,180 560,188" fill="#5C3D1E"/>
  <text x="537" y="160" text-anchor="middle" font-size="13" fill="#5C3D1E">learned</text>
  <text x="537" y="205" text-anchor="middle" font-size="13" fill="#5C3D1E">&#947;, &#946;</text>

  <!-- stage 3: rescaled output -->
  <rect x="580" y="80" width="180" height="200" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <text x="670" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#5C3D1E">Output</text>
  <text x="670" y="124" text-anchor="middle" font-size="13" font-style="italic" fill="#5C3D1E">chosen mean &amp; scale</text>
  <g fill="#C4A87A" stroke="#5C3D1E" stroke-width="1.5">
    <circle cx="635" cy="185" r="7"/>
    <circle cx="665" cy="172" r="7"/>
    <circle cx="700" cy="192" r="7"/>
    <circle cx="648" cy="208" r="7"/>
    <circle cx="685" cy="215" r="7"/>
    <circle cx="668" cy="196" r="7"/>
  </g>
  <text x="670" y="266" text-anchor="middle" font-size="12" fill="#5C3D1E">y = &#947; x&#770; + &#946;</text>

  <!-- bottom banner -->
  <rect x="120" y="310" width="560" height="58" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#7C2530">Train: batch statistics    &#8226;    Inference: frozen running averages</text>
  <text x="400" y="355" text-anchor="middle" font-size="13" font-style="italic" fill="#2D5A8E">Stable layer inputs &#8594; larger learning rates &#8594; deeper trainable networks</text>
</svg>

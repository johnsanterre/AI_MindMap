<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Manhattan Distance: Travel on the Grid</text>

  <!-- City grid: 4 blocks east x 3 blocks north; block = 70px. Grid from (150,320) to (430,110) -->
  <!-- vertical streets -->
  <line x1="150" y1="110" x2="150" y2="320" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="220" y1="110" x2="220" y2="320" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="290" y1="110" x2="290" y2="320" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="360" y1="110" x2="360" y2="320" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="430" y1="110" x2="430" y2="320" stroke="#C4A87A" stroke-width="1.5"/>
  <!-- horizontal streets -->
  <line x1="150" y1="110" x2="430" y2="110" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="150" y1="180" x2="430" y2="180" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="150" y1="250" x2="430" y2="250" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="150" y1="320" x2="430" y2="320" stroke="#C4A87A" stroke-width="1.5"/>

  <!-- Manhattan path: staircase, red -->
  <path d="M 150 320 L 220 320 L 220 250 L 290 250 L 290 180 L 360 180 L 360 110 L 430 110" fill="none" stroke="#7C2530" stroke-width="4"/>
  <!-- Euclidean straight line, navy dashed -->
  <line x1="150" y1="320" x2="430" y2="110" stroke="#2D5A8E" stroke-width="3" stroke-dasharray="8,6"/>

  <!-- endpoints -->
  <circle cx="150" cy="320" r="8" fill="#5C3D1E"/>
  <circle cx="430" cy="110" r="8" fill="#5C3D1E"/>
  <text x="140" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">start</text>
  <text x="446" y="97" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">coffee shop</text>

  <!-- block annotations -->
  <text x="290" y="342" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">4 blocks east</text>
  <text x="120" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" transform="rotate(-90 120 220)">3 blocks north</text>

  <!-- Legend / formulas -->
  <line x1="500" y1="130" x2="540" y2="130" stroke="#7C2530" stroke-width="4"/>
  <text x="552" y="135" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">Manhattan (L1)</text>
  <text x="552" y="158" font-family="Georgia, serif" font-size="14" fill="#333">|&#916;x| + |&#916;y| = 4 + 3 = 7</text>
  <text x="552" y="178" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">every staircase route: 7 blocks</text>

  <line x1="500" y1="215" x2="540" y2="215" stroke="#2D5A8E" stroke-width="3" stroke-dasharray="8,6"/>
  <text x="552" y="220" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">Euclidean (L2)</text>
  <text x="552" y="243" font-family="Georgia, serif" font-size="14" fill="#333">&#8730;(4&#178; + 3&#178;) = 5</text>
  <text x="552" y="263" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">as the crow flies &#8212; but no</text>
  <text x="552" y="281" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">taxi can drive through buildings</text>

  <text x="400" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5C3D1E">Distance is a choice: when movement along each axis is independent, count the blocks, not the ruler.</text>
</svg>

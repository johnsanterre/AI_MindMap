<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect x="0" y="0" width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">DBSCAN: Clusters Are Dense Regions</text>

  <!-- crescent cluster (deep red), left -->
  <g fill="#7C2530">
    <circle cx="140" cy="140" r="8"/>
    <circle cx="170" cy="118" r="8"/>
    <circle cx="205" cy="105" r="8"/>
    <circle cx="243" cy="102" r="8"/>
    <circle cx="280" cy="110" r="8"/>
    <circle cx="312" cy="128" r="8"/>
    <circle cx="335" cy="155" r="8"/>
    <circle cx="123" cy="172" r="8"/>
    <circle cx="118" cy="207" r="8"/>
  </g>
  <!-- border points of crescent (outlined) -->
  <circle cx="352" cy="188" r="8" fill="#FDFAF4" stroke="#7C2530" stroke-width="3"/>
  <circle cx="128" cy="240" r="8" fill="#FDFAF4" stroke="#7C2530" stroke-width="3"/>
  <text x="228" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#7C2530">Cluster 1 (crescent)</text>

  <!-- epsilon neighborhood around one core point -->
  <circle cx="243" cy="102" r="46" fill="none" stroke="#C4A87A" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="243" y1="102" x2="289" y2="102" stroke="#C4A87A" stroke-width="2"/>
  <text x="262" y="93" font-size="13" font-style="italic" fill="#5C3D1E">&#949;</text>
  <text x="243" y="60" text-anchor="middle" font-size="13" font-style="italic" fill="#5C3D1E">core: &#8805; minPts neighbors</text>

  <!-- blob cluster (navy), right -->
  <g fill="#2D5A8E">
    <circle cx="560" cy="230" r="8"/>
    <circle cx="592" cy="212" r="8"/>
    <circle cx="625" cy="228" r="8"/>
    <circle cx="580" cy="262" r="8"/>
    <circle cx="615" cy="266" r="8"/>
    <circle cx="648" cy="248" r="8"/>
    <circle cx="598" cy="240" r="8"/>
  </g>
  <circle cx="672" cy="215" r="8" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="3"/>
  <text x="610" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#2D5A8E">Cluster 2</text>

  <!-- noise points (tan crosses) -->
  <g stroke="#C4A87A" stroke-width="3">
    <line x1="440" y1="95" x2="456" y2="111"/><line x1="456" y1="95" x2="440" y2="111"/>
    <line x1="510" y1="140" x2="526" y2="156"/><line x1="526" y1="140" x2="510" y2="156"/>
    <line x1="380" y1="290" x2="396" y2="306"/><line x1="396" y1="290" x2="380" y2="306"/>
    <line x1="690" y1="110" x2="706" y2="126"/><line x1="706" y1="110" x2="690" y2="126"/>
    <line x1="240" y1="300" x2="256" y2="316"/><line x1="256" y1="300" x2="240" y2="316"/>
  </g>
  <text x="470" y="130" font-size="14" font-weight="bold" fill="#C4A87A">noise</text>

  <!-- legend -->
  <rect x="60" y="330" width="500" height="46" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <circle cx="90" cy="353" r="8" fill="#7C2530"/>
  <text x="105" y="358" font-size="13" fill="#5C3D1E">core point</text>
  <circle cx="200" cy="353" r="8" fill="#FDFAF4" stroke="#7C2530" stroke-width="3"/>
  <text x="215" y="358" font-size="13" fill="#5C3D1E">border point</text>
  <g stroke="#C4A87A" stroke-width="3">
    <line x1="320" y1="346" x2="334" y2="360"/><line x1="334" y1="346" x2="320" y2="360"/>
  </g>
  <text x="344" y="358" font-size="13" fill="#5C3D1E">noise (no forced assignment)</text>
</svg>

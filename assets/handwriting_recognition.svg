<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect x="0" y="0" width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="38" font-size="20" font-weight="bold" fill="#5C3D1E" text-anchor="middle">Handwriting Recognition: The Problem That Launched Modern Vision</text>

  <!-- Input digit -->
  <rect x="55" y="110" width="110" height="110" fill="#FDFAF4" stroke="#5C3D1E" stroke-width="2"/>
  <path d="M 85 140 C 95 125, 125 122, 132 140 C 138 155, 118 168, 100 185 L 90 196 L 138 196" fill="none" stroke="#7C2530" stroke-width="6" stroke-linecap="round"/>
  <text x="110" y="245" font-size="13" fill="#5C3D1E" text-anchor="middle">28&#215;28 pixels</text>
  <text x="110" y="263" font-size="12" fill="#5C3D1E" text-anchor="middle" font-style="italic">a handwritten "2"</text>

  <line x1="170" y1="165" x2="215" y2="165" stroke="#5C3D1E" stroke-width="2"/>
  <polygon points="215,165 203,159 203,171" fill="#5C3D1E"/>

  <!-- Conv stage -->
  <rect x="222" y="95" width="95" height="140" fill="#2D5A8E" opacity="0.85"/>
  <rect x="234" y="107" width="95" height="140" fill="#2D5A8E" opacity="0.55"/>
  <rect x="246" y="119" width="95" height="140" fill="#2D5A8E" opacity="0.3"/>
  <text x="280" y="285" font-size="13" fill="#2D5A8E" text-anchor="middle" font-weight="bold">convolution</text>
  <text x="280" y="303" font-size="11" fill="#5C3D1E" text-anchor="middle" font-style="italic">learned stroke detectors</text>

  <line x1="348" y1="175" x2="390" y2="175" stroke="#5C3D1E" stroke-width="2"/>
  <polygon points="390,175 378,169 378,181" fill="#5C3D1E"/>

  <!-- Pool stage -->
  <rect x="396" y="120" width="60" height="90" fill="#C4A87A"/>
  <rect x="406" y="130" width="60" height="90" fill="#C4A87A" opacity="0.6"/>
  <text x="432" y="285" font-size="13" fill="#5C3D1E" text-anchor="middle" font-weight="bold">pooling</text>
  <text x="432" y="303" font-size="11" fill="#5C3D1E" text-anchor="middle" font-style="italic">forgive small shifts</text>

  <line x1="472" y1="175" x2="512" y2="175" stroke="#5C3D1E" stroke-width="2"/>
  <polygon points="512,175 500,169 500,181" fill="#5C3D1E"/>

  <!-- Deeper conv stage -->
  <rect x="518" y="135" width="42" height="62" fill="#7C2530" opacity="0.85"/>
  <rect x="527" y="144" width="42" height="62" fill="#7C2530" opacity="0.55"/>
  <rect x="536" y="153" width="42" height="62" fill="#7C2530" opacity="0.3"/>
  <text x="548" y="285" font-size="13" fill="#7C2530" text-anchor="middle" font-weight="bold">deeper features</text>
  <text x="548" y="303" font-size="11" fill="#5C3D1E" text-anchor="middle" font-style="italic">curves, junctions</text>

  <line x1="584" y1="175" x2="624" y2="175" stroke="#5C3D1E" stroke-width="2"/>
  <polygon points="624,175 612,169 612,181" fill="#5C3D1E"/>

  <!-- Output readout -->
  <rect x="630" y="85" width="120" height="185" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <text x="690" y="107" font-size="13" font-weight="bold" fill="#5C3D1E" text-anchor="middle">10 digit scores</text>
  <rect x="645" y="120" width="18" height="12" fill="#C4A87A"/>
  <rect x="645" y="138" width="10" height="12" fill="#C4A87A"/>
  <rect x="645" y="156" width="90" height="12" fill="#7C2530"/>
  <rect x="645" y="174" width="14" height="12" fill="#C4A87A"/>
  <rect x="645" y="192" width="8" height="12" fill="#C4A87A"/>
  <rect x="645" y="210" width="20" height="12" fill="#C4A87A"/>
  <rect x="645" y="228" width="6" height="12" fill="#C4A87A"/>
  <text x="742" y="166" font-size="13" fill="#7C2530" font-weight="bold" text-anchor="middle">"2"</text>
  <text x="690" y="258" font-size="11" fill="#5C3D1E" text-anchor="middle" font-style="italic">softmax</text>

  <!-- history strip -->
  <line x1="55" y1="330" x2="750" y2="330" stroke="#D4C5A9" stroke-width="2"/>
  <circle cx="130" cy="330" r="6" fill="#2D5A8E"/>
  <text x="130" y="352" font-size="12" fill="#2D5A8E" text-anchor="middle">1989 LeNet on ZIP codes</text>
  <circle cx="400" cy="330" r="6" fill="#7C2530"/>
  <text x="400" y="352" font-size="12" fill="#7C2530" text-anchor="middle">1998 MNIST benchmark</text>
  <circle cx="660" cy="330" r="6" fill="#5C3D1E"/>
  <text x="660" y="352" font-size="12" fill="#5C3D1E" text-anchor="middle">2012 ImageNet revolution</text>
  <text x="400" y="378" font-size="12" fill="#5C3D1E" text-anchor="middle" font-style="italic">learned features beat engineered features &#8212; first proven on the mail</text>
</svg>

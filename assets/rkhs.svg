<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect x="0" y="0" width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">Reproducing Kernel Hilbert Space</text>

  <!-- input space -->
  <ellipse cx="160" cy="200" rx="105" ry="85" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="160" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#2D5A8E">Input space X</text>
  <circle cx="120" cy="180" r="7" fill="#7C2530"/>
  <text x="120" y="168" text-anchor="middle" font-size="13" fill="#7C2530">x</text>
  <circle cx="200" cy="230" r="7" fill="#2D5A8E"/>
  <text x="200" y="255" text-anchor="middle" font-size="13" fill="#2D5A8E">x'</text>

  <!-- feature map arrow -->
  <line x1="270" y1="180" x2="400" y2="150" stroke="#5C3D1E" stroke-width="2.5"/>
  <polygon points="400,150 388,148 391,158" fill="#5C3D1E"/>
  <text x="330" y="150" text-anchor="middle" font-size="14" font-style="italic" fill="#5C3D1E">feature map &#966;</text>

  <!-- RKHS space -->
  <ellipse cx="560" cy="185" rx="185" ry="120" fill="none" stroke="#C4A87A" stroke-width="2.5"/>
  <text x="560" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#5C3D1E">RKHS  H</text>

  <!-- phi(x) points -->
  <circle cx="470" cy="180" r="7" fill="#7C2530"/>
  <text x="470" y="166" text-anchor="middle" font-size="13" fill="#7C2530">k(&#183;, x)</text>
  <circle cx="640" cy="230" r="7" fill="#2D5A8E"/>
  <text x="648" y="255" text-anchor="middle" font-size="13" fill="#2D5A8E">k(&#183;, x')</text>

  <!-- inner product line -->
  <line x1="470" y1="180" x2="640" y2="230" stroke="#5C3D1E" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="562" y="196" text-anchor="middle" font-size="13" fill="#5C3D1E">&#9001;k(&#183;,x), k(&#183;,x')&#9002; = k(x, x')</text>

  <!-- function f as a point -->
  <rect x="520" y="120" width="14" height="14" fill="#7C2530" transform="rotate(45 527 127)"/>
  <text x="558" y="122" font-size="13" fill="#7C2530">f  (a whole function = one point)</text>

  <!-- evaluation functional -->
  <path d="M527 135 Q 500 155 472 174" fill="none" stroke="#7C2530" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="470" y="140" text-anchor="end" font-size="12" font-style="italic" fill="#7C2530">f(x) = &#9001;f, k(&#183;,x)&#9002;</text>

  <text x="400" y="345" text-anchor="middle" font-size="14" fill="#5C3D1E">The reproducing property: evaluating f at x is an inner product with k(&#183;, x)</text>
  <text x="400" y="372" text-anchor="middle" font-size="13" font-style="italic" fill="#5C3D1E">Geometry over functions — kernels turn pointwise evaluation into dot products</text>
</svg>

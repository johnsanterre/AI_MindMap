<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Chaos: Tiny Differences Grow Without Bound</text>

  <!-- Axes -->
  <line x1="80" y1="330" x2="500" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="330" x2="80" y2="80" stroke="#333" stroke-width="1.5"/>
  <text x="290" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">time</text>
  <text x="48" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333" transform="rotate(-90,48,205)">state</text>

  <!-- shaded gap -->
  <path d="M80,198 C160,196 250,180 330,150 C400,123 450,105 490,92 L490,308 C450,295 400,278 330,250 C250,220 160,204 80,202 Z" fill="#C4A87A" opacity="0.25"/>

  <!-- trajectory 1 -->
  <path d="M80,198 C160,196 250,180 330,150 C400,123 450,105 490,92" fill="none" stroke="#2D5A8E" stroke-width="3"/>
  <!-- trajectory 2 -->
  <path d="M80,202 C160,204 250,220 330,250 C400,278 450,295 490,308" fill="none" stroke="#7C2530" stroke-width="3"/>

  <circle cx="80" cy="198" r="5" fill="#2D5A8E"/>
  <circle cx="80" cy="202" r="5" fill="#7C2530"/>

  <text x="500" y="90" font-family="Georgia, serif" font-size="14" fill="#2D5A8E" font-style="italic">x&#8320;</text>
  <text x="500" y="314" font-family="Georgia, serif" font-size="14" fill="#7C2530" font-style="italic">x&#8320; + &#949;</text>

  <text x="120" y="170" font-family="Georgia, serif" font-size="13" fill="#333">two starts, too close</text>
  <text x="120" y="188" font-family="Georgia, serif" font-size="13" fill="#333">to tell apart</text>

  <!-- separation annotation -->
  <line x1="380" y1="132" x2="380" y2="268" stroke="#5C3D1E" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="392" y="205" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5C3D1E">gap grows like e^&#955;t</text>

  <!-- Right panel: the three facts -->
  <line x1="540" y1="70" x2="540" y2="375" stroke="#D4C5A9" stroke-width="2"/>
  <text x="665" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#5C3D1E">Deterministic, yet</text>
  <text x="665" y="127" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#5C3D1E">unpredictable</text>

  <text x="560" y="170" font-family="Georgia, serif" font-size="13" fill="#333">1. No randomness: same start,</text>
  <text x="578" y="188" font-family="Georgia, serif" font-size="13" fill="#333">same trajectory, every time.</text>

  <text x="560" y="222" font-family="Georgia, serif" font-size="13" fill="#333">2. But no start is ever measured</text>
  <text x="578" y="240" font-family="Georgia, serif" font-size="13" fill="#333">with infinite precision.</text>

  <text x="560" y="274" font-family="Georgia, serif" font-size="13" fill="#333">3. So long-run prediction fails,</text>
  <text x="578" y="292" font-family="Georgia, serif" font-size="13" fill="#333">no matter how fast the computer.</text>

  <text x="665" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#7C2530">The chaos is not in the system;</text>
  <text x="665" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#7C2530">it is in our knowledge of it.</text>
</svg>

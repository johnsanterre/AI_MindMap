<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Regression to the Mean</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">extreme first scores drift back toward the average on remeasurement</text>

  <defs>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#7C2530"/></marker>
    <marker id="arrNavy" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2D5A8E"/></marker>
  </defs>

  <!-- Two measurement columns -->
  <line x1="230" y1="110" x2="230" y2="350" stroke="#5C3D1E" stroke-width="2"/>
  <line x1="570" y1="110" x2="570" y2="350" stroke="#5C3D1E" stroke-width="2"/>
  <text x="230" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Monday quiz</text>
  <text x="570" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Friday quiz</text>

  <!-- Mean line -->
  <line x1="180" y1="230" x2="620" y2="230" stroke="#C4A87A" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="400" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E" font-style="italic">class average</text>

  <!-- High scorers: converge downward -->
  <line x1="230" y1="130" x2="570" y2="185" stroke="#7C2530" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line x1="230" y1="155" x2="570" y2="200" stroke="#7C2530" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <circle cx="230" cy="130" r="6" fill="#7C2530"/>
  <circle cx="230" cy="155" r="6" fill="#7C2530"/>
  <circle cx="570" cy="185" r="6" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <circle cx="570" cy="200" r="6" fill="none" stroke="#7C2530" stroke-width="2.5"/>

  <!-- Low scorers: converge upward -->
  <line x1="230" y1="330" x2="570" y2="275" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#arrNavy)"/>
  <line x1="230" y1="305" x2="570" y2="260" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#arrNavy)"/>
  <circle cx="230" cy="330" r="6" fill="#2D5A8E"/>
  <circle cx="230" cy="305" r="6" fill="#2D5A8E"/>
  <circle cx="570" cy="275" r="6" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <circle cx="570" cy="260" r="6" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>

  <!-- Side labels -->
  <text x="150" y="128" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#7C2530" font-weight="bold">top scorers</text>
  <text x="150" y="146" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#333">skill + good luck</text>
  <text x="150" y="318" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#2D5A8E" font-weight="bold">bottom scorers</text>
  <text x="150" y="336" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#333">skill + bad luck</text>

  <text x="655" y="188" font-family="Georgia, serif" font-size="12" fill="#7C2530">a bit lower:</text>
  <text x="655" y="204" font-family="Georgia, serif" font-size="12" fill="#333">luck doesn't repeat</text>
  <text x="655" y="262" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">a bit higher:</text>
  <text x="655" y="278" font-family="Georgia, serif" font-size="12" fill="#333">bad luck fades</text>

  <!-- Bottom takeaway -->
  <text x="400" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">score = true skill + random noise &#8212; only the noise regresses, not the skill</text>
</svg>

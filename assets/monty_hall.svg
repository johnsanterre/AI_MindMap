<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="arrMH" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7C2530"/>
    </marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Monty Hall: Switching Buys the Whole Group</text>

  <!-- Left: the three doors -->
  <text x="200" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Your pick vs. the rest</text>

  <!-- Door 1: your pick -->
  <rect x="75" y="100" width="75" height="120" rx="4" fill="#2D5A8E" fill-opacity="0.15" stroke="#2D5A8E" stroke-width="2"/>
  <circle cx="138" cy="162" r="4" fill="#5C3D1E"/>
  <text x="112" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E" font-weight="bold">Door 1</text>
  <text x="112" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">your pick</text>
  <text x="112" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">1/3</text>

  <!-- Group bracket around doors 2 and 3 -->
  <rect x="180" y="92" width="185" height="212" rx="8" fill="#C4A87A" fill-opacity="0.15" stroke="#5C3D1E" stroke-width="2" stroke-dasharray="7,4"/>

  <!-- Door 2: opened, goat -->
  <rect x="195" y="100" width="75" height="120" rx="4" fill="none" stroke="#C4A87A" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="232" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#C4A87A" font-style="italic">goat</text>
  <text x="232" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E">Door 2</text>
  <text x="232" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">host opens</text>

  <!-- Door 3: switch target -->
  <rect x="278" y="100" width="75" height="120" rx="4" fill="#7C2530" fill-opacity="0.12" stroke="#7C2530" stroke-width="2"/>
  <circle cx="341" cy="162" r="4" fill="#5C3D1E"/>
  <text x="315" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530" font-weight="bold">Door 3</text>
  <text x="315" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">switch here</text>
  <text x="315" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">2/3</text>

  <text x="272" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">the group you didn&#8217;t pick holds 2/3 &#8212;</text>
  <text x="272" y="343" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">the host just showed you where it isn&#8217;t</text>

  <!-- Divider -->
  <line x1="400" y1="65" x2="400" y2="360" stroke="#D4C5A9" stroke-width="1.5"/>

  <!-- Right: the three equally likely worlds -->
  <text x="600" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Three equally likely worlds (you picked Door 1)</text>

  <rect x="430" y="98" width="340" height="52" rx="6" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="445" y="120" font-family="Georgia, serif" font-size="13" fill="#333">Car behind 1</text>
  <text x="445" y="140" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">host opens 2 or 3</text>
  <text x="755" y="120" text-anchor="end" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">stay wins</text>

  <rect x="430" y="160" width="340" height="52" rx="6" fill="#7C2530" fill-opacity="0.06" stroke="#7C2530" stroke-width="2"/>
  <text x="445" y="182" font-family="Georgia, serif" font-size="13" fill="#333">Car behind 2</text>
  <text x="445" y="202" font-family="Georgia, serif" font-size="12" fill="#7C2530">host must open 3</text>
  <text x="755" y="182" text-anchor="end" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">switch wins</text>

  <rect x="430" y="222" width="340" height="52" rx="6" fill="#7C2530" fill-opacity="0.06" stroke="#7C2530" stroke-width="2"/>
  <text x="445" y="244" font-family="Georgia, serif" font-size="13" fill="#333">Car behind 3</text>
  <text x="445" y="264" font-family="Georgia, serif" font-size="12" fill="#7C2530">host must open 2</text>
  <text x="755" y="244" text-anchor="end" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">switch wins</text>

  <text x="600" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5C3D1E">Stay wins 1 of 3  &#183;  Switch wins 2 of 3</text>
  <text x="600" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">The host knows where the car is &#8212; his forced reveal transfers</text>
  <text x="600" y="349" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">the group&#8217;s full 2/3 onto the one door he left closed.</text>

  <text x="400" y="382" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5C3D1E">Switching is really choosing both other doors at once.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Learning to Rank: Order Matters, Not Scores</text>
  <text x="400" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">The task is not "is this relevant?" but "which should come first?"</text>

  <!-- Query -->
  <rect x="60" y="120" width="130" height="50" fill="none" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="125" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">query q</text>

  <!-- arrow -->
  <line x1="192" y1="145" x2="232" y2="145" stroke="#5C3D1E" stroke-width="2"/>
  <path d="M 238 145 L 228 140 L 228 150 Z" fill="#5C3D1E"/>
  <text x="215" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">rank</text>

  <!-- Ranked list -->
  <rect x="245" y="95" width="185" height="38" fill="#2D5A8E" fill-opacity="0.12" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="337" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E" font-weight="bold">1. doc A</text>
  <rect x="245" y="143" width="185" height="38" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="337" y="167" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">2. doc B</text>
  <rect x="245" y="191" width="185" height="38" fill="none" stroke="#2D5A8E" stroke-width="1.5"/>
  <text x="337" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">3. doc C</text>
  <text x="337" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">only relative order counts &#8212;</text>
  <text x="337" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">A above B is the whole signal</text>

  <!-- Three loss families -->
  <rect x="480" y="95" width="270" height="235" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <text x="615" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Three families of ranking loss</text>

  <text x="615" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">Pointwise</text>
  <text x="615" y="169" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">score each item alone</text>
  <line x1="500" y1="180" x2="730" y2="180" stroke="#C4A87A" stroke-width="1"/>

  <text x="615" y="203" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">Pairwise</text>
  <text x="615" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">is A better than B?  (RankNet)</text>
  <line x1="500" y1="233" x2="730" y2="233" stroke="#C4A87A" stroke-width="1"/>

  <text x="615" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">Listwise</text>
  <text x="615" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">optimize the whole ordering</text>
  <text x="615" y="293" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">(LambdaMART, targets NDCG)</text>
  <text x="615" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">each family gets closer to the true objective</text>

  <text x="400" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-style="italic">Search, recommendations, ads, QA &#8212; anywhere an algorithm must sort items by estimated quality.</text>
</svg>

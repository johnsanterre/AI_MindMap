<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">The T-Test</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" font-style="italic">is the gap between two group means real, or just noise?</text>

  <defs>
    <marker id="ttR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#5C3D1E"/></marker>
    <marker id="ttL" markerWidth="9" markerHeight="9" refX="2" refY="3.5" orient="auto"><path d="M9,0 L9,7 L0,3.5 z" fill="#5C3D1E"/></marker>
  </defs>

  <!-- Baseline -->
  <line x1="60" y1="290" x2="700" y2="290" stroke="#5C3D1E" stroke-width="2"/>

  <!-- Group A bell (navy), mean 250 -->
  <path d="M110,289 C 170,287 200,265 220,220 C 235,185 242,165 250,160 C 258,165 265,185 280,220 C 300,265 330,287 390,289" fill="#2D5A8E" opacity="0.15"/>
  <path d="M110,289 C 170,287 200,265 220,220 C 235,185 242,165 250,160 C 258,165 265,185 280,220 C 300,265 330,287 390,289" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <line x1="250" y1="155" x2="250" y2="295" stroke="#2D5A8E" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="250" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E" font-weight="bold">x&#772;&#8320;</text>
  <text x="190" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">old roast</text>

  <!-- Group B bell (red), mean 470 -->
  <path d="M330,289 C 390,287 420,265 440,220 C 455,185 462,165 470,160 C 478,165 485,185 500,220 C 520,265 550,287 610,289" fill="#7C2530" opacity="0.15"/>
  <path d="M330,289 C 390,287 420,265 440,220 C 455,185 462,165 470,160 C 478,165 485,185 500,220 C 520,265 550,287 610,289" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <line x1="470" y1="155" x2="470" y2="295" stroke="#7C2530" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="470" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530" font-weight="bold">x&#772;&#8321;</text>
  <text x="533" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">new roast</text>

  <!-- Signal arrow -->
  <line x1="256" y1="118" x2="464" y2="118" stroke="#5C3D1E" stroke-width="2" marker-start="url(#ttL)" marker-end="url(#ttR)"/>
  <text x="360" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-weight="bold">signal: difference of means</text>

  <!-- Noise annotation -->
  <line x1="197" y1="255" x2="303" y2="255" stroke="#2D5A8E" stroke-width="1.5" marker-start="url(#ttL)" marker-end="url(#ttR)"/>
  <text x="360" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" font-style="italic">width of the bells = noise: scatter within each group</text>

  <!-- Right panel: the statistic -->
  <line x1="640" y1="95" x2="640" y2="330" stroke="#D4C5A9" stroke-width="2"/>
  <text x="712" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">t-statistic</text>
  <text x="712" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#333">t = signal / noise</text>
  <text x="712" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">= (x&#772;&#8321; &#8722; x&#772;&#8320;) / SE</text>
  <line x1="660" y1="204" x2="765" y2="204" stroke="#D4C5A9" stroke-width="1.5"/>
  <text x="712" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">large t &#8594; gap unlikely</text>
  <text x="712" y="244" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">to be luck (small p)</text>
  <text x="712" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">small t &#8594; gap could</text>
  <text x="712" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">easily be noise</text>

  <!-- Bottom analogy -->
  <text x="400" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Like hearing a voice across a street: the louder the noise, the bigger the shout (mean gap) must be before you trust it.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">ROC Curve and AUC</text>
  <!-- Shaded AUC area -->
  <path d="M110,350 C180,338 220,220 300,140 C380,78 480,64 660,62 L660,350 Z" fill="#C4A87A" fill-opacity="0.3"/>
  <!-- Axes -->
  <line x1="110" y1="350" x2="680" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="350" x2="110" y2="60" stroke="#333" stroke-width="2"/>
  <text x="395" y="384" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">False Positive Rate</text>
  <text x="52" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333" transform="rotate(-90,52,205)">True Positive Rate</text>
  <text x="110" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">0</text>
  <text x="680" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">1</text>
  <text x="96" y="355" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#333">0</text>
  <text x="96" y="66" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#333">1</text>
  <!-- Random diagonal -->
  <line x1="110" y1="350" x2="680" y2="60" stroke="#C4A87A" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="480" y="255" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5C3D1E">random guessing (AUC = 0.5)</text>
  <!-- ROC curve -->
  <path d="M110,350 C180,338 220,220 300,140 C380,78 480,64 660,62 L680,60" fill="none" stroke="#2D5A8E" stroke-width="3.5"/>
  <text x="340" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#5C3D1E">AUC &#8776; 0.85</text>
  <!-- Threshold points on curve -->
  <circle cx="300" cy="140" r="6" fill="#7C2530"/>
  <text x="288" y="126" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#7C2530">strict threshold</text>
  <circle cx="480" cy="64" r="6" fill="#7C2530"/>
  <text x="480" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">lenient threshold</text>
  <!-- Perfect corner -->
  <circle cx="110" cy="60" r="5" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="126" y="62" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">perfect (AUC = 1)</text>
  <!-- Key idea -->
  <text x="452" y="330" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">Each point = one threshold's tradeoff.</text>
  <text x="452" y="348" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">The curve shows all of them at once.</text>
</svg>

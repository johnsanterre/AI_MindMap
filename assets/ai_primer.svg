<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="4" y="4" width="792" height="392" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5C3D1E"/>
    </marker>
  </defs>
  <text x="400" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">AI Primer — A History of Forced Breakthroughs</text>
  <text x="400" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">Every major advance was forced by a constraint the previous approach could not solve</text>

  <!-- Timeline -->
  <line x1="60" y1="210" x2="740" y2="210" stroke="#5C3D1E" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="110" cy="210" r="6" fill="#2D5A8E"/>
  <circle cx="255" cy="210" r="6" fill="#7C2530"/>
  <circle cx="400" cy="210" r="6" fill="#7C2530"/>
  <circle cx="545" cy="210" r="6" fill="#2D5A8E"/>
  <circle cx="675" cy="210" r="6" fill="#2D5A8E"/>

  <!-- Era 1: above -->
  <rect x="45" y="100" width="130" height="76" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="110" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2D5A8E">Excitement</text>
  <text x="110" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">Minsky predicts</text>
  <text x="110" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">quick solutions;</text>
  <text x="110" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">promises fail</text>
  <text x="110" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">1950s&#8211;60s</text>

  <!-- Era 2: below -->
  <rect x="190" y="250" width="130" height="62" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="255" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#7C2530">First AI Winter</text>
  <text x="255" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">funding and faith</text>
  <text x="255" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">collapse</text>
  <text x="255" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">1970s</text>

  <!-- Era 3: above -->
  <rect x="335" y="100" width="130" height="76" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="400" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#7C2530">Second Winter</text>
  <text x="400" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">expert systems</text>
  <text x="400" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">stall; hype</text>
  <text x="400" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">turns toxic</text>
  <text x="400" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">1980s&#8211;90s</text>

  <!-- Era 4: below -->
  <rect x="480" y="250" width="130" height="62" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="545" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2D5A8E">Rebrand:</text>
  <text x="545" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2D5A8E">&#8220;Machine Learning&#8221;</text>
  <text x="545" y="302" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">lower expectations, escape hype</text>
  <text x="545" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">early 90s</text>

  <!-- Era 5: above -->
  <rect x="605" y="100" width="145" height="76" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="677" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2D5A8E">Statistical ML</text>
  <text x="677" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">statisticians systematize</text>
  <text x="677" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">CS algorithms; rise of</text>
  <text x="677" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">data science</text>
  <text x="675" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">late 90s +</text>

  <text x="400" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">The goal was never one problem &#8212; it was to learn <tspan font-style="italic">&#8220;what it means to learn&#8221;</tspan></text>
  <text x="400" y="376" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5C3D1E">Search a maze (CS view) &#8594; an algorithm with statistical properties (statistics view)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Dataset Distillation</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">Ten thousand books, rewritten as ten perfect pages</text>

  <!-- Left: huge dataset -->
  <rect x="45" y="95" width="230" height="220" rx="8" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="160" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Full dataset</text>
  <g fill="#2D5A8E" fill-opacity="0.55">
    <circle cx="75" cy="150" r="4"/><circle cx="100" cy="143" r="4"/><circle cx="125" cy="155" r="4"/><circle cx="150" cy="145" r="4"/><circle cx="175" cy="152" r="4"/><circle cx="200" cy="142" r="4"/><circle cx="225" cy="153" r="4"/><circle cx="250" cy="147" r="4"/>
    <circle cx="80" cy="180" r="4"/><circle cx="108" cy="188" r="4"/><circle cx="135" cy="176" r="4"/><circle cx="162" cy="186" r="4"/><circle cx="190" cy="178" r="4"/><circle cx="218" cy="188" r="4"/><circle cx="245" cy="180" r="4"/>
  </g>
  <g fill="#7C2530" fill-opacity="0.55">
    <circle cx="75" cy="218" r="4"/><circle cx="102" cy="226" r="4"/><circle cx="130" cy="214" r="4"/><circle cx="158" cy="224" r="4"/><circle cx="185" cy="216" r="4"/><circle cx="212" cy="227" r="4"/><circle cx="240" cy="218" r="4"/>
    <circle cx="82" cy="252" r="4"/><circle cx="110" cy="260" r="4"/><circle cx="138" cy="248" r="4"/><circle cx="165" cy="258" r="4"/><circle cx="192" cy="250" r="4"/><circle cx="220" cy="261" r="4"/><circle cx="248" cy="252" r="4"/>
  </g>
  <text x="160" y="298" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">~60,000 real, redundant examples</text>

  <!-- Funnel arrow -->
  <polygon points="295,140 295,270 420,225 420,185" fill="#C4A87A" fill-opacity="0.35" stroke="#C4A87A" stroke-width="1.5"/>
  <line x1="420" y1="205" x2="470" y2="205" stroke="#5C3D1E" stroke-width="2.5"/>
  <polygon points="470,205 457,198 457,212" fill="#5C3D1E"/>
  <text x="380" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">distill</text>
  <text x="380" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">optimize the</text>
  <text x="380" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">examples themselves</text>

  <!-- Right: tiny synthetic set -->
  <rect x="490" y="95" width="265" height="160" rx="8" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="622" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Distilled set</text>
  <circle cx="545" cy="165" r="10" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <circle cx="600" cy="158" r="10" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <circle cx="655" cy="167" r="10" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <circle cx="545" cy="215" r="10" fill="#FDFAF4" stroke="#7C2530" stroke-width="2.5"/>
  <circle cx="600" cy="222" r="10" fill="#FDFAF4" stroke="#7C2530" stroke-width="2.5"/>
  <circle cx="655" cy="213" r="10" fill="#FDFAF4" stroke="#7C2530" stroke-width="2.5"/>
  <text x="712" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">~10 synthetic</text>
  <text x="712" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">examples,</text>
  <text x="712" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">not real data</text>

  <!-- Accuracy comparison -->
  <text x="622" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3D1E">Train from scratch on each:</text>
  <rect x="520" y="305" width="180" height="14" fill="#2D5A8E"/>
  <text x="512" y="317" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#333">full</text>
  <text x="710" y="317" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">99%</text>
  <rect x="520" y="328" width="168" height="14" fill="#7C2530"/>
  <text x="512" y="340" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#333">distilled</text>
  <text x="698" y="340" font-family="Georgia, serif" font-size="12" fill="#7C2530">~96%</text>
</svg>

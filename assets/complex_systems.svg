<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="csA" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#5C3D1E"/></marker>
    <marker id="csN" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2D5A8E"/></marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Complex Systems: Simple Local Rules, Rich Global Order</text>

  <!-- Left: one bird and its three rules -->
  <text x="185" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">Each bird follows 3 rules</text>

  <circle cx="185" cy="170" r="14" fill="#2D5A8E"/>
  <circle cx="120" cy="140" r="9" fill="#C4A87A"/>
  <circle cx="245" cy="130" r="9" fill="#C4A87A"/>
  <circle cx="140" cy="215" r="9" fill="#C4A87A"/>
  <circle cx="240" cy="210" r="9" fill="#C4A87A"/>
  <line x1="185" y1="170" x2="132" y2="146" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="185" y1="170" x2="233" y2="137" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="185" y1="170" x2="149" y2="207" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="185" y1="170" x2="228" y2="203" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="185" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333">sees only its neighbors</text>

  <text x="90" y="290" font-family="Georgia, serif" font-size="14" fill="#333">1. stay close to neighbors</text>
  <text x="90" y="314" font-family="Georgia, serif" font-size="14" fill="#333">2. avoid collisions</text>
  <text x="90" y="338" font-family="Georgia, serif" font-size="14" fill="#333">3. match their direction</text>

  <!-- Emergence arrow -->
  <line x1="320" y1="200" x2="420" y2="200" stroke="#5C3D1E" stroke-width="3" marker-end="url(#csA)"/>
  <text x="370" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#5C3D1E">emergence</text>

  <!-- Right: murmuration -->
  <text x="600" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">The flock forms a shape no bird planned</text>

  <path d="M460,180 C500,120 570,105 630,120 C700,138 740,175 725,205 C705,240 640,250 580,235 C520,220 480,215 460,180 Z" fill="#7C2530" opacity="0.10"/>
  <g fill="#7C2530">
    <circle cx="490" cy="165" r="4"/><circle cx="510" cy="145" r="4"/><circle cx="535" cy="130" r="4"/><circle cx="565" cy="120" r="4"/>
    <circle cx="598" cy="116" r="4"/><circle cx="630" cy="120" r="4"/><circle cx="662" cy="130" r="4"/><circle cx="692" cy="146" r="4"/>
    <circle cx="713" cy="168" r="4"/><circle cx="720" cy="192" r="4"/><circle cx="704" cy="215" r="4"/><circle cx="675" cy="230" r="4"/>
    <circle cx="640" cy="237" r="4"/><circle cx="605" cy="235" r="4"/><circle cx="572" cy="227" r="4"/><circle cx="540" cy="215" r="4"/>
    <circle cx="510" cy="200" r="4"/><circle cx="527" cy="172" r="4"/><circle cx="558" cy="155" r="4"/><circle cx="592" cy="146" r="4"/>
    <circle cx="626" cy="148" r="4"/><circle cx="658" cy="158" r="4"/><circle cx="683" cy="175" r="4"/><circle cx="668" cy="200" r="4"/>
    <circle cx="636" cy="210" r="4"/><circle cx="600" cy="208" r="4"/><circle cx="568" cy="196" r="4"/>
  </g>
  <text x="600" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">No leader. No bird sees the whole flock.</text>

  <text x="600" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">The pattern exists only in the <tspan font-style="italic">relationships</tspan> between parts:</text>
  <text x="600" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">the whole is more than the sum of its parts.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">F1 Score: Balancing Precision and Recall</text>

  <!-- Confusion matrix -->
  <text x="185" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#333">Confusion matrix</text>
  <rect x="95" y="95" width="90" height="80" fill="#2D5A8E" opacity="0.85"/>
  <rect x="185" y="95" width="90" height="80" fill="#C4A87A" opacity="0.5"/>
  <rect x="95" y="175" width="90" height="80" fill="#7C2530" opacity="0.65"/>
  <rect x="185" y="175" width="90" height="80" fill="#FDFAF4" stroke="#D4C5A9"/>
  <rect x="95" y="95" width="180" height="160" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FDFAF4">TP</text>
  <text x="140" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FDFAF4">caught, wanted</text>
  <text x="230" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#5C3D1E">FN</text>
  <text x="230" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">slipped through</text>
  <text x="140" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FDFAF4">FP</text>
  <text x="140" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FDFAF4">junk in the net</text>
  <text x="230" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333">TN</text>
  <text x="140" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">predicted +</text>
  <text x="230" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">predicted &#8722;</text>
  <text x="78" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" transform="rotate(-90,78,135)">actual +</text>
  <text x="78" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333" transform="rotate(-90,78,215)">actual &#8722;</text>

  <!-- Two questions in tension -->
  <text x="545" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">Precision = TP / (TP + FP)</text>
  <text x="545" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">of what you caught, how much was the target?</text>
  <text x="545" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">Recall = TP / (TP + FN)</text>
  <text x="545" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">of all the targets out there, how many did you catch?</text>

  <!-- tension arrows -->
  <line x1="430" y1="196" x2="660" y2="196" stroke="#C4A87A" stroke-width="2"/>
  <path d="M426,196 L438,190 L438,202 Z" fill="#C4A87A"/>
  <path d="M664,196 L652,190 L652,202 Z" fill="#C4A87A"/>
  <text x="545" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5C3D1E">in tension: pushing one up usually pulls the other down</text>

  <!-- F1 formula box -->
  <rect x="380" y="235" width="330" height="80" fill="#C4A87A" opacity="0.2"/>
  <rect x="380" y="235" width="330" height="80" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <text x="545" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#5C3D1E">F1 = 2 &#183; P &#183; R / (P + R)</text>
  <text x="545" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">harmonic mean &#8212; high only when <tspan font-weight="bold">both</tspan> are high</text>

  <text x="400" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">A fishing net judged on two counts at once: purity of the catch and coverage of the lake.</text>
  <text x="400" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">P = 0.9, R = 0.1 gives F1 &#8776; 0.18 &#8212; the weak side dominates.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="arrN" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2D5A8E"/>
    </marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Hypothesis Testing: How Surprising Is the Evidence?</text>

  <!-- Step 1 -->
  <rect x="35" y="70" width="160" height="58" rx="6" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="115" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Assume H&#8320;</text>
  <text x="115" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">&#8220;nothing is happening&#8221;</text>

  <line x1="195" y1="99" x2="235" y2="99" stroke="#2D5A8E" stroke-width="2" marker-end="url(#arrN)"/>

  <!-- Step 2 -->
  <rect x="238" y="70" width="150" height="58" rx="6" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="313" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Collect data</text>
  <text x="313" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">the evidence</text>

  <line x1="388" y1="99" x2="428" y2="99" stroke="#2D5A8E" stroke-width="2" marker-end="url(#arrN)"/>

  <!-- Step 3 -->
  <rect x="431" y="70" width="180" height="58" rx="6" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="521" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Measure surprise</text>
  <text x="521" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">p-value under H&#8320;</text>

  <line x1="611" y1="99" x2="651" y2="99" stroke="#2D5A8E" stroke-width="2" marker-end="url(#arrN)"/>

  <!-- Step 4 -->
  <rect x="654" y="70" width="115" height="58" rx="6" fill="none" stroke="#5C3D1E" stroke-width="2"/>
  <text x="711" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Decide</text>
  <text x="711" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">compare p to &#945;</text>

  <!-- Null distribution -->
  <path d="M80,300 Q140,300 175,255 Q205,205 245,192 Q285,205 315,255 Q350,300 410,300"
        fill="#C4A87A" fill-opacity="0.25" stroke="#2D5A8E" stroke-width="2"/>
  <path d="M330,242 Q352,272 410,300 L330,300 Z" fill="#7C2530" fill-opacity="0.55"/>
  <line x1="70" y1="300" x2="420" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="352" y1="215" x2="352" y2="302" stroke="#7C2530" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="358" y="210" font-family="Georgia, serif" font-size="12" fill="#7C2530">observed statistic</text>
  <text x="245" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">what data would look like if H&#8320; were true</text>
  <text x="392" y="292" font-family="Georgia, serif" font-size="12" fill="#7C2530" text-anchor="end" font-style="italic"> </text>
  <text x="384" y="337" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">shaded tail = p-value</text>

  <!-- Decision outcomes -->
  <rect x="470" y="190" width="290" height="62" rx="6" fill="#7C2530" fill-opacity="0.08" stroke="#7C2530" stroke-width="2"/>
  <text x="615" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">p &lt; &#945;  &#8594;  Reject H&#8320;</text>
  <text x="615" y="237" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">evidence too surprising to keep the default</text>

  <rect x="470" y="272" width="290" height="62" rx="6" fill="#C4A87A" fill-opacity="0.2" stroke="#5C3D1E" stroke-width="2"/>
  <text x="615" y="297" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">p &#8805; &#945;  &#8594;  Fail to reject H&#8320;</text>
  <text x="615" y="319" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">not proof of H&#8320; &#8212; just insufficient evidence</text>

  <line x1="711" y1="128" x2="711" y2="188" stroke="#2D5A8E" stroke-width="2" marker-end="url(#arrN)"/>

  <text x="400" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">Like a jury trial: presume innocence, then ask if the evidence is surprising enough to convict.</text>
</svg>

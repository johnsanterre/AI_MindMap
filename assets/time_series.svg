<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect x="0" y="0" width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">Time Series: Trend + Season + Noise</text>

  <!-- observed series panel -->
  <rect x="60" y="55" width="680" height="120" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="75" y="75" font-size="14" font-weight="bold" fill="#7C2530">Observed series</text>
  <path d="M 75 150 L 105 138 L 135 152 L 165 128 L 195 140 L 225 118 L 255 132 L 285 108 L 315 122 L 345 100 L 375 116 L 405 94 L 435 108 L 465 88 L 495 102 L 525 82 L 555 96 L 585 76 L 615 92 L 645 72 L 675 86 L 720 68"
        fill="none" stroke="#7C2530" stroke-width="3"/>
  <line x1="60" y1="175" x2="740" y2="175" stroke="#5C3D1E" stroke-width="1"/>

  <!-- trend panel -->
  <rect x="60" y="195" width="330" height="80" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="75" y="215" font-size="14" font-weight="bold" fill="#2D5A8E">Trend</text>
  <line x1="80" y1="260" x2="370" y2="215" stroke="#2D5A8E" stroke-width="3"/>

  <!-- seasonal panel -->
  <rect x="410" y="195" width="330" height="80" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="425" y="215" font-size="14" font-weight="bold" fill="#C4A87A">Seasonality</text>
  <path d="M 425 240 Q 445 218 465 240 Q 485 262 505 240 Q 525 218 545 240 Q 565 262 585 240 Q 605 218 625 240 Q 645 262 665 240 Q 685 218 705 240"
        fill="none" stroke="#C4A87A" stroke-width="3"/>

  <!-- residual panel -->
  <rect x="60" y="295" width="330" height="80" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="75" y="315" font-size="14" font-weight="bold" fill="#5C3D1E">Residual noise</text>
  <path d="M 80 340 L 100 348 L 120 334 L 140 344 L 160 331 L 180 347 L 200 336 L 220 342 L 240 330 L 260 346 L 280 337 L 300 343 L 320 333 L 340 345 L 360 338 L 375 341"
        fill="none" stroke="#5C3D1E" stroke-width="2"/>

  <!-- forecast panel -->
  <rect x="410" y="295" width="330" height="80" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="425" y="315" font-size="14" font-weight="bold" fill="#7C2530">Forecast, widening uncertainty</text>
  <path d="M 430 355 L 530 340 L 700 322" fill="none" stroke="#7C2530" stroke-width="3" stroke-dasharray="7,5"/>
  <path d="M 530 340 L 700 300 L 700 344 Z" fill="#C4A87A" opacity="0.45" stroke="none"/>
  <line x1="530" y1="300" x2="530" y2="372" stroke="#2D5A8E" stroke-width="2" stroke-dasharray="3,4"/>
  <text x="536" y="370" font-size="12" font-style="italic" fill="#2D5A8E">now</text>

  <text x="400" y="188" text-anchor="middle" font-size="13" font-style="italic" fill="#5C3D1E">time &#8594;  (order carries the information)</text>
</svg>

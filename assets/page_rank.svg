<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">PageRank: Important Pages Are Linked To by Important Pages</text>
  <defs>
    <marker id="pk" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#5C3D1E"/></marker>
  </defs>

  <!-- graph: node size = PageRank -->
  <!-- edges -->
  <line x1="150" y1="150" x2="270" y2="200" stroke="#5C3D1E" stroke-width="2" marker-end="url(#pk)"/>
  <line x1="150" y1="300" x2="270" y2="228" stroke="#5C3D1E" stroke-width="2" marker-end="url(#pk)"/>
  <line x1="345" y1="218" x2="480" y2="160" stroke="#5C3D1E" stroke-width="2" marker-end="url(#pk)"/>
  <line x1="470" y1="310" x2="510" y2="196" stroke="#5C3D1E" stroke-width="2" marker-end="url(#pk)"/>
  <line x1="520" y1="118" x2="520" y2="80" stroke="#5C3D1E" stroke-width="2" marker-end="url(#pk)" opacity="0"/>
  <line x1="558" y1="160" x2="640" y2="260" stroke="#5C3D1E" stroke-width="2" marker-end="url(#pk)"/>

  <!-- small pages -->
  <circle cx="140" cy="145" r="18" fill="#C4A87A"/>
  <text x="140" y="150" text-anchor="middle" font-size="12" fill="#333">B</text>
  <circle cx="140" cy="305" r="18" fill="#C4A87A"/>
  <text x="140" y="310" text-anchor="middle" font-size="12" fill="#333">C</text>
  <!-- medium hub -->
  <circle cx="310" cy="215" r="32" fill="#2D5A8E"/>
  <text x="310" y="221" text-anchor="middle" font-size="14" fill="#FDFAF4" font-weight="bold">A</text>
  <circle cx="465" cy="322" r="16" fill="#C4A87A"/>
  <text x="465" y="327" text-anchor="middle" font-size="12" fill="#333">D</text>
  <!-- big authority -->
  <circle cx="520" cy="160" r="44" fill="#7C2530"/>
  <text x="520" y="156" text-anchor="middle" font-size="15" fill="#FDFAF4" font-weight="bold">E</text>
  <text x="520" y="174" text-anchor="middle" font-size="11" fill="#FDFAF4">highest rank</text>
  <!-- beneficiary of E's single link -->
  <circle cx="655" cy="280" r="28" fill="#2D5A8E"/>
  <text x="655" y="286" text-anchor="middle" font-size="13" fill="#FDFAF4" font-weight="bold">F</text>
  <text x="655" y="325" text-anchor="middle" font-size="11" fill="#2D5A8E">one link from E</text>
  <text x="655" y="340" text-anchor="middle" font-size="11" fill="#2D5A8E">outweighs many small ones</text>

  <text x="215" y="368" text-anchor="middle" font-size="12" fill="#333">node size = long-run share of a random surfer&#8217;s visits</text>

  <!-- formula panel -->
  <rect x="565" y="60" width="215" height="80" rx="6" fill="none" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="672" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">PR(u) = (1&#8722;d)/N + d&#183;&#931; PR(v)/out(v)</text>
  <text x="672" y="107" text-anchor="middle" font-size="12" fill="#333">d &#8776; 0.85: surfer sometimes</text>
  <text x="672" y="125" text-anchor="middle" font-size="12" fill="#333">jumps to a random page</text>

  <text x="400" y="382" text-anchor="middle" font-size="12" fill="#5C3D1E" font-style="italic">The circular definition resolves as the dominant eigenvector of the link matrix &#8212; the random surfer&#8217;s steady state.</text>
</svg>

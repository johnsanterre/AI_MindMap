<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">LU Decomposition: Do the Hard Work Once</text>

  <!-- A matrix -->
  <rect x="90" y="100" width="130" height="130" fill="none" stroke="#5C3D1E" stroke-width="2.5"/>
  <text x="155" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#5C3D1E">A</text>
  <text x="155" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">full, dense</text>

  <text x="255" y="173" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#333">=</text>

  <!-- L matrix: lower triangle shaded -->
  <rect x="290" y="100" width="130" height="130" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <polygon points="290,100 290,230 420,230" fill="#2D5A8E" opacity="0.25"/>
  <line x1="290" y1="100" x2="420" y2="230" stroke="#2D5A8E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="355" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#2D5A8E">L</text>
  <text x="322" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">the</text>
  <text x="322" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2D5A8E">multipliers</text>

  <text x="452" y="173" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#333">&#215;</text>

  <!-- U matrix: upper triangle shaded -->
  <rect x="485" y="100" width="130" height="130" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <polygon points="485,100 615,100 615,230" fill="#7C2530" opacity="0.25"/>
  <line x1="485" y1="100" x2="615" y2="230" stroke="#7C2530" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="550" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#7C2530">U</text>
  <text x="583" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">reduced</text>
  <text x="583" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">form</text>

  <text x="352" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#333">Gaussian elimination, written down as two triangular matrices</text>

  <!-- Payoff strip -->
  <rect x="90" y="288" width="290" height="76" rx="6" fill="#C4A87A" opacity="0.25"/>
  <rect x="90" y="288" width="290" height="76" rx="6" fill="none" stroke="#C4A87A" stroke-width="1.5"/>
  <text x="235" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Factor once (expensive)</text>
  <text x="235" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">A &#8594; L, U</text>
  <text x="235" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">the same work as one full elimination</text>

  <line x1="392" y1="326" x2="418" y2="326" stroke="#7C2530" stroke-width="3"/>
  <polygon points="418,319 434,326 418,333" fill="#7C2530"/>

  <rect x="445" y="288" width="290" height="76" rx="6" fill="none" stroke="#7C2530" stroke-width="1.5"/>
  <text x="590" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">Reuse for every new b (cheap)</text>
  <text x="590" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">solve Ly = b, then Ux = y</text>
  <text x="590" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">two quick triangular substitutions</text>
</svg>

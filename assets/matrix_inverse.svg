<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="8" y="8" width="784" height="384" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="arrMI" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2D5A8E"/>
    </marker>
    <marker id="arrMIr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7C2530"/>
    </marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Matrix Inverse: The Undo Button</text>

  <!-- Top: transform and undo story -->
  <!-- original square -->
  <rect x="90" y="105" width="70" height="70" fill="#2D5A8E" fill-opacity="0.15" stroke="#2D5A8E" stroke-width="2"/>
  <text x="125" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">start: v</text>

  <!-- A arrow -->
  <line x1="180" y1="140" x2="290" y2="140" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#arrMI)"/>
  <text x="235" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">apply A</text>

  <!-- transformed shape: sheared parallelogram -->
  <polygon points="320,175 390,175 415,105 345,105" fill="#7C2530" fill-opacity="0.15" stroke="#7C2530" stroke-width="2"/>
  <text x="368" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">transformed: Av</text>

  <!-- A^-1 arrow -->
  <line x1="440" y1="140" x2="550" y2="140" stroke="#7C2530" stroke-width="2.5" marker-end="url(#arrMIr)"/>
  <text x="495" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#7C2530">apply A&#8315;&#185;</text>

  <!-- restored square -->
  <rect x="580" y="105" width="70" height="70" fill="#2D5A8E" fill-opacity="0.15" stroke="#2D5A8E" stroke-width="2"/>
  <text x="615" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">back: A&#8315;&#185;Av = v</text>

  <text x="712" y="145" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-style="italic">exactly as</text>
  <text x="712" y="163" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-style="italic">if nothing</text>
  <text x="712" y="181" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-style="italic">happened</text>

  <!-- Bottom left: the identity equation -->
  <rect x="70" y="245" width="340" height="70" rx="6" fill="#C4A87A" fill-opacity="0.2" stroke="#5C3D1E" stroke-width="2"/>
  <text x="240" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#5C3D1E">A A&#8315;&#185; = A&#8315;&#185;A = I</text>
  <text x="240" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">I = &#8220;do nothing&#8221;: ones on the diagonal, Iv = v</text>

  <!-- Bottom right: when does it exist -->
  <rect x="440" y="245" width="290" height="70" rx="6" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="585" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">Does A&#8315;&#185; exist?</text>
  <text x="585" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">det(A) &#8800; 0  &#8594;  invertible</text>
  <text x="585" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">det(A) = 0  &#8594;  singular (space flattened, no undo)</text>

  <text x="400" y="356" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">Rotate a photo 45&#176; clockwise, then 45&#176; counterclockwise &#8212; the inverse cancels the transformation exactly.</text>
</svg>

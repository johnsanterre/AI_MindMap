<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Exploding Gradients</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Backprop multiplies layer by layer &#8212; repeated &#215;2 grows exponentially</text>

  <!-- layers, gradient flowing backward (right to left), circles growing -->
  <text x="700" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">output layer</text>
  <circle cx="700" cy="185" r="8" fill="#2D5A8E"/>
  <text x="700" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">&#8214;&#8711;&#8214; = 1</text>

  <line x1="686" y1="185" x2="594" y2="185" stroke="#5C3D1E" stroke-width="1.5"/>
  <path d="M594,185 L606,179 L606,191 Z" fill="#5C3D1E"/>
  <text x="640" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">&#215;2</text>

  <circle cx="575" cy="185" r="13" fill="#2D5A8E"/>
  <text x="575" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2D5A8E">2</text>

  <line x1="556" y1="185" x2="474" y2="185" stroke="#5C3D1E" stroke-width="1.5"/>
  <path d="M474,185 L486,179 L486,191 Z" fill="#5C3D1E"/>
  <text x="515" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">&#215;2</text>

  <circle cx="450" cy="185" r="20" fill="#7C2530" opacity="0.7"/>
  <text x="450" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">4</text>

  <line x1="424" y1="185" x2="344" y2="185" stroke="#5C3D1E" stroke-width="1.5"/>
  <path d="M344,185 L356,179 L356,191 Z" fill="#5C3D1E"/>
  <text x="385" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">&#215;2</text>

  <circle cx="310" cy="185" r="32" fill="#7C2530" opacity="0.85"/>
  <text x="310" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7C2530">8</text>

  <line x1="272" y1="185" x2="200" y2="185" stroke="#5C3D1E" stroke-width="1.5"/>
  <path d="M200,185 L212,179 L212,191 Z" fill="#5C3D1E"/>
  <text x="238" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5C3D1E">&#215;2</text>

  <circle cx="145" cy="185" r="50" fill="#7C2530"/>
  <text x="145" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#FDFAF4">16</text>
  <text x="145" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">early layers: huge update,</text>
  <text x="145" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#7C2530">training diverges (NaN)</text>

  <text x="425" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">gradient flows backward &#8592;&#8212; each layer amplifies it</text>

  <!-- fix box -->
  <rect x="430" y="290" width="330" height="70" fill="none" stroke="#2D5A8E" stroke-width="2"/>
  <text x="595" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2D5A8E">Fix: gradient clipping</text>
  <text x="595" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">if &#8214;g&#8214; &gt; c :  g &#8592; g &#183; c / &#8214;g&#8214;</text>

  <text x="220" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">Twin pathology: factors &lt; 1</text>
  <text x="220" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">give vanishing gradients</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Hyperparameter Search Strategies</text>
  <text x="400" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">Settings chosen before training (learning rate, depth, regularization) &#8212; found by trying, not solving</text>

  <!-- Panel 1: Grid -->
  <text x="150" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">Grid search</text>
  <rect x="60" y="112" width="180" height="180" fill="none" stroke="#5C3D1E" stroke-width="1.5"/>
  <circle cx="95" cy="147" r="5" fill="#2D5A8E" opacity="0.6"/>
  <circle cx="150" cy="147" r="5" fill="#2D5A8E" opacity="0.6"/>
  <circle cx="205" cy="147" r="5" fill="#2D5A8E" opacity="0.6"/>
  <circle cx="95" cy="202" r="5" fill="#2D5A8E" opacity="0.6"/>
  <circle cx="150" cy="202" r="7" fill="#7C2530"/>
  <circle cx="205" cy="202" r="5" fill="#2D5A8E" opacity="0.6"/>
  <circle cx="95" cy="257" r="5" fill="#2D5A8E" opacity="0.6"/>
  <circle cx="150" cy="257" r="5" fill="#2D5A8E" opacity="0.6"/>
  <circle cx="205" cy="257" r="5" fill="#2D5A8E" opacity="0.6"/>
  <text x="150" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">exhaustive lattice;</text>
  <text x="150" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">cost explodes with dials</text>

  <!-- Panel 2: Random -->
  <text x="400" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">Random search</text>
  <rect x="310" y="112" width="180" height="180" fill="none" stroke="#5C3D1E" stroke-width="1.5"/>
  <circle cx="340" cy="140" r="5" fill="#C4A87A"/>
  <circle cx="435" cy="128" r="5" fill="#C4A87A"/>
  <circle cx="392" cy="180" r="5" fill="#C4A87A"/>
  <circle cx="468" cy="205" r="5" fill="#C4A87A"/>
  <circle cx="330" cy="235" r="5" fill="#C4A87A"/>
  <circle cx="420" cy="262" r="5" fill="#C4A87A"/>
  <circle cx="365" cy="210 " r="7" fill="#7C2530"/>
  <circle cx="470" cy="150" r="5" fill="#C4A87A"/>
  <text x="400" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">scattered tries; better</text>
  <text x="400" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">coverage per budget</text>

  <!-- Panel 3: Bayesian -->
  <text x="650" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2D5A8E">Bayesian optimization</text>
  <rect x="560" y="112" width="180" height="180" fill="none" stroke="#5C3D1E" stroke-width="1.5"/>
  <path d="M570,270 Q605,200 630,165 Q655,120 685,155 Q712,185 732,255" fill="none" stroke="#2D5A8E" stroke-width="2.5"/>
  <circle cx="585" cy="255" r="5" fill="#C4A87A"/>
  <circle cx="700" cy="175" r="5" fill="#C4A87A"/>
  <circle cx="722" cy="230" r="5" fill="#C4A87A"/>
  <circle cx="632" cy="163" r="7" fill="#7C2530"/>
  <text x="650" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">each result updates a model</text>
  <text x="650" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">that guides the next guess</text>

  <text x="400" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5C3D1E">Dark red dot = best found. Like tuning an espresso machine: taste, learn, guess smarter.</text>
</svg>

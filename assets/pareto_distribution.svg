<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C3D1E">Pareto Distribution: The Heavy Tail Behind the 80/20 Rule</text>

  <!-- axes -->
  <line x1="80" y1="320" x2="480" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="80" y2="80" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="345" text-anchor="middle" font-size="13" fill="#333">value x (wealth, sales, city size&#8230;)</text>
  <text x="80" y="338" text-anchor="middle" font-size="12" fill="#333">x&#8342;</text>
  <text x="52" y="200" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90,52,200)">density f(x)</text>

  <!-- Pareto curve with heavy tail -->
  <path d="M85,90 C100,140 120,200 160,255 C210,295 300,312 480,318 L480,320 L85,320 Z" fill="#C4A87A" opacity="0.35"/>
  <path d="M85,90 C100,140 120,200 160,255 C210,295 300,312 480,318" fill="none" stroke="#7C2530" stroke-width="3"/>
  <text x="380" y="295" font-size="12" fill="#7C2530" font-weight="bold">heavy tail: extremes stay likely</text>

  <!-- thin-tail comparison -->
  <path d="M85,318 C130,300 160,180 200,140 C230,115 260,115 290,145 C330,190 360,300 400,318" fill="none" stroke="#2D5A8E" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="248" y="105" text-anchor="middle" font-size="12" fill="#2D5A8E">normal (thin tail)</text>

  <!-- 80/20 bar illustration -->
  <text x="640" y="90" text-anchor="middle" font-size="14" fill="#5C3D1E" font-weight="bold">The 80/20 pattern</text>
  <text x="640" y="112" text-anchor="middle" font-size="12" fill="#333">share of items &#8594; share of total</text>
  <rect x="540" y="130" width="40" height="150" fill="#7C2530"/>
  <rect x="580" y="250" width="160" height="30" fill="#C4A87A"/>
  <text x="560" y="300" text-anchor="middle" font-size="12" fill="#7C2530" font-weight="bold">top 20%</text>
  <text x="560" y="316" text-anchor="middle" font-size="12" fill="#7C2530">of items</text>
  <text x="660" y="300" text-anchor="middle" font-size="12" fill="#5C3D1E">bottom 80% of items</text>
  <text x="560" y="123" text-anchor="middle" font-size="0" fill="#333">.</text>
  <text x="600" y="160" font-size="12" fill="#333">&#8592; hold ~80%</text>
  <text x="600" y="176" font-size="12" fill="#333">of the total</text>
  <text x="660" y="243" text-anchor="middle" font-size="12" fill="#333">split the remaining ~20%</text>

  <!-- formula -->
  <rect x="530" y="330" width="220" height="0" fill="none"/>
  <text x="280" y="378" text-anchor="middle" font-size="13" fill="#333">f(x) = &#945; x&#8342;&#7488; / x&#7488;&#8314;&#185;,  x &#8805; x&#8342;</text>
  <text x="620" y="378" text-anchor="middle" font-size="12" fill="#5C3D1E" font-style="italic">Driven by preferential attachment: having more makes getting more easier.</text>
</svg>

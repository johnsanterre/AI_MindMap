<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="14" y="14" width="772" height="372" fill="none" stroke="#D4C5A9" stroke-width="2"/>

  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#7C2530">Where the Work Happens</text>

  <!-- ground line -->
  <line x1="110" y1="290" x2="690" y2="290" stroke="#5C3D1E" stroke-width="2"/>

  <!-- buildings -->
  <g stroke="#5C3D1E" stroke-width="1" stroke-opacity="0.3">
    <!-- 1: classical university with pediment and columns -->
    <g>
      <rect x="130" y="185" width="90" height="105" fill="#C4A87A"/>
      <polygon points="125,185 225,185 175,150" fill="#7C2530"/>
      <rect x="142" y="200" width="10" height="90" fill="#FDFAF4"/>
      <rect x="163" y="200" width="10" height="90" fill="#FDFAF4"/>
      <rect x="184" y="200" width="10" height="90" fill="#FDFAF4"/>
      <rect x="205" y="200" width="10" height="90" fill="#FDFAF4"/>
    </g>
    <!-- 2: tall navy tower (corporate lab) -->
    <g>
      <rect x="250" y="120" width="60" height="170" fill="#2D5A8E"/>
      <rect x="260" y="135" width="12" height="14" fill="#FDFAF4"/>
      <rect x="288" y="135" width="12" height="14" fill="#FDFAF4"/>
      <rect x="260" y="165" width="12" height="14" fill="#FDFAF4"/>
      <rect x="288" y="165" width="12" height="14" fill="#FDFAF4"/>
      <rect x="260" y="195" width="12" height="14" fill="#FDFAF4"/>
      <rect x="288" y="195" width="12" height="14" fill="#FDFAF4"/>
      <rect x="260" y="225" width="12" height="14" fill="#FDFAF4"/>
      <rect x="288" y="225" width="12" height="14" fill="#FDFAF4"/>
    </g>
    <!-- 3: mid brown institute with flat roof -->
    <g>
      <rect x="340" y="170" width="100" height="120" fill="#5C3D1E"/>
      <rect x="334" y="162" width="112" height="10" fill="#7C2530"/>
      <rect x="354" y="188" width="16" height="16" fill="#FDFAF4"/>
      <rect x="382" y="188" width="16" height="16" fill="#FDFAF4"/>
      <rect x="410" y="188" width="16" height="16" fill="#FDFAF4"/>
      <rect x="354" y="218" width="16" height="16" fill="#FDFAF4"/>
      <rect x="382" y="218" width="16" height="16" fill="#FDFAF4"/>
      <rect x="410" y="218" width="16" height="16" fill="#FDFAF4"/>
      <rect x="382" y="252" width="16" height="38" fill="#C4A87A"/>
    </g>
    <!-- 4: red campanile / bell tower -->
    <g>
      <rect x="470" y="140" width="42" height="150" fill="#7C2530"/>
      <polygon points="464,140 518,140 491,108" fill="#5C3D1E"/>
      <rect x="483" y="155" width="16" height="24" fill="#FDFAF4"/>
      <rect x="483" y="205" width="16" height="24" fill="#FDFAF4"/>
    </g>
    <!-- 5: low tan lab with sawtooth roof -->
    <g>
      <rect x="540" y="210" width="90" height="80" fill="#C4A87A"/>
      <polygon points="540,210 570,190 570,210" fill="#2D5A8E"/>
      <polygon points="570,210 600,190 600,210" fill="#2D5A8E"/>
      <polygon points="600,210 630,190 630,210" fill="#2D5A8E"/>
      <rect x="554" y="230" width="14" height="14" fill="#FDFAF4"/>
      <rect x="580" y="230" width="14" height="14" fill="#FDFAF4"/>
      <rect x="606" y="230" width="14" height="14" fill="#FDFAF4"/>
    </g>
    <!-- 6: slim navy column building -->
    <g>
      <rect x="650" y="175" width="34" height="115" fill="#2D5A8E"/>
      <rect x="658" y="190" width="18" height="10" fill="#FDFAF4"/>
      <rect x="658" y="212" width="18" height="10" fill="#FDFAF4"/>
      <rect x="658" y="234" width="18" height="10" fill="#FDFAF4"/>
    </g>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5C3D1E" letter-spacing="1">Universities &#183; Labs &#183; Institutes</text>
</svg>

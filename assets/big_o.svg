<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Big-O Notation: How Cost Grows with Input Size</text>

  <!-- Axes -->
  <line x1="90" y1="340" x2="600" y2="340" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="340" x2="90" y2="80" stroke="#333" stroke-width="1.5"/>
  <text x="345" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333">input size n</text>
  <text x="52" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333" transform="rotate(-90,52,210)">operations</text>

  <!-- O(n^2): deep red, steepest -->
  <path d="M90,340 Q300,330 420,220 T560,85" fill="none" stroke="#7C2530" stroke-width="3"/>
  <text x="570" y="88" font-family="Georgia, serif" font-size="14" fill="#7C2530" font-weight="bold">O(n&#178;)</text>

  <!-- O(n): navy, straight line -->
  <line x1="90" y1="340" x2="600" y2="160" stroke="#2D5A8E" stroke-width="3"/>
  <text x="610" y="162" font-family="Georgia, serif" font-size="14" fill="#2D5A8E" font-weight="bold">O(n)</text>

  <!-- O(log n): brown, flattening curve -->
  <path d="M90,340 C130,290 220,272 600,250" fill="none" stroke="#5C3D1E" stroke-width="3"/>
  <text x="610" y="253" font-family="Georgia, serif" font-size="14" fill="#5C3D1E" font-weight="bold">O(log n)</text>

  <!-- O(1): tan, flat -->
  <line x1="90" y1="318" x2="600" y2="318" stroke="#C4A87A" stroke-width="3"/>
  <text x="610" y="322" font-family="Georgia, serif" font-size="14" fill="#C4A87A" font-weight="bold">O(1)</text>

  <!-- Annotation: the shape, not the seconds -->
  <text x="150" y="110" font-family="Georgia, serif" font-size="13" fill="#333">Big-O describes the <tspan font-style="italic">shape</tspan> of growth,</text>
  <text x="150" y="128" font-family="Georgia, serif" font-size="13" fill="#333">not the running time in seconds.</text>

  <!-- Phone book example, right side -->
  <text x="700" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2D5A8E">Phone book, 1M names</text>
  <text x="700" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">page by page: ~1,000,000 steps</text>
  <text x="700" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">halving (binary search): ~20 steps</text>
</svg>

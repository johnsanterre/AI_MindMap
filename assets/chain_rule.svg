<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <defs>
    <marker id="crF" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2D5A8E"/></marker>
    <marker id="crB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#7C2530"/></marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">The Chain Rule: Sensitivities Multiply Along a Chain</text>

  <!-- assembly line: x -> g -> u -> f -> y -->
  <circle cx="140" cy="150" r="36" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="140" y="157" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#333">x</text>

  <line x1="180" y1="150" x2="286" y2="150" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#crF)"/>
  <text x="235" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#2D5A8E">g</text>

  <circle cx="330" cy="150" r="36" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="330" y="157" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#333">u</text>

  <line x1="370" y1="150" x2="476" y2="150" stroke="#2D5A8E" stroke-width="2.5" marker-end="url(#crF)"/>
  <text x="425" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#2D5A8E">f</text>

  <circle cx="520" cy="150" r="36" fill="#FDFAF4" stroke="#2D5A8E" stroke-width="2.5"/>
  <text x="520" y="157" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#333">y</text>

  <!-- local sensitivities under each link -->
  <text x="235" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C3D1E">du/dx</text>
  <text x="425" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C3D1E">dy/du</text>

  <!-- backward pass -->
  <path d="M484,205 L200,205" stroke="#7C2530" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#crB)"/>
  <text x="342" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#7C2530">backpropagation walks this chain in reverse</text>

  <!-- formula -->
  <rect x="120" y="260" width="440" height="70" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <text x="340" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#333">dy/dx  =  dy/du  &#183;  du/dx</text>
  <text x="340" y="317" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">total sensitivity = product of each link's local sensitivity</text>

  <!-- thermostat analogy, right -->
  <text x="675" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Thermostat analogy</text>
  <text x="675" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">dial &#8594; furnace</text>
  <text x="675" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">furnace &#8594; temperature</text>
  <text x="675" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">temperature &#8594; comfort</text>
  <text x="675" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#2D5A8E">a nudge at the dial ripples</text>
  <text x="675" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#2D5A8E">through every link</text>

  <text x="675" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">This is the engine of learning</text>
  <text x="675" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">in every neural network.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDFAF4"/>
  <rect x="12" y="12" width="776" height="376" fill="none" stroke="#D4C5A9" stroke-width="2"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#5C3D1E">Optimization: Descending the Loss Landscape in the Fog</text>

  <!-- axes -->
  <line x1="70" y1="320" x2="500" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="320" x2="70" y2="90" stroke="#333" stroke-width="1.5"/>
  <text x="285" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">weights &#952;</text>
  <text x="42" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333" transform="rotate(-90,42,205)">loss L(&#952;)</text>

  <!-- loss curve -->
  <path d="M 70,170 Q 110,110 150,150 Q 195,195 230,255 Q 258,290 290,215 Q 320,150 360,120 Q 405,90 450,105 Q 480,115 500,125"
        fill="none" stroke="#2D5A8E" stroke-width="3"/>

  <!-- gradient descent steps -->
  <circle cx="120" cy="121" r="5" fill="#7C2530"/>
  <circle cx="160" cy="160" r="5" fill="#7C2530"/>
  <circle cx="195" cy="205" r="5" fill="#7C2530"/>
  <circle cx="222" cy="245" r="5" fill="#7C2530"/>
  <path d="M 125,126 L 154,154 M 165,166 L 190,199 M 200,212 L 217,239" stroke="#7C2530" stroke-width="2"/>
  <text x="115" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#7C2530">start</text>
  <text x="152" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">each step: feel the</text>
  <text x="152" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C2530">slope, step downhill</text>

  <!-- landmarks -->
  <circle cx="252" cy="278" r="6" fill="none" stroke="#7C2530" stroke-width="2.5"/>
  <text x="252" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7C2530">local min</text>
  <circle cx="290" cy="215" r="6" fill="none" stroke="#C4A87A" stroke-width="2.5"/>
  <text x="298" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5C3D1E">saddle</text>
  <circle cx="405" cy="94" r="6" fill="#2D5A8E"/>
  <text x="405" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#2D5A8E">global min</text>

  <!-- rule + optimizer ladder -->
  <rect x="540" y="90" width="220" height="90" fill="none" stroke="#7C2530" stroke-width="2"/>
  <text x="650" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7C2530">The step</text>
  <text x="650" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333">&#952; &#8592; &#952; &#8722; &#945; &#183;&#8711;L(&#952;)</text>
  <text x="650" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">learning rate &#945; = stride length</text>

  <rect x="540" y="200" width="220" height="130" fill="none" stroke="#C4A87A" stroke-width="2"/>
  <text x="650" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3D1E">Smarter walkers</text>
  <text x="650" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">SGD &#8212; noisy steps on mini-batches</text>
  <text x="650" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Momentum &#8212; keep rolling downhill</text>
  <text x="650" y="294" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">Adam &#8212; adapt stride per weight</text>
  <text x="650" y="316" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">all variations on the same step</text>

  <text x="400" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5C3D1E" font-style="italic">The model never sees the whole landscape &#8212; only the local slope beneath its feet.</text>
</svg>
